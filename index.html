// ---------------------------------------------------------------------
// Import sanitising
//
// An imported file is untrusted input. Everything it contains eventually
// reaches innerHTML or the maths, so coerce it at the boundary rather than
// escaping at a dozen render sites. Entry ids in particular are interpolated
// into inline onclick handlers, so they are reduced to a safe character set.
// ---------------------------------------------------------------------
const DATE_KEY_RE = /^\d{4}-\d{2}-\d{2}$/;
function safeId(v, fallback) {
  const s = String(v == null ? '' : v).replace(/[^A-Za-z0-9_:.-]/g, '');
  return s || fallback;
}
function num(v, fallback) {
  const n = Number(v);
  return isFinite(n) ? n : fallback;
}
function cleanEntry(raw, dateKey, i) {
  if (!raw || typeof raw !== 'object') return null;
  const id = safeId(raw.id, `imp-${dateKey}-${i}`);
  const at = num(raw.at, NaN);
  const e = {
    id,
    at: isFinite(at) ? at : slotTimestamp(dateKey, 12),
    name: String(raw.name == null ? 'Unnamed food' : raw.name).slice(0, 200),
    brand: String(raw.brand || '').slice(0, 120),
    foodId: safeId(raw.foodId, ''),
    label: String(raw.label || '').slice(0, 120),
    calories: num(raw.calories, 0), protein: num(raw.protein, 0),
    carbs: num(raw.carbs, 0), fat: num(raw.fat, 0),
  };
  if (raw.unit) { e.unit = String(raw.unit).slice(0, 12); e.amount = num(raw.amount, 0); }
  if (raw.servingGrams != null) e.servingGrams = num(raw.servingGrams, null);
  if (raw.per100 && typeof raw.per100 === 'object') {
    e.per100 = {
      calories: num(raw.per100.calories, 0), protein: num(raw.per100.protein, 0),
      carbs: num(raw.per100.carbs, 0), fat: num(raw.per100.fat, 0),
    };
  }
  return e;
}
function cleanLogs(raw) {
  const out = {};
  if (!raw || typeof raw !== 'object') return out;
  Object.keys(raw).forEach((dk) => {
    if (!DATE_KEY_RE.test(dk)) return;           // 'foo' would poison addDays()
    const day = raw[dk];
    if (!day || typeof day !== 'object') return; // a null day crashes the dashboard
    const w = day.weightLbs == null ? null : num(day.weightLbs, null);
    const foods = Array.isArray(day.foods)
      ? day.foods.map((f, i) => cleanEntry(f, dk, i)).filter(Boolean) : [];
    out[dk] = { weightLbs: w, foods };
  });
  return out;
}
function cleanSavedFoods(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter((f) => f && typeof f === 'object').map((f, i) => {
    const o = Object.assign({}, f);
    o.id = safeId(f.id, `imported-${i}`);
    o.name = String(f.name == null ? 'Unnamed food' : f.name).slice(0, 200);
    o.servingLabel = String(f.servingLabel || '1 serving').slice(0, 80);
    ['calories', 'protein', 'carbs', 'fat', 'caloriesPer100', 'proteinPer100',
      'carbsPer100', 'fatPer100', 'servingGrams'].forEach((k) => {
      if (o[k] != null) o[k] = num(o[k], 0);
    });
    return o;
  });
}
// profile/targets carry meaningful STRING fields (sex, activityLevel,
// startDate, target-history source) alongside the numerics. A blanket
// numbers-only filter would silently delete them and break the restored
// account, so each is validated on its own terms.
function cleanProfile(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const w = num(raw.weightLbs, NaN);
  if (!isFinite(w) || w <= 0) return null;
  return {
    sex: raw.sex === 'female' ? 'female' : 'male',
    age: clamp(num(raw.age, 30), 1, 120),
    heightIn: clamp(num(raw.heightIn, 68), 1, 108),
    weightLbs: clamp(w, 1, 1500),
    startWeightLbs: clamp(num(raw.startWeightLbs, w), 1, 1500),
    goalWeightLbs: raw.goalWeightLbs == null ? null : clamp(num(raw.goalWeightLbs, 0), 1, 1500),
    // An unknown key would throw at ACTIVITY[...].mult
    activityLevel: Object.prototype.hasOwnProperty.call(ACTIVITY, raw.activityLevel)
      ? raw.activityLevel : 'moderate',
    goalRateLbsPerWeek: clamp(num(raw.goalRateLbsPerWeek, 0), -5, 5),
    proteinPerLb: clamp(num(raw.proteinPerLb, 1), 0, 3),
    fatPercent: clamp(num(raw.fatPercent, 0.28), 0, 1),
    startDate: DATE_KEY_RE.test(String(raw.startDate)) ? raw.startDate : todayKey(),
  };
}
function cleanTargetSnapshot(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const o = {
    calories: num(raw.calories, 0), protein: num(raw.protein, 0),
    fat: num(raw.fat, 0), carbs: num(raw.carbs, 0),
    estimatedTDEE: num(raw.estimatedTDEE, 0),
  };
  if (raw.daysUsed != null) o.daysUsed = num(raw.daysUsed, 0);
  if (raw.weeklyRateActual != null) o.weeklyRateActual = num(raw.weeklyRateActual, 0);
  if (DATE_KEY_RE.test(String(raw.date))) o.date = raw.date;
  if (raw.source != null) o.source = String(raw.source).replace(/[^A-Za-z0-9 _.:+-]/g, '').slice(0, 40);
  return o;
}
function cleanTargets(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const t = cleanTargetSnapshot(raw);
  if (!t || !isFinite(t.calories) || t.calories <= 0) return null;
  t.date = t.date || todayKey();
  const hist = Array.isArray(raw.history)
    ? raw.history.map(cleanTargetSnapshot).filter(Boolean) : [];
  t.history = hist.length ? hist : [Object.assign({}, t, { history: undefined })];
  delete t.history[0].history;
  return t;
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);

      // Two kinds of file. A full backup carries profile + targets and
      // replaces everything. A partial (e.g. a MacroFactor conversion) carries
      // only logs/savedFoods and MERGES, so importing history can't wipe the
      // account it's being imported into.
      if (data.merge || (!data.profile && !data.targets)) {
        if (!data.logs && !data.savedFoods) throw new Error('Nothing to merge');
        const incoming = cleanLogs(data.logs);
        const merged = Object.assign({}, S.logs);
        let addedDays = 0, addedFoods = 0;
        Object.keys(incoming).forEach((dk) => {
          const existing = merged[dk] || { weightLbs: null, foods: [] };
          const have = new Set((existing.foods || []).map((f) => f.id));
          const incomingFoods = incoming[dk].foods.filter((f) => !have.has(f.id));
          if (!merged[dk]) addedDays++;
          addedFoods += incomingFoods.length;
          merged[dk] = {
            weightLbs: existing.weightLbs != null ? existing.weightLbs : (incoming[dk].weightLbs ?? null),
            foods: (existing.foods || []).concat(incomingFoods),
          };
        });
        S.logs = merged;
        const haveSaved = new Set(S.savedFoods.map((f) => f.id));
        const newSaved = cleanSavedFoods(data.savedFoods).filter((f) => !haveSaved.has(f.id));
        S.savedFoods = S.savedFoods.concat(newSaved);
        persistLogs(); persistSavedFoods();
        render();
        toast(`Merged ${addedFoods} entries across ${addedDays || Object.keys(incoming).length} days`);
        return;
      }

      // Full restore. Strictly more destructive than "Erase all data" — it
      // wipes this account's history on every device — so it asks first, and
      // validates rather than trusting the file's shape.
      const profile = cleanProfile(data.profile);
      const targets = cleanTargets(data.targets);
      if (!profile || !targets) throw new Error('Missing or malformed profile/targets');
      const logs = cleanLogs(data.logs);
      const dayCount = Object.keys(logs).length;
      const mine = Object.keys(S.logs).length;
      if (!confirm(`Replace everything in this account with this backup?\n\n`
        + `Backup: ${dayCount} day${dayCount === 1 ? '' : 's'} of logs\n`
        + `Current: ${mine} day${mine === 1 ? '' : 's'} — these will be erased on all your devices.\n\n`
        + `This cannot be undone.`)) {
        toast('Import cancelled');
        return;
      }
      S.profile = profile; S.targets = targets;
      S.logs = logs; S.savedFoods = cleanSavedFoods(data.savedFoods);
      persistProfile(); persistTargets(); persistLogs(); persistSavedFoods();
      render(); toast('Backup restored');
    } catch (err) { toast('Could not read that file — is it a Tare backup?'); }
  };
  reader.readAsText(file);
}
window.importData = importData;
async function resetAllData() {
  if (!confirm('Erase ALL Tare data for this account? This cannot be undone.')) return;
  const empty = { profile: null, targets: null, logs: {}, savedFoods: [] };
  const uid = currentUid;
  const shardMonths = new Set(knownShardMonths);
  S.profile = null; S.targets = null; S.logs = {}; S.savedFoods = [];
  S.activeTab = 'dashboard'; S.currentDate = todayKey();
  if (uid) {

function resolveTheme(pref) {
  if (pref === 'system') return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  return pref;
}
function applyTheme() {
  const pref = readKey('theme') || 'dark';
  currentTheme = resolveTheme(pref);
  document.documentElement.setAttribute('data-theme', currentTheme);
  const mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.setAttribute('content', currentTheme === 'dark' ? '#15181A' : '#FAFAF7');
}
function setThemePref(pref) {
  writeKey('theme', pref);
  applyTheme();
  render();
}
window.setThemePref = setThemePref;
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if ((readKey('theme') || 'dark') === 'system') { applyTheme(); render(); }
  });
}

applyTheme();

// ---------------------------------------------------------------------
// App icon
//
// The mark is a dark "T" on an orange tile, sitting above a faint baseline —
// the tare line the app is named for.
//
// Two variants. iOS and Android apply their own rounded mask, so the icon
// they get is full-bleed square; giving them a pre-rounded tile produces
// visible double-rounded corners. Browser favicons aren't masked, so those
// get the rounded version.
//
// Critically, iOS silently IGNORES an SVG apple-touch-icon — it accepts PNG
// only, which is why the previous SVG data URI never appeared on the home
// screen. The SVG is rasterised to PNG through a canvas at runtime, so this
// still needs no build step and no separate image files.
// ---------------------------------------------------------------------
function tareIconSvg(rounded) {
  const corner = rounded ? 'rx="22"' : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
    <defs><linearGradient id="o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA24B"/><stop offset="1" stop-color="#E8642A"/>
    </linearGradient></defs>
    <rect width="100" height="100" ${corner} fill="url(#o)"/>
    <rect x="21" y="27" width="58" height="9" rx="4.5" fill="#14181B"/>
    <rect x="45.5" y="27" width="9" height="45" rx="4.5" fill="#14181B"/>
    <rect x="21" y="66" width="58" height="7" rx="3.5" fill="#14181B" opacity=".32"/>
  </svg>`;
}

function svgToPng(svg, size) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        c.getContext('2d').drawImage(img, 0, 0, size, size);
        resolve(c.toDataURL('image/png'));
      } catch (err) { reject(err); }
    };
    img.onerror = () => reject(new Error('icon rasterise failed'));
    img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  });
}

(function setupPWA() {
  const roundedUri = 'data:image/svg+xml;utf8,' + encodeURIComponent(tareIconSvg(true));
  document.getElementById('favicon-link').setAttribute('href', roundedUri);

  const bg = currentTheme === 'dark' ? '#15181A' : '#FAFAF7';
  const publish = (icons) => {
    const manifest = {
      name: 'Tare', short_name: 'Tare', start_url: '.', display: 'standalone',
      background_color: bg, theme_color: bg, icons,
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('manifest-link').setAttribute('href', URL.createObjectURL(blob));
  };
  // Publish an SVG manifest immediately so an install prompt is never iconless,
  // then upgrade to PNGs once rasterised.
  publish([{ src: roundedUri, sizes: 'any', type: 'image/svg+xml' }]);

  const square = tareIconSvg(false);
  Promise.all([svgToPng(square, 180), svgToPng(square, 192), svgToPng(square, 512)])
    .then(([apple, p192, p512]) => {
      document.getElementById('apple-icon-link').setAttribute('href', apple);
      publish([
        { src: p192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
        { src: p512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
      ]);
    })
    .catch((err) => {
      console.error('icon rasterise failed, falling back to SVG:', err);
      document.getElementById('apple-icon-link').setAttribute('href', roundedUri);
    });
})();

render();

// If the Firebase SDK never loads (offline, CDN blocked, script error), the
// auth listener never fires and we'd hang on "Loading…" forever. Surface a
// real message instead of a dead screen.
setTimeout(() => {
  if (S.authLoading) {
    S.authLoading = false;
    S.authConnectError = true;
    render();
  }
}, 10000);
</script>
