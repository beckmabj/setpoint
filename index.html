function last7DateKeys(endKey) {
  const out = [];
  for (let i = 6; i >= 0; i--) out.push(addDays(endKey, -i));
  return out;
}
function lastNDateKeys(n, endKey) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(addDays(endKey, -i));
  return out;
}

function renderDashboard() {
  const today = todayKey();
  const weekStart = startOfWeek(today);
  const weekDays = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(weekStart, i));
  const dayLetters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  const t = S.targets;

  // weekly nutrition strip data
  const macroKeys = [
    { key: 'calories', color: 'var(--calories)' },
    { key: 'protein', color: 'var(--brick)' },
    { key: 'fat', color: 'var(--amber)' },
    { key: 'carbs', color: 'var(--carbs)' },
  ];
  // Column per day, four tracks per column.
  // Deviation from target, not absolute intake. Five days that all land near
  // target produce five near-identical bars on an absolute scale; plotted as
  // distance from the line, the shape of the week is legible at a glance.
  // Over runs up in brick, under runs down in green, and a missed day is a
  // hairline on the axis rather than a zero-height bar pretending to be data.
  const DEV_FULL = 400;   // kcal of deviation that fills the half-height
  const DEV_H = 40;       // px per half
  const stripDays = weekDays.map((d, i) => {
    const dayLog = getDayLog(d);
    const logged = (dayLog.foods || []).length > 0;
    const isToday = d === today;
    const val = round(dayTotals(dayLog).calories);
    const diff = val - (t.calories || 0);
    const h = Math.min(DEV_H, (Math.abs(diff) / DEV_FULL) * DEV_H);
    const over = diff > 0;
    const title = logged
      ? `${formatShort(d)} · ${val} kcal · ${over ? '+' : ''}${diff} vs target`
      : `${formatShort(d)} · nothing logged`;
    const upper = logged && over
      ? `<div class="devbar devbar-up" style="height:${round(h, 1)}px;"></div>` : '';
    const lower = logged && !over
      ? `<div class="devbar devbar-down" style="height:${round(h, 1)}px;"></div>` : '';
    return `<button class="devday ${isToday ? 'is-today' : ''}" title="${esc(title)}" onclick="jumpToDayFromDash('${d}')">
      <div class="devhalf devhalf-up">${upper}</div>
      <div class="devaxis ${logged ? '' : 'is-empty'}"></div>
      <div class="devhalf devhalf-down">${lower}</div>
      <div class="devlabel">${dayLetters[i]}</div>
    </button>`;
  }).join('');

  const rem = S.dashMode === 'remaining';
  const todayTotals = dayTotals(getDayLog(today));
  const consumed = round(todayTotals.calories);
  const remaining = round(t.calories - todayTotals.calories);
  const ringPct = t.calories > 0 ? clamp(todayTotals.calories / t.calories, 0, 1) : 0;

  // Three readings around one gauge, rather than four competing tiles. The
  // centre is whichever mode is selected, so the toggle changes the headline
  // number instead of quietly re-scaling bars.
  const centreVal = rem ? remaining : consumed;
  const centreLabel = rem ? 'Remaining' : 'Consumed';
  const leftVal = rem ? consumed : remaining;
  const leftLabel = rem ? 'Consumed' : 'Remaining';

  const macroCols = [
    ['Protein', 'protein', 'var(--brick)'],
    ['Fat', 'fat', 'var(--amber)'],
    ['Carbs', 'carbs', 'var(--carbs)'],
  ].map(([label, key, color]) => {
    const val = round(todayTotals[key]);
    const tgt = round(t[key] || 0);
    const shown = rem ? round(tgt - val) : val;
    return `<div class="macro-col">
      <div class="macro-col-l">${label}</div>
      <div class="macro-col-rule" style="background:${color};"></div>
      <div class="macro-col-v">${shown} / ${tgt}g</div>
    </div>`;
  }).join('');

  return `
  <div class="dash-date">${formatLongDate(today)}</div>
  <h1 class="dash-title">TODAY</h1>

  <div class="sect-h">Daily Nutrition</div>
  <div class="gauge-wrap">
    ${svgArcGauge(ringPct, { size: 194, stroke: 12, color: COLOR.calories })}
    <div class="gauge-side gauge-left">
      <div class="gauge-side-v">${leftVal}</div><div class="gauge-side-l">${leftLabel}</div>
    </div>
    <div class="gauge-centre">
      <div class="gauge-centre-v">${centreVal}</div><div class="gauge-centre-l">${centreLabel}</div>
    </div>
    <div class="gauge-side gauge-right">
      <div class="gauge-side-v">${t.calories}</div><div class="gauge-side-l">Target</div>
    </div>
  </div>

  <div class="macro-cols">${macroCols}</div>

  <div class="mode-toggle">
    <button class="${!rem ? 'on' : ''}" onclick="setDashMode('consumed')">Consumed</button>
    <button class="${rem ? 'on' : ''}" onclick="setDashMode('remaining')">Remaining</button>
  </div>

  <div class="card mt4">
    <div class="row between mb3">
      <span class="sect-h" style="margin:0;">This week</span>
      <span class="t11 fainter mono">${weekDays.filter((d) => (getDayLog(d).foods || []).length).length} of 7 logged</span>
    </div>
    <div class="devstrip">${stripDays}</div>
    <div class="row between mt2">
      <span class="t10 fainter"><span class="devkey" style="background:var(--brick);"></span>over
        <span class="devkey" style="background:var(--carbs); margin-left:8px;"></span>under</span>
      <span class="t10 fainter mono">${t.calories} kcal target</span>
    </div>
  </div>

  <div class="sect-h">Insights &amp; Analytics</div>
  <div class="grid2 mb2">
    ${renderExpenditureCard()}
    ${renderWeightTrendCard()}
  </div>
  <div class="grid2 mb2">
    ${renderEnergyBalanceCard()}
    ${renderGoalProgressCard()}
  </div>

  <div class="sect-h">Habits</div>
  <div class="grid2">
    ${renderStreakCard('weighIn', 'Weigh-In')}
    ${renderStreakCard('foodLog', 'Food Logging')}
  </div>
  `;
}
function setDashMode(m) {
  S.dashMode = m === 'remaining' ? 'remaining' : 'consumed';
  writeKey('dashMode', S.dashMode);
  render();
}
window.setDashMode = setDashMode;


function setEnergyMode(m) { S.energyMode = m; render(); }
window.setEnergyMode = setEnergyMode;


// ---------------------------------------------------------------------
// Dashboard carousel mechanics (native scroll-snap; no library)
// ---------------------------------------------------------------------
// Pin the carousel to the tallest panel's content height, once. Cards then
// stretch to fill it, so shorter panels show a taller card rather than a gap,
// and swiping never changes the height.


function toggleExpand(key) { S.expanded[key] = !S.expanded[key]; render(); }
window.toggleExpand = toggleExpand;

// The single source of truth for the adaptive estimate. The dashboard card
// previously ran its own 7-day / 4-point variant while Strategy used 14/7, so
// the two screens reported different maintenance numbers with no explanation —
// and a 4-point regression on smoothed weight swings by hundreds of kcal
// day to day.
const TDEE_WINDOW = 14;
const TDEE_MIN_DAYS = 7;
function currentEstimate() {
  if (!S.profile) return { ok: false, reason: 'noweight', daysLogged: 0 };
  return estimateFromData(S.logs, S.profile, TDEE_WINDOW, TDEE_MIN_DAYS);
}

function renderExpenditureCard() {
  const today = todayKey();
  const est = currentEstimate();
  const days = lastNDateKeys(TDEE_WINDOW, today);
  const intakeVals = days.map((d) => dayTotals(getDayLog(d)).calories).filter((v) => v > 0);
  const open = !!S.expanded.expenditure;
  const body = est.ok
    ? `<div class="mono w700 t16">${est.estimatedTDEE}<span class="t11 faint w500"> kcal/day</span></div>
       ${svgSparkline(intakeVals.length ? intakeVals : [0], { w: 130, h: 34, color: COLOR.teal })}`
    : `<div class="faint t12" style="padding:8px 0;">Log weight + food on ${est.minDays || TDEE_MIN_DAYS}+ of the last ${TDEE_WINDOW} days to see this.</div>`;
  return `<div class="card tappable" onclick="toggleExpand('expenditure')">
    <div class="row between"><span class="t13 faint">Expenditure</span><span class="fainter t10">Last ${TDEE_WINDOW} days</span></div>
    ${body}
    ${open && est.ok ? `<div class="fainter t11 mt2">Estimated from ${est.daysUsed} days with both weight and food, against ${est.intakeDays} days of intake — your real trend, not a formula. Same figure as “Check my numbers” on Strategy.</div>` : ''}
  </div>`;
}

function renderWeightTrendCard() {
  const dateKeys = Object.keys(S.logs).sort();
  const withWeight = dateKeys.filter((k) => S.logs[k] && S.logs[k].weightLbs != null).map((k) => ({ date: k, weight: S.logs[k].weightLbs }));
  const trendSeries = computeTrendSeries(withWeight);
  const last7 = trendSeries.slice(-7);
  const open = !!S.expanded.weight;
  if (trendSeries.length === 0) {
    return `<div class="card span2"><div class="row between"><span class="t13 faint">Weight Trend</span><span class="fainter t10">Last 7 days</span></div>
      <div class="faint t12" style="padding:8px 0;">No weigh-ins yet.</div>
      ${weightEntryRow()}</div>`;
  }
  const current = trendSeries[trendSeries.length - 1].trend;
  let weeklyRate = 0;
  if (last7.length >= 2) {
    const pts = last7.map((p) => ({ x: daysBetween(last7[0].date, p.date), y: p.trend }));
    weeklyRate = round(linRegSlope(pts) * 7, 2);
  }
  return `<div class="card tappable${open ? ' span2' : ''}" onclick="toggleExpand('weight')">
    <div class="row between"><span class="t13 faint">Weight Trend</span><span class="fainter t10">Last 7 days</span></div>
    <div class="mono w700 t16">${current}<span class="t11 faint w500"> lbs</span></div>
    ${svgSparkline(last7.map((p) => p.trend), { w: 130, h: 34, color: COLOR.teal })}
    ${open ? renderWeightExpanded(trendSeries, weeklyRate) : ''}
  </div>`;
}
// Weigh-in entry lives with the weight data on the Dashboard, not in the food
// log. stopPropagation keeps taps inside it from collapsing the card.
function weightEntryRow() {
  // Date is editable so a missed morning can be backfilled. Without it a
  // skipped day stays permanently blank, which weakens the TDEE regression
  // that needs days with BOTH weight and food.
  const day = S.weighInDate || todayKey();
  const existing = getDayLog(day).weightLbs;
  return `<div class="col g2 mt3" onclick="event.stopPropagation()">
    <input class="input" type="date" id="weight-date" value="${day}" max="${todayKey()}"
           onchange="setWeighInDate(this.value)">
    <div class="row g2">
    <input class="input flex1" type="number" inputmode="decimal" step="any" id="weight-input"
           placeholder="Weight (lb)" value="${existing ?? ''}">
    <button class="btn btn-dark" onclick="saveWeightFromInput('${day}')">Save</button>
    </div>
  </div>`;
}

function renderWeightExpanded(trendSeries, weeklyRate) {
  const chartSlice = trendSeries.slice(-30);
  return `<div class="mt3">
    <div class="row g2 mb2">
      <span class="chip mono" style="background:${weeklyRate <= 0 ? 'var(--green-soft)' : 'var(--brick-soft)'}; color:${weeklyRate <= 0 ? 'var(--green)' : 'var(--brick)'};">${weeklyRate > 0 ? '+' : ''}${weeklyRate} lb/wk</span>
      <span class="fainter t11">goal ${S.profile.goalRateLbsPerWeek} lb/wk</span>
    </div>
    ${svgTrendChart(chartSlice.map((p) => p.weight), chartSlice.map((p) => p.trend), { w: 300, h: 130 })}
    <div class="fainter t11 mt1">Dots are raw weigh-ins. The line is your smoothed trend.</div>
    ${weightEntryRow()}
  </div>`;
}

function renderEnergyBalanceCard() {
  const today = todayKey();
  const days = last7DateKeys(today);
  const t = S.targets;
  const balances = days.map((d) => {
    const dl = getDayLog(d);
    if (!dl.foods || dl.foods.length === 0) return null;
    return dayTotals(dl).calories - t.estimatedTDEE;
  });
  const known = balances.filter((v) => v !== null);
  const open = !!S.expanded.energy;
  if (known.length === 0) {
    return `<div class="card"><div class="row between"><span class="t13 faint">Energy Balance</span><span class="fainter t10">Last 7 days</span></div>
      <div class="faint t12" style="padding:8px 0;">Log food to see this.</div></div>`;
  }
  const avg = round(known.reduce((a, b) => a + b, 0) / known.length);
  return `<div class="card tappable" onclick="toggleExpand('energy')">
    <div class="row between"><span class="t13 faint">Energy Balance</span><span class="fainter t10">Last 7 days</span></div>
    ${svgBarChart(balances.map((v) => v || 0), { w: 130, h: 40 })}
    <div class="mono w700 t14 mt1">${Math.abs(avg)} kcal ${avg <= 0 ? 'deficit' : 'surplus'}<span class="t11 faint w500"> avg/day</span></div>
    ${open ? `<div class="fainter t11 mt2">Balance vs. your estimated maintenance of ${t.estimatedTDEE} kcal/day.</div>` : ''}
  </div>`;
}

function renderGoalProgressCard() {
  const p = S.profile;
  const open = !!S.expanded.goal;
  if (p.goalWeightLbs == null) {
    return `<div class="card">
      <div class="row between"><span class="t13 faint">Goal Progress</span></div>
      <div class="faint t12" style="padding:6px 0 2px;">No goal weight set.</div>
      <button class="btn btn-outline btn-sm mt1" onclick="setTab('strategy')">Set a goal weight</button>
    </div>`;
  }
  const dateKeys = Object.keys(S.logs).sort();
  const withWeight = dateKeys.filter((k) => S.logs[k] && S.logs[k].weightLbs != null).map((k) => ({ date: k, weight: S.logs[k].weightLbs }));
  const trendSeries = computeTrendSeries(withWeight);
  const current = trendSeries.length ? trendSeries[trendSeries.length - 1].trend : p.startWeightLbs;
  const totalChange = p.startWeightLbs - p.goalWeightLbs;
  const doneSoFar = p.startWeightLbs - current;
  const pct = totalChange !== 0 ? clamp(doneSoFar / totalChange, 0, 1) : 0;
  return `<div class="card tappable" onclick="toggleExpand('goal')">
    <div class="row between"><span class="t13 faint">Goal Progress</span></div>
    <div class="mono w700 t16 mt1">${round(pct * 100)}%</div>
    <div class="bar-track mt1" style="background:var(--tan-soft);"><div class="bar-fill" style="width:${round(pct * 100)}%; background:var(--teal);"></div></div>
    ${open ? `<div class="fainter t11 mt2">${p.startWeightLbs} → ${p.goalWeightLbs} lbs · currently ${current} lbs (trend)</div>` : ''}
  </div>`;
}

function renderStreakCard(type, label) {
  const today = todayKey();
  const days30 = lastNDateKeys(30, today);
  const days7 = last7DateKeys(today);
  const isOn = (d) => {
    const dl = S.logs[d];
    if (!dl) return false;
    return type === 'weighIn' ? dl.weightLbs != null : !!(dl.foods && dl.foods.length > 0);
  };
  const grid = days30.map((d) => `<div class="streak-dot ${isOn(d) ? 'on' : ''}"></div>`).join('');
  const thisWeek = days7.filter(isOn).length;
  return `<div class="card">
    <div class="row between mb2"><span class="t13 w600">${label}</span>${iconScale}</div>
    <div class="streak-grid">${grid}</div>
    <div class="fainter t11 mt2">${thisWeek}/7 this week</div>
  </div>`;
}

function renderLog() {
  const cd = S.currentDate;
  const weekStart = startOfWeek(cd);
  const weekDays = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(weekStart, i));
  const dayLetters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  const t = S.targets;
  const dayLog = getDayLog(cd);
  const totals = dayTotals(dayLog);

  const strip = weekDays.map((d, i) => {
    const dTotals = dayTotals(getDayLog(d));
    const pct = t.calories > 0 ? dTotals.calories / t.calories : 0;
    const selected = d === cd;
    return `<div class="day-cell ${selected ? 'selected' : ''}">
      <div class="day-label">${dayLetters[i]}</div>
      <button class="day-btn" onclick="jumpToDate('${d}')">
        <div class="day-ring-wrap">
          ${svgRing(pct, { size: 34, stroke: 3.5, color: d === todayKey() ? COLOR.teal : COLOR.tan })}
          <div class="day-num" style="color:${selected ? 'var(--ink)' : 'var(--ink-fainter)'};">${dayOfMonth(d)}</div>
        </div>
      </button>
    </div>`;
  }).join('');

  // Four labelled progress bars rather than a row of bare fractions: the fill
  // shows how far through the day you are at a glance.
  const macroLine = `
    <div class="daybars mt3">
      ${[
        { k: 'calories', label: '', c: 'var(--calories)' },
        { k: 'protein', label: 'P ', c: 'var(--brick)' },
        { k: 'fat', label: 'F ', c: 'var(--amber)' },
        { k: 'carbs', label: 'C ', c: 'var(--carbs)' },
      ].map((m) => {
        const val = round(totals[m.k]);
        const target = t[m.k] || 1;
        const pct = round(clamp(val / target, 0, 1) * 100, 1);
        const over = val > target;
        return `<div class="daybar">
          <div class="daybar-val mono t11 ${over ? 'is-over' : ''}">${m.label}${val}<span class="fainter">/${target}</span></div>
          <div class="daybar-track"><div class="daybar-fill" style="width:${pct}%; background:${m.c};"></div></div>
        </div>`;
      }).join('')}
    </div>`;

  const foodItems = renderMealTimeline(cd, dayLog);

  return `
  <div class="dash-date">${formatLongDate(cd)}</div>
  <div class="row between mb3">
    <h1 class="dash-title" style="margin-bottom:0;">${cd === todayKey() ? 'TODAY' : formatShort(cd).toUpperCase()}</h1>
    <div class="row g2">
      <button class="ghost-btn" aria-label="Previous week" onclick="jumpToDate(addDays('${weekStart}', -7))">${iconChevronL}</button>
      <button class="ghost-btn" aria-label="Next week" onclick="jumpToDate(addDays('${weekStart}', 7))">${iconChevronR}</button>
    </div>
  </div>
  <div class="card">
    <div class="day-strip">${strip}</div>
    ${macroLine}
  </div>

  <div class="row between mb2 mt2">
    <span class="sect-h" style="margin:0;">Food log</span>
    <span class="fainter t11">${(dayLog.foods || []).length} item${(dayLog.foods || []).length === 1 ? '' : 's'}</span>
  </div>
  ${foodItems}
  <div class="log-searchbar-spacer"></div>
  <div class="log-searchbar">
    <button class="log-search" onclick="openPickerSearch('${cd}')">
      ${iconSearch}<span>Search for a food</span>
    </button>
    <button class="log-scan icon-btn" aria-label="Scan barcode" onclick="barcodeForDate('${cd}')">${iconBarcode}</button>
  </div>
  `;
}
// ---------------------------------------------------------------------
// Meal timeline
//
// Foods group into the hour they were logged, rather than into fixed
// "breakfast/lunch/dinner" buckets. The hours you actually eat at define
// your meals, and each hour carries its own totals and an add button.
// ---------------------------------------------------------------------
function hourLabel(h) {
  const period = h < 12 ? 'AM' : 'PM';
  const display = h % 12 === 0 ? 12 : h % 12;
  return `${display} ${period}`;
}

// A timestamp inside the given day at the given hour, for adding to a slot.
function slotTimestamp(dateKey, hour) {
  const [y, m, d] = dateKey.split('-').map(Number);
  return new Date(y, m - 1, d, hour, 0, 0, 0).getTime();
}

// A little visual anchor per food. Purely cosmetic, but it makes a long day
// scannable at a glance instead of a wall of identical rows.
const FOOD_EMOJI = [
  [/\begg white|egg-white/i, '🥚'], [/\beggs?\b/i, '🍳'], [/chicken|poultry|turkey/i, '🍗'],
  [/beef|steak|burger/i, '🥩'], [/pork|bacon|ham\b/i, '🥓'], [/fish|salmon|tuna|shrimp/i, '🐟'],
  [/rice\b/i, '🍚'], [/bread|toast|bagel|tortilla|wrap|pita/i, '🍞'], [/potato|hash brown|fries/i, '🥔'],
  [/pasta|noodle|spaghetti/i, '🍝'], [/yogurt|yoghurt/i, '🥛'], [/milk|creamer|cream\b/i, '🥛'],
  [/cheese|wedge/i, '🧀'], [/avocado/i, '🥑'], [/tomato/i, '🍅'], [/coleslaw|cabbage|slaw/i, '🥬'],
  [/salad|lettuce|greens|spinach|kale/i, '🥗'], [/broccoli|medley|vegetable|veggie/i, '🥦'],
  [/banana/i, '🍌'], [/apple/i, '🍎'], [/berr|strawberr/i, '🍓'], [/orange|citrus/i, '🍊'],
  [/nut|almond|peanut|cashew/i, '🥜'], [/protein bar|bar\b/i, '🍫'], [/chocolate|candy|cookie/i, '🍪'],
  [/chip|cracker|pretzel|snack/i, '🥨'], [/sauce|dressing|syrup|dip|condiment/i, '🥫'],
  [/oil|butter/i, '🧈'], [/coffee|espresso|latte/i, '☕'], [/soda|drink|juice|beverage/i, '🥤'],
  [/oat|cereal|granola/i, '🥣'], [/shake|smoothie|whey/i, '🥤'], [/soup|stew|chili/i, '🍲'],
];
function foodEmoji(name) {
  const n = String(name || '');
  for (const [re, e] of FOOD_EMOJI) if (re.test(n)) return e;
  return '🍽️';
}

// The day as a continuous timeline of hour slots, rather than only the hours
// that happen to contain food. Every hour is a place you can add to, which is
// how you actually think about a day.
function renderMealTimeline(cd, dayLog) {
  const foods = (dayLog.foods || []).slice().sort((a, b) => entryTime(a) - entryTime(b));
  const isToday = cd === todayKey();

  const byHour = new Map();
  let untimed = [];
  foods.forEach((f) => {
    const t = entryTime(f);
    if (t <= 0) { untimed.push(f); return; }
    const h = new Date(t).getHours();
    if (!byHour.has(h)) byHour.set(h, []);
    byHour.get(h).push(f);
  });

  // A normal eating day, 5 AM to 11 PM, always shown in full so you can go
  // back and add breakfast after logging dinner. The range widens on demand
  // rather than defaulting to all 24 rows: any hour that actually holds food
  // is included, as is the current hour, so a 1 AM snack or a night shift
  // still appears without padding every day with dead early-morning slots.
  const DAY_START = 5;
  const DAY_END = 23;
  const nowH = new Date().getHours();
  const marks = Array.from(byHour.keys());
  if (isToday) marks.push(nowH);
  const startH = Math.max(0, Math.min(DAY_START, ...marks));
  const endH = Math.min(23, Math.max(DAY_END, ...marks));
  const hours = [];
  for (let h = startH; h <= endH; h++) hours.push(h);

  const hourBlock = (h, items) => {
    const tot = (items || []).reduce((s, f) => ({
      calories: s.calories + (f.calories || 0), protein: s.protein + (f.protein || 0),
      fat: s.fat + (f.fat || 0), carbs: s.carbs + (f.carbs || 0),
    }), { calories: 0, protein: 0, fat: 0, carbs: 0 });

    const rows = (items || []).map((f) => {
      const ts = entryTime(f);
      const d = new Date(ts);
      const time = ts > 0 ? `${d.getHours() % 12 === 0 ? 12 : d.getHours() % 12}:${String(d.getMinutes()).padStart(2, '0')}` : '';
      return `<div class="tl-row">
        <div class="tl-time mono">${time}</div>
        <button class="tl-card" onclick="editEntry('${cd}','${jsId(f.id)}')">
          <span class="tl-emoji">${foodEmoji(f.name)}</span>
          <span class="tl-body">
            <span class="tl-name">${esc(f.name)}</span>
            <span class="tl-macros mono">${round(f.calories)} cal · ${round(f.protein)}P ${round(f.fat)}F ${round(f.carbs)}C · ${esc(f.label || '')}</span>
          </span>
          <span class="tl-edit">${iconPencil}</span>
        </button>
      </div>`;
    }).join('');

    const label = h < 0 ? 'Untimed' : hourLabel(h);
    const slot = h < 0 ? '' : `<button class="tl-add" aria-label="Add food at ${label}" onclick="openPicker('${cd}', ${slotTimestamp(cd, Math.max(0, h))})">${iconPlus}</button>`;
    return `<div class="tl-hour ${items && items.length ? '' : 'is-empty'} ${isToday && h === nowH ? 'is-now' : ''}">
      <div class="tl-hour-head">
        <span class="tl-hour-chip mono${h < 0 ? ' tl-hour-chip--auto' : ''}">${label}</span>
        ${slot}
        ${items && items.length ? `<span class="tl-hour-tot mono">${round(tot.calories)} cal · ${round(tot.protein)}P ${round(tot.fat)}F ${round(tot.carbs)}C</span>` : ''}
      </div>
      ${rows}
    </div>`;
  };

  const blocks = hours.map((h) => hourBlock(h, byHour.get(h))).join('');
  const untimedBlock = untimed.length ? hourBlock(-1, untimed) : '';
  return `<div class="tl">${untimedBlock}${blocks}</div>`;
}

// ---------------------------------------------------------------------
// Log entries
//
// Entries carry the food's per-100g values plus the amount and unit that
// produced them. Without that, an entry can't be re-logged from Recents or
// have its serving changed after the fact. Older entries predate these
// fields; everything that reads them falls back gracefully.
// ---------------------------------------------------------------------
// Timestamp for a new entry. Backfilling a past day previously stamped the
// current clock time, so every food added to an old day piled into whatever
// hour it happened to be now. Past days get a neutral midday instead.
function defaultEntryAt(dateKey, atMs) {
  if (atMs) return atMs;
  if (dateKey === todayKey()) return Date.now();
  return slotTimestamp(dateKey, 12);
}

function buildEntry(food, amount, unit, atMs) {
  const macros = macrosFor(food, amount, unit);
  return Object.assign({
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    at: atMs || Date.now(),
    name: food.name,
    brand: food.brand || '',
    foodId: food.id || '',
    amount: Number(amount) || 0,
    unit,
    servingGrams: food.servingGrams || null,
    per100: {
      calories: food.caloriesPer100, protein: food.proteinPer100,
      carbs: food.carbsPer100, fat: food.fatPer100, fiber: food.fiberPer100 || 0,
    },
    label: amountLabel(amount, unit, food.servingGrams),
  }, macros);
}

// An entry becomes a food again for re-logging.
function entryToFood(e) {
  const p = e.per100;
  if (!p) return null; // legacy entry, not re-loggable
  return {
    id: e.foodId || e.name, name: e.name, brand: e.brand || '',
    caloriesPer100: p.calories, proteinPer100: p.protein,
    carbsPer100: p.carbs, fatPer100: p.fat, fiberPer100: p.fiber || 0,
    servingGrams: e.servingGrams || null,
  };
}

// Must be STABLE. Returning Date.now() as the fallback made an entry with no
// recoverable timestamp drift between hour groups as the day passed, reorder
// Recents on every open, and export the wrong meal time. 0 sorts it first and
// never changes; renderMealTimeline buckets it under an "Untimed" heading.
function entryTime(e) {
  const t = Number(e.at) || Number(String(e.id).split('-')[0]);
  return isFinite(t) && t > 0 ? t : 0;
}

// Most recently logged foods across all days, de-duplicated, newest first.
function recentFoods(limit) {
  const seen = new Set();
  const out = [];
  const entries = [];
  Object.keys(S.logs).forEach((dk) => {
    ((S.logs[dk] || {}).foods || []).forEach((e) => entries.push(e));
  });
  entries.sort((a, b) => entryTime(b) - entryTime(a));
  for (const e of entries) {
    const food = entryToFood(e);
    if (!food) continue;
    const key = foodKey(e.foodId || e.name);
    if (seen.has(key)) continue;
    seen.add(key);
    out.push({ food, lastAmount: e.amount || 100, lastUnit: e.unit || 'g' });
    if (out.length >= (limit || 40)) break;
  }
  return out;
}

// ---- Favorites -------------------------------------------------------
// Identity for a food across storage paths. foodIds have been written both
// raw ("mf:pasture raised brown eggs") and safeId-stripped
// ("mf:pastureraisedbrowneggs"), so compare on a form that ignores the
// difference — otherwise the same food shows up twice in Recents and its
// favourite heart reads empty.
function foodKey(v) { return String(v == null ? '' : v).toLowerCase().replace(/[^a-z0-9:]/g, ''); }
function favKey(food) { return `fav-${foodKey(food.id || food.name)}`; }
function isFavorite(food) {
  if (!food) return false;
  const want = favKey(food);
  return S.savedFoods.some((f) => f.favorite
    && (f.id === want || `fav-${foodKey(f.foodId || f.name)}` === want));
}
function toggleFavorite() {
  const p = S.picker;
  const food = p.selectedOff || p.selectedRecent;
  if (!food) return;
  const key = favKey(food);
  if (isFavorite(food)) {
    S.savedFoods = S.savedFoods.filter((f) => !(f.favorite
      && (f.id === key || `fav-${foodKey(f.foodId || f.name)}` === key)));
    persistSavedFoods();
    toast('Removed from favorites');
  } else {
    saveFoodToLibrary({
      id: key, favorite: true, foodId: String(food.id || food.name),
      name: food.name, brand: food.brand || '',
      caloriesPer100: food.caloriesPer100, proteinPer100: food.proteinPer100,
      carbsPer100: food.carbsPer100, fatPer100: food.fatPer100,
      servingGrams: food.servingGrams || null,
      calories: round(food.caloriesPer100), protein: round(food.proteinPer100, 1),
      carbs: round(food.carbsPer100, 1), fat: round(food.fatPer100, 1), servingLabel: '100g',
    });
    toast('Added to favorites');
  }
  render();
}

// ---------------------------------------------------------------------
// Time-of-day picks
//
// Eating is habitual: the same few foods show up at the same hours. Scoring
// every logged food by how often it appears NEAR the current hour surfaces
// the handful you're actually about to eat, instead of a flat recency list.
//
// A +/-1 hour window with a half weight on the neighbours, so a 7:55 habit
// still counts at 8. Recency breaks ties, so a food dropped weeks ago sinks
// below one eaten yesterday at the same time.
// ---------------------------------------------------------------------
function picksForHour(hour, limit) {
  const scores = new Map();
  const now = Date.now();
  Object.keys(S.logs).forEach((dk) => {
    ((S.logs[dk] || {}).foods || []).forEach((e) => {
      const t = entryTime(e);
      if (t <= 0) return;
      const food = entryToFood(e);
      if (!food) return;
      const h = new Date(t).getHours();
      let diff = Math.abs(h - hour);
      if (diff > 12) diff = 24 - diff;      // 11 PM and 12 AM are an hour apart
      if (diff > 1) return;
      const weight = diff === 0 ? 1 : 0.5;
      const key = foodKey(e.foodId || e.name);
      const cur = scores.get(key) || { food, score: 0, last: 0, amount: e.amount || 100, unit: e.unit || 'g' };
      cur.score += weight;
      if (t > cur.last) { cur.last = t; cur.amount = e.amount || 100; cur.unit = e.unit || 'g'; cur.food = food; }
      scores.set(key, cur);
    });
  });
  return Array.from(scores.values())
    .filter((x) => x.score >= 1)            // one-off meals aren't habits
    .sort((a, b) => (b.score - a.score) || (b.last - a.last))
    .slice(0, limit || 6);
}

function selectPick(i) {
  const p = S.picker;
  const hour = p.at ? new Date(p.at).getHours() : new Date().getHours();
  const pick = picksForHour(hour, 6)[i];
  if (!pick) return;
  p.selectedRecent = pick.food;
  p.amount = pick.amount;
  p.unit = unitsFor(pick.food).includes(pick.unit) ? pick.unit : 'g';
  render();
  setTimeout(() => onAmountChange('recent'), 0);
}

    )).join('');
  }
  if (!out) {
    out = `<div class="faint t13" style="padding:14px 0;">Nothing logged yet. Foods you log will show up here for one-tap re-logging, and you can favorite the ones you eat most.</div>`;
  }

// ---- Editing an existing entry ---------------------------------------
// "I ate 150g not 100g" previously meant delete, re-search, re-enter. The
// entry already carries everything needed to reconstitute the food, so the
// same amount controls can just reopen against it.
function editEntry(dateKey, entryId) {
  const dl = getDayLog(dateKey);
  const entry = (dl.foods || []).find((f) => jsId(f.id) === entryId);
  if (!entry) return;
  const food = entryToFood(entry);
  if (!food) {
    // Pre-dates the per-100g entry shape, so there's no basis to rescale it.
    toast('This entry is too old to edit — delete and re-add it');
    return;
  }
  S.picker = {
    // 'search' is the tab that now owns the selected-food amount step; editing
    // hides the tab bar anyway, so this only decides which body renders.
    forDate: dateKey, at: entryTime(entry) || null, tab: 'search', query: '', results: [], status: 'idle',
    selectedOff: null, selectedRecent: food, selectedSaved: null, multiplier: 1,
    amount: entry.amount != null ? entry.amount : 100,
    unit: unitsFor(food).includes(entry.unit) ? entry.unit : 'g',

function ctxState(ctx) { return ctx === 'bc' ? S.barcode : S.picker; }

  return `
    <label class="field mb2"><span>Amount</span>

// ---------------------------------------------------------------------
// Food detail
//
// What this portion actually does to the day: the calorie split across
// macros, and how much of each daily target it eats. Rings rather than bars
// so it reads at a glance and matches the dashboard's language.
// ---------------------------------------------------------------------
function foodDetailPanel(ctx) {
  const st = ctxState(ctx), food = ctxFood(ctx);
  if (!st || !food) return '';
  const m = macrosFor(food, st.amount, st.unit);
  const t = S.targets || {};

  // Share of THIS portion's calories, from the macros themselves — a food
  // whose label kcal disagrees with 4/4/9 shouldn't skew the split.
  const fromMacros = m.protein * 4 + m.carbs * 4 + m.fat * 9;
  const pct = (kcal) => (fromMacros > 0 ? Math.round((kcal / fromMacros) * 100) : 0);
  const split = [
    { label: 'Protein', v: pct(m.protein * 4), c: COLOR.brick },
    { label: 'Fat', v: pct(m.fat * 9), c: COLOR.amber },
    { label: 'Carbs', v: pct(m.carbs * 4), c: COLOR.carbs },
  ];

  const impact = [
    { label: 'Calories', val: m.calories, target: t.calories, c: COLOR.calories },
    { label: 'Protein', val: m.protein, target: t.protein, c: COLOR.brick },
    { label: 'Fat', val: m.fat, target: t.fat, c: COLOR.amber },
    { label: 'Carbs', val: m.carbs, target: t.carbs, c: COLOR.carbs },
  ];

  const fibTarget = fiberTarget();
  const fibPct = fibTarget > 0 ? clamp(m.fiber / fibTarget, 0, 1) : 0;

  return `<div class="fd">
    <div class="fd-split">
      ${split.map((x) => `<span class="fd-chip" style="background:${x.c}1f; color:${x.c};">${x.v}% ${x.label}</span>`).join('')}
    </div>
    <div class="fd-label">Impact on today</div>
    <div class="fd-rings">
      ${impact.map((x) => {
        const p = x.target > 0 ? clamp(x.val / x.target, 0, 1) : 0;
        return `<div class="fd-ring">
          <div class="fd-ring-wrap">
            ${svgRing(p, { size: 46, stroke: 4, color: x.c })}
            <span class="fd-ring-pct mono">${Math.round(p * 100)}%</span>
          </div>
          <div class="fd-ring-label">${x.label}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="fd-label">Fiber</div>
    <div class="row between t11 mono faint mb1">
      <span>${m.fiber}g of ${fibTarget}g today</span><span>${Math.round(fibPct * 100)}%</span>
    </div>
    <div class="daybar-track"><div class="daybar-fill" style="width:${round(fibPct * 100, 1)}%; background:var(--green);"></div></div>
    <div class="fainter t10 mt1">Fiber goal follows your calorie target at 14g per 1,000 kcal.</div>
  </div>`;
}

function onAmountChange(ctx) {

  const el = document.getElementById(`${ctx}-amount`);

// Patches the pills in place instead of re-rendering. A full render() replaces

// most often make immediately after typing.
function setAmountUnit(ctx, unit) {
  const st = ctxState(ctx);
  if (!st) return;

  const pills = wrap ? wrap.querySelectorAll(`.pill-toggle button[onclick*="setAmountUnit('${ctx}'"]`) : [];
  pills.forEach((b) => {

// ---------------------------------------------------------------------
// Keyboard inset
//
// iOS doesn't resize a position:fixed overlay when the keyboard appears — it
// slides the visual viewport underneath. Without this the amount field, the
// macro tiles and the "Add to log" button all sit behind the keyboard and you
// have to dismiss it to find the button.
// ---------------------------------------------------------------------
function syncKeyboardInset() {
  const vv = window.visualViewport;
  if (!vv) return;
  const inset = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  document.documentElement.style.setProperty('--kb-inset', `${inset}px`);
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncKeyboardInset);
  window.visualViewport.addEventListener('scroll', syncKeyboardInset);
}
// Keep whatever you're typing in view once the sheet has been re-laid out.
document.addEventListener('focusin', (e) => {
  const el = e.target;
  if (!el || !el.matches || !el.matches('input, select, textarea')) return;
  if (!el.closest('.sheet')) return;
  setTimeout(() => {
    syncKeyboardInset();
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 250);
});
function macroTiles(idPrefix) {
  return `<div class="grid4">
    <div class="macro-tile"><div class="v" id="${idPrefix}-cal">0</div><div class="l">Cal</div></div>
    <div class="macro-tile"><div class="v" id="${idPrefix}-p">0g</div><div class="l">Protein</div></div>
    <div class="macro-tile"><div class="v" id="${idPrefix}-c">0g</div><div class="l">Carbs</div></div>
    <div class="macro-tile"><div class="v" id="${idPrefix}-f">0g</div><div class="l">Fat</div></div>

}

  document.getElementById(`${idPrefix}-p`).textContent = m.protein + 'g';
  document.getElementById(`${idPrefix}-c`).textContent = m.carbs + 'g';

async function doPickerSearch(e) {
  if (e) e.preventDefault();
  const q = document.getElementById('picker-query').value.trim();
  if (!q) return;
  S.picker.query = q; S.picker.status = 'loading'; S.picker.selectedOff = null;
  // Generation token: a slow first search must not overwrite a faster second.
  const seq = (S.picker.seq || 0) + 1;
  S.picker.seq = seq;
  render();
  try {
    const r = await searchFoods(q);
    if (!S.picker || S.picker.seq !== seq) return; // sheet closed, or superseded
    S.picker.results = r; S.picker.status = r.length ? 'idle' : 'empty';
  } catch (err) {
    console.error('food search failed:', err);
    if (!S.picker || S.picker.seq !== seq) return;
    S.picker.status = String(err.message) === 'rate-limited' ? 'ratelimit' : 'error';
  }
  render();
}
window.doPickerSearch = doPickerSearch;

function filterLibraryList() {

  const foods = shown('#lib-list .food-row');
  const toggle = (id, visible) => {
    const el = document.getElementById(id);
    if (el) el.style.display = visible ? '' : 'none';

// ---------------------------------------------------------------------
// Recipes
//
// A recipe is a saved combination of foods that logs as ONE entry. The entry it
// produces is the same flat shape confirmSaved() writes, so nothing that reads
// the log needs to know recipes exist — and deleting a recipe therefore cannot
// disturb entries already logged from it.
//
// Totals are stored, but always recomputed from the ingredients when built or
// imported, so the parts can never disagree with the sum.
// ---------------------------------------------------------------------

function recipeTotals(ingredients) {
  const totals = {};
  RECIPE_MACROS.forEach((k) => {
    totals[k] = round(ingredients.reduce((sum, g) => sum + (Number(g[k]) || 0), 0), k === 'calories' ? 0 : 1);
  });
  return totals;
}

// A log entry becomes a recipe ingredient. Keeps the per100/amount/unit that
// produced it so CLA-6's editor can rescale it later.
function entryToIngredient(entry) {
  const g = {
    name: entry.name,
    amount: num(entry.amount, 0),
    unit: ['g', 'oz', 'lb', 'serving'].includes(entry.unit) ? entry.unit : 'g',
    servingGrams: entry.servingGrams == null ? null : num(entry.servingGrams, 0),
    label: String(entry.label || ''),
  };
  RECIPE_MACROS.forEach((k) => { g[k] = num(entry[k], 0); });
  if (entry.per100) {
    g.per100 = {};
    RECIPE_MACROS.forEach((k) => { g.per100[k] = num(entry.per100[k], 0); });
  }
  return g;
}

function saveRecipe(name, ingredients) {
  const recipe = Object.assign({
    id: `recipe-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    name: String(name).trim().slice(0, 120),
    servingLabel: '1 serving',
    ingredients,
    createdAt: todayKey(),
  }, recipeTotals(ingredients));
  S.recipes = [recipe].concat(S.recipes);
  persistRecipes();
  return recipe;
}

  return S.recipes.find((r) => jsId(r.id) === id || r.id === id) || null;

  return m;
}

// ---------------------------------------------------------------------
// Copy tab
//
// Re-logging the same breakfast by hand every morning is the single most
// repeated action in the app. This copies entries forward from a day already
// logged, into the same hour they occupied there.
//
// A copied entry is a structural clone with a fresh id and timestamp, not a
// rebuild through buildEntry: cloning carries per100/amount/unit/servingGrams
// and the stored macros across untouched, so a copy is re-loggable and
// rescalable exactly like its source, with no chance of recomputed macros
// drifting from the original.
// ---------------------------------------------------------------------

// Legacy entries predating per100 cannot be re-logged; entryToFood is the
// existing test for that, so reuse it rather than inventing a second rule.
function copyableEntry(entry) {
  return entryToFood(entry) !== null;
}

// Days that hold copyable food, newest first, excluding the day being copied
// into. Testing for a copyable entry rather than any entry matters: a day of
// nothing but legacy foods would otherwise be offered and then dead-end on a
// screen where every row is disabled and the action reads "Copy 0 foods".
function copySourceDays() {
  const forDate = S.picker.forDate;
  return Object.keys(S.logs)
    .filter((key) => key !== forDate && ((S.logs[key] && S.logs[key].foods) || []).some(copyableEntry))
    .sort()
    .reverse();
}

function copyEntriesByHour(dateKey) {
  const foods = (getDayLog(dateKey).foods || []).slice().sort((a, b) => entryTime(a) - entryTime(b));
  const byHour = new Map();
  foods.forEach((f) => {
    const t = entryTime(f);
    // Untimed legacy entries group under midday, matching defaultEntryAt.
    const h = t > 0 ? new Date(t).getHours() : 12;
    if (!byHour.has(h)) byHour.set(h, []);
    byHour.get(h).push(f);
  });
  return [...byHour.entries()].sort((a, b) => a[0] - b[0]);
}

function copyPickedMap() {
  const p = S.picker;
  if (p.copyPicked) return p.copyPicked;
  // Everything copyable starts ticked: copying the whole day is the common case.
  const picked = {};
  (getDayLog(p.copyDay).foods || []).forEach((f) => {
    if (copyableEntry(f)) picked[f.id] = true;
  });
  p.copyPicked = picked;
  return picked;
}

function copyPickedCount() {
  const picked = copyPickedMap();
  return Object.keys(picked).filter((id) => picked[id]).length;
}

function renderPickerCopy() {
  const p = S.picker;

  if (!p.copyDay) {
    const days = copySourceDays();
    if (!days.length) {
      return `<div class="faint t13" style="padding:14px 0;">No other day has food logged yet. Once you have logged a day, you can copy it forward from here.</div>`;
    }
    return `
    <div class="t11 fainter w600 mb2" style="letter-spacing:.06em;">COPY FROM</div>
    ${days.map((key) => {
      const totals = dayTotals(getDayLog(key));
      const count = (getDayLog(key).foods || []).length;
      return `<button class="food-row" onclick="selectCopyDay('${jsId(key)}')">
        <div class="flex1" style="min-width:0;">
          <div class="t14 w500">${esc(copyDayLabel(key))}</div>
          <div class="t12 faint mono">${round(totals.calories)} kcal · ${count} item${count === 1 ? '' : 's'}</div>
        </div>
        ${iconChevronR}
      </button>`;
    }).join('')}`;
  }

  const picked = copyPickedMap();
  const groups = copyEntriesByHour(p.copyDay);
  const count = copyPickedCount();

  const rows = groups.map(([hour, items]) => `
    <div class="t11 fainter w600 mb2" style="letter-spacing:.06em;">${esc(hourLabel(hour).toUpperCase())}</div>
    ${items.map((f) => {
      const ok = copyableEntry(f);
      const on = ok && !!picked[f.id];
      return `<button class="food-row" ${ok ? `onclick="toggleCopyEntry('${jsId(f.id)}')" aria-pressed="${on}"` : 'disabled aria-disabled="true"'}>
        <span class="row-emoji mono" aria-hidden="true">${ok ? (on ? '✓' : '○') : '—'}</span>
        <div class="flex1" style="min-width:0;">
          <div class="t14 w500 ${ok ? '' : 'faint'}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(f.name)}</div>
          <div class="t12 faint mono">${ok
            ? `${round(f.calories)} kcal · ${esc(f.label || '')}`
            : 'saved before serving sizes were tracked — cannot be copied'}</div>
        </div>
      </button>`;
    }).join('')}
    <div class="mb3"></div>`).join('');

  return `
  <button class="btn btn-outline btn-sm mb2" onclick="backToCopyDays()">${iconChevronL} back</button>
  <div class="row between mb2">
    <div class="t15 w600">${esc(copyDayLabel(p.copyDay))}</div>
    <button class="btn btn-outline btn-sm" onclick="toggleAllCopyEntries()">${count ? 'Clear all' : 'Select all'}</button>
  </div>
  ${rows}
  <div class="sheet-actions">
    <button class="btn btn-primary btn-block" onclick="confirmCopyDay()" ${count ? '' : 'disabled'}>Copy ${count} food${count === 1 ? '' : 's'}</button>
    <button class="btn btn-outline btn-block mt2" onclick="saveTickedAsRecipe()" ${count ? '' : 'disabled'}>Save ${count === 1 ? 'it' : `these ${count}`} as a recipe</button>
  </div>`;
}

function copyDayLabel(dateKey) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const suffix = dateKey === addDays(todayKey(), -1) ? ' · yesterday' : '';
  return date.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + suffix;
}

function selectCopyDay(dateKey) {
  S.picker.copyDay = dateKey;
  S.picker.copyPicked = null;
  render();
}

function backToCopyDays() {

function toggleCopyEntry(id) {
  const picked = copyPickedMap();
  // The handler receives jsId(f.id); a legacy id containing a character jsId
  // strips would never match its raw value, so compare on the sanitised form.
  const entry = (getDayLog(S.picker.copyDay).foods || []).find((f) => jsId(f.id) === id || f.id === id);
  if (!entry) return;
  picked[entry.id] = !picked[entry.id];
  render();
}

function toggleAllCopyEntries() {
  const on = copyPickedCount() === 0;
  const picked = {};
  (getDayLog(S.picker.copyDay).foods || []).forEach((f) => {
    if (copyableEntry(f)) picked[f.id] = on;
  });

  render();
}

// The ticks already express "these foods, together" — the same selection that
// drives a copy is exactly what a recipe is, so it is offered here rather than
// making the user rebuild the list somewhere else.
function saveTickedAsRecipe() {
  const p = S.picker;
  const picked = copyPickedMap();
  const entries = (getDayLog(p.copyDay).foods || []).filter((f) => picked[f.id] && copyableEntry(f));
  if (!entries.length) return;

  const suggested = entries.length === 1 ? entries[0].name : '';
  const name = prompt(`Name this recipe (${entries.length} ingredient${entries.length === 1 ? '' : 's'})`, suggested);
  if (name == null) return;
  if (!String(name).trim()) { toast('A recipe needs a name'); return; }

  const recipe = saveRecipe(name, entries.map(entryToIngredient));
  closePicker();
  toast(`Saved “${recipe.name}” · ${round(recipe.calories)} kcal`);
}
window.saveTickedAsRecipe = saveTickedAsRecipe;

function confirmCopyDay() {
  const p = S.picker;
  const forDate = p.forDate;
  const picked = copyPickedMap();
  const source = (getDayLog(p.copyDay).foods || []).filter((f) => picked[f.id] && copyableEntry(f));
  if (!source.length) return;

  const copies = source.map((f, i) => {
    const t = entryTime(f);
    const hour = t > 0 ? new Date(t).getHours() : 12;
    return Object.assign({}, f, {
      // Date.now() alone collides when several entries are cloned in one tick.
      id: `${Date.now()}-${i}-${Math.random().toString(36).slice(2, 7)}`,
      at: slotTimestamp(forDate, hour),
    });
  });
  const newIds = new Set(copies.map((c) => c.id));

  // One write for the whole batch. Appending through addFoodEntry per entry
  // would rewrite the month shard once per food.
  const before = getDayLog(forDate);
  setDayLog(forDate, Object.assign({}, before, { foods: (before.foods || []).concat(copies) }));
  closePicker();
  toast(`Copied ${copies.length} food${copies.length === 1 ? '' : 's'}`, { label: 'Undo', onClick: () => {
    const current = getDayLog(forDate);
    setDayLog(forDate, Object.assign({}, current, {
      foods: (current.foods || []).filter((f) => !newIds.has(f.id)),
    }));
    render();
    toast('Copy undone');
  } });
}
window.confirmCopyDay = confirmCopyDay;

// ---------------------------------------------------------------------
// Camera barcode scanner
//
// Safari has no BarcodeDetector API, so iOS needs a decoder library. ZXing
// is imported lazily from a CDN the first time the scanner opens, so it
// costs nothing on load. Product barcodes are EAN/UPC, i.e. 1D, so the
// one-dimensional reader is used: it's faster and misreads less than the
// multi-format one.
//
// The overlay is appended to <body>, NOT into #app. render() replaces #app's
// innerHTML wholesale, which would tear out a live <video> mid-stream.
// ---------------------------------------------------------------------
let scanner = null;

function scannerAvailable() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext;
}

async function openScanner() {
  if (scanner) return;
  if (!scannerAvailable()) {
    toast(window.isSecureContext ? 'No camera available on this device' : 'Camera needs an https connection');
    return;
  }
  const el = document.createElement('div');
  el.className = 'scan-overlay';
  el.innerHTML = `
    <video class="scan-video" playsinline muted autoplay></video>
    <div class="scan-reticle"></div>
    <div class="scan-hint" id="scan-hint">Starting camera…</div>
    <div class="scan-bar">
      <button class="scan-btn" id="scan-cancel">Cancel</button>
      <span class="t12" style="color:rgba(255,255,255,0.7);">Hold steady over the barcode</span>
    </div>`;
  document.body.appendChild(el);
  scanner = { el, controls: null };
  el.querySelector('#scan-cancel').addEventListener('click', closeScanner);

  try {
    const { BrowserMultiFormatOneDReader } = await import('https://esm.sh/@zxing/browser@0.1.5');
    if (!scanner) return; // cancelled while the library was downloading
    const reader = new BrowserMultiFormatOneDReader();
    const hint = el.querySelector('#scan-hint');
    const controls = await reader.decodeFromConstraints(
      { video: { facingMode: { ideal: 'environment' } } },
      el.querySelector('video'),
      (result) => {
        // Fires continuously, including with no result; only act on a hit.
        if (!result || !scanner) return;
        const code = result.getText();
        closeScanner();
        onBarcodeScanned(code);
      },
    );
    if (!scanner) { controls.stop(); return; } // cancelled while camera started
    scanner.controls = controls;
    if (hint) hint.textContent = 'Point at the barcode';
  } catch (err) {
    console.error('scanner failed to start:', err);
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    const missing = err && (err.name === 'NotFoundError' || err.name === 'OverconstrainedError');
    closeScanner();
    toast(denied ? 'Camera permission denied' : missing ? 'No camera found' : 'Could not start the camera');
  }
}
window.openScanner = openScanner;

function closeScanner() {
  if (!scanner) return;
  const s = scanner;
  scanner = null; // clear first so in-flight callbacks bail out
  try { if (s.controls) s.controls.stop(); } catch (err) { /* already stopped */ }
  // Belt and braces: if startup failed after the stream was acquired, controls
  // was never assigned and nothing above would release the camera.
  try {
    const v = s.el && s.el.querySelector('video');
    if (v && v.srcObject) { v.srcObject.getTracks().forEach((t) => t.stop()); v.srcObject = null; }
  } catch (err) { /* nothing to release */ }
  if (s.el && s.el.parentNode) s.el.parentNode.removeChild(s.el);
}
window.closeScanner = closeScanner;

function onBarcodeScanned(code) {
  if (!S.barcode) S.barcode = { forDate: todayKey(), code: '', status: 'idle', product: null, amount: 100, unit: 'g' };
  S.barcode.code = code;
  render();
  lookupBarcode(null, code);
}
async function lookupBarcode(e, codeOverride) {
  if (e) e.preventDefault();
  const input = document.getElementById('barcode-input');
  const code = String(codeOverride != null ? codeOverride : (input ? input.value : '')).trim();
  if (!code || !S.barcode) return;
  S.barcode.code = code; S.barcode.status = 'loading'; S.barcode.product = null; render();
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${encodeURIComponent(code)}.json`);
    const data = await res.json();
    if (!S.barcode) return; // dismissed while in flight
    if (data.status === 1 && data.product && data.product.nutriments && data.product.nutriments['energy-kcal_100g'] != null) {
      const p = data.product;
      // serving_quantity is grams when serving_quantity_unit says so; OFF is
      // inconsistent, so only trust it when it looks like a mass.
      const sq = Number(p.serving_quantity);
      const squ = String(p.serving_quantity_unit || 'g').toLowerCase();
      const servingGrams = (sq > 0 && (squ === 'g' || squ === 'gram' || squ === 'grams')) ? sq : null;
      S.barcode.product = {
        id: code, name: p.product_name || `Item ${code}`, brand: p.brands ? p.brands.split(',')[0].trim() : '',
        caloriesPer100: p.nutriments['energy-kcal_100g'] || 0, proteinPer100: p.nutriments['proteins_100g'] || 0,
        carbsPer100: p.nutriments['carbohydrates_100g'] || 0, fatPer100: p.nutriments['fat_100g'] || 0,
        servingGrams,
      };
      S.barcode.status = 'found';
      if (servingGrams) { S.barcode.amount = 1; S.barcode.unit = 'serving'; }
      else { S.barcode.amount = 100; S.barcode.unit = 'g'; }
    } else { S.barcode.status = 'notfound'; }
  } catch (err) {
    console.error('barcode lookup failed:', err);
    if (S.barcode) S.barcode.status = 'error';
  }
  if (!S.barcode) return; // sheet dismissed while the lookup was in flight
  render();
  if (S.barcode.status === 'found') setTimeout(() => onAmountChange('bc'), 0);
}
window.lookupBarcode = lookupBarcode;
function confirmBarcode() {
  const b = S.barcode;
  addFoodEntry(b.forDate, buildEntry(b.product, b.amount, b.unit, defaultEntryAt(b.forDate, b.at)));
  closeBarcodeSheet(); toast('Added to log');
}

function renderBarcodeSheet() {
  const b = S.barcode;
  let body = `
    <button class="btn btn-primary btn-block mb3 row center g2" onclick="openScanner()">${iconCamera} Scan with camera</button>
    <div class="row center g2 mb3"><span class="line-rule"></span><span class="fainter t11">or type it</span><span class="line-rule"></span></div>
    <form onsubmit="lookupBarcode(event)" class="row g2 mb3">

      <button type="submit" class="btn btn-primary" style="padding:0 14px;">${iconSearch}</button>
    </form>`;
  if (b.status === 'loading') body += `<div class="faint t13" style="padding:16px 0; text-align:center;">Looking up…</div>`;
  if (b.status === 'notfound') body += `<div class="faint t13" style="padding:8px 0;">No product found for that barcode. Try "Custom" from the Log tab instead.</div>`;
  if (b.status === 'error') body += `<div class="t13" style="color:var(--brick); padding:8px 0;">Couldn't reach the food database. Check your connection.</div>`;
  if (b.status === 'found' && b.product) {

      ${amountControls('bc')}
      <div class="sheet-actions"><button class="btn btn-primary btn-block" onclick="confirmBarcode()">Add to log</button></div>`;
  }
  return `<div class="overlay" onclick="closeBarcodeSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="row between mb3"><span class="sect-h" style="margin:0;">Barcode</span><button class="icon-btn" onclick="closeBarcodeSheet()">${iconClose}</button></div>
      ${body}
    </div>
  </div>`;
}

// Macros are entered in grams and can disagree with the calorie figure, so

function manualSplitSummary(cal, p, f, c) {
  const fromMacros = Math.round(p * 4 + f * 9 + c * 4);
  const diff = Math.round(fromMacros - cal);
  if (!isFinite(fromMacros)) return '';
  // Real-world targets are rounded, so a small gap is normal, not an error:
  // 180P/60F/165C is 1920 kcal against a 1950 target.
  if (Math.abs(diff) <= 60) return `Macros add up to ${fromMacros} kcal — consistent with your ${cal} kcal target.`;
  return `Macros add up to ${fromMacros} kcal, ${Math.abs(diff)} ${diff > 0 ? 'above' : 'below'} the ${cal} kcal target. Both are saved as entered.`;
}

// ---------------------------------------------------------------------
// Duplicate foods
//
// The same food arrives under slightly different names — from an import, a
// barcode, a USDA result, a hand-typed entry ("Carb Smart 5 Seed Bread" vs
// "Live Carb Smart 5 Seed Bread"). Each spelling becomes its own Recents row
// and its own favourite, splitting the history for one real food.
//
// Detection is deliberately conservative: one normalised name must CONTAIN
// the other. That catches brand suffixes and added qualifiers without
// guessing at unrelated foods, and the merge is always confirmed.
// ---------------------------------------------------------------------
function normFoodName(v) { return String(v == null ? '' : v).toLowerCase().replace(/[^a-z0-9]/g, ''); }

function duplicateFoodGroups() {
  const stats = new Map();
  Object.keys(S.logs).forEach((dk) => {
    const day = S.logs[dk];
    if (!day || !day.foods) return;
    const seenToday = new Set();
    day.foods.forEach((e) => {
      const n = e.name;
      if (!n) return;
      const st = stats.get(n) || { name: n, entries: 0, days: 0 };
      st.entries++;
      if (!seenToday.has(n)) { st.days++; seenToday.add(n); }
      stats.set(n, st);
    });
  });
  const names = Array.from(stats.keys()).sort();
  const used = new Set();
  const groups = [];
  names.forEach((a, i) => {
    if (used.has(a)) return;
    const na = normFoodName(a);
    if (!na) return;
    const grp = [a];
    names.slice(i + 1).forEach((b) => {
      if (used.has(b)) return;
      const nb = normFoodName(b);
      if (nb && (na.indexOf(nb) >= 0 || nb.indexOf(na) >= 0)) grp.push(b);
    });
    if (grp.length > 1) {
      grp.forEach((g) => used.add(g));
      groups.push(grp.map((n) => stats.get(n)).sort((x, y) => y.entries - x.entries));
    }
  });
  return groups;
}

function renderDuplicateFoodsCard() {
  const groups = duplicateFoodGroups();
  if (!groups.length) return '';
  return `<div class="card">
    <div class="sect-h" style="margin:0 0 10px;">Duplicate foods</div>
    <div class="faint t12 mb3" style="line-height:1.5;">These look like the same food logged under different names, which splits your history and gives you two Recents rows. Pick the name to keep — the others are renamed to match. Your logged amounts and macros are untouched.</div>
    ${groups.map((g, gi) => `<div class="dupe-group">
      ${g.map((f, fi) => `<button class="dupe-row" onclick="mergeDuplicateGroup(${gi}, ${fi})">
        <span class="flex1"><span class="t13 w500">${esc(f.name)}</span>
          <span class="t11 fainter mono" style="display:block;">${f.entries} entr${f.entries === 1 ? 'y' : 'ies'} · ${f.days} day${f.days === 1 ? '' : 's'}</span></span>
        <span class="dupe-keep t11 w600">Keep</span>
      </button>`).join('')}
    </div>`).join('')}
  </div>`;
}

function mergeDuplicateGroup(groupIndex, keepIndex) {
  const groups = duplicateFoodGroups();
  const group = groups[groupIndex];
  if (!group) return;
  const canonical = group[keepIndex].name;
  const others = group.filter((f, i) => i !== keepIndex).map((f) => f.name);
  if (!others.length) return;
  const moving = group.filter((f, i) => i !== keepIndex).reduce((n, f) => n + f.entries, 0);
  if (!confirm(`Rename ${moving} entr${moving === 1 ? 'y' : 'ies'} to “${canonical}”?\n\nMerging: ${others.join(', ')}\n\nAmounts and macros stay exactly as logged.`)) return;

  // Reuse the canonical name's existing foodId so Recents and favourites line
  // up with the entries that already carried it.
  let fid = '';
  Object.keys(S.logs).forEach((dk) => {
    ((S.logs[dk] || {}).foods || []).forEach((e) => { if (!fid && e.name === canonical && e.foodId) fid = e.foodId; });
  });
  if (!fid) fid = foodKey(canonical);

  const rename = new Set(others);
  const months = new Set();
  const next = Object.assign({}, S.logs);
  let changed = 0;
  Object.keys(next).forEach((dk) => {
    const day = next[dk];
    if (!day || !day.foods) return;
    let touched = false;
    const foods = day.foods.map((e) => {
      if (!rename.has(e.name)) return e;
      touched = true; changed++;
      return Object.assign({}, e, { name: canonical, foodId: fid });
    });
    if (touched) { next[dk] = Object.assign({}, day, { foods }); months.add(monthOf(dk)); }
  });
  S.logs = next;
  if (months.size) persistLogs(Array.from(months));

  // Collapse saved/favourite records for the merged names onto one.
  const keys = new Set(others.map(normFoodName));
  const before = S.savedFoods.length;
  S.savedFoods = S.savedFoods.filter((f) => !keys.has(normFoodName(f.name)));
  if (S.savedFoods.length !== before) persistSavedFoods();

  render();
  toast(`Merged ${changed} entr${changed === 1 ? 'y' : 'ies'} into ${canonical}`);
}
window.mergeDuplicateGroup = mergeDuplicateGroup;
