  --tan: #93897A;
  --tan-soft: #26241F;

  --brick-soft: #3B241D;
  --green: #7FB584;
  --green-soft: #1F2C1F;

html { background: var(--paper); }
body, .card, .sheet, .nav-bar, #toast { transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease; }

* { box-sizing: border-box; }
html, body {

:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }

#app { max-width: 480px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); position: relative; min-height: 100dvh; }
.mono { font-family: 'IBM Plex Mono', monospace; }

/* layout helpers */
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.between { justify-content: space-between; }
.center { justify-content: center; align-items: center; }
.wrap { flex-wrap: wrap; }
.g1 { gap: 4px; } .g2 { gap: 8px; } .g3 { gap: 12px; } .g4 { gap: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.flex1 { flex: 1; }
.mt1{margin-top:4px;} .mt2{margin-top:8px;} .mt3{margin-top:12px;} .mt4{margin-top:16px;}
.mb1{margin-bottom:4px;} .mb2{margin-bottom:8px;} .mb3{margin-bottom:12px;} .mb4{margin-bottom:16px;}

/* text */
.faint { color: var(--ink-faint); }
.fainter { color: var(--ink-fainter); }
.t10{font-size:10px;} .t11{font-size:11px;} .t12{font-size:12px;} .t13{font-size:13px;}
.t14{font-size:14px;} .t15{font-size:15px;} .t16{font-size:16px;}
.w500{font-weight:500;} .w600{font-weight:600;} .w700{font-weight:700;}

/* surfaces */
.card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.card.tappable { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 12px; }
.pill-toggle { display: flex; background: var(--tan-soft); border-radius: 10px; padding: 3px; }
.pill-toggle button { flex: 1; border: none; background: transparent; padding: 8px 0; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; color: var(--ink-faint); }
.pill-toggle button.active { background: var(--paper-raised); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

/* buttons */
.btn { border: none; border-radius: 9px; font-size: 14px; font-weight: 600; padding: 10px 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn-primary { background: var(--accent-solid); color: #fff; }
.btn-dark { background: var(--btn-dark-bg); color: var(--btn-dark-fg); }
.btn-outline { background: transparent; border: 1px solid var(--line); color: var(--ink-faint); }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
/* Visual box stays small so rows keep their density; the ::after overlay

.icon-btn { background: none; border: none; color: var(--ink-fainter); cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; position: relative; -webkit-tap-highlight-color: transparent; }
.icon-btn::after { content: ''; position: absolute; inset: -10px; }
.ghost-btn { background: var(--tan-soft); border: none; border-radius: 8px; padding: 7px; color: var(--ink); cursor: pointer; display: flex; }

/* inputs */
label.field { display: flex; flex-direction: column; gap: 4px; }
label.field span { color: var(--ink-faint); font-size: 12px; }
.input, select.input {
  font-family: 'IBM Plex Mono', monospace; background: var(--paper); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 11px; font-size: 14px; color: var(--ink); width: 100%;
}
select.input { font-family: 'IBM Plex Sans', sans-serif; }
.input.sans { font-family: 'IBM Plex Sans', sans-serif; }

/* progress bars */
.bar-track { border-radius: 999px; height: 8px; width: 100%; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; transition: width 300ms ease; }

/* top app bar */
.app-title { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }

/* bottom nav */

.nav-item span { font-size: 10.5px; font-weight: 500; }

/* weekly day strip */

.day-cell button.day-btn { background: none; border: none; padding: 0; cursor: pointer; }

/* nutrition strip (dashboard) */
.nstrip-row { display: flex; align-items: flex-end; gap: 4px; height: 46px; margin-bottom: 6px; }

/* modal / sheet */
.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: var(--kb-inset, 0px); background: rgba(28,35,33,0.42); z-index: 50; display: flex; align-items: flex-end; justify-content: center; transition: bottom 140ms ease; }
.sheet { width: 100%; max-width: 480px; background: var(--paper); border-radius: 18px 18px 0 0; max-height: 86dvh; overflow-y: auto; padding: 16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); box-shadow: 0 -8px 30px rgba(0,0,0,0.15); -webkit-overflow-scrolling: touch; }

/* Camera scanner. Lives outside #app so render() can't destroy the <video>;
   deliberately fixed dark in both themes, since it sits over a camera feed. */
.scan-overlay { position: fixed; inset: 0; z-index: 90; background: #000; overflow: hidden; }
.scan-video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scan-reticle { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); width: 78%; max-width: 330px; aspect-ratio: 5 / 3; border: 2px solid rgba(255,255,255,0.92); border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.5); pointer-events: none; }
.scan-hint { position: absolute; left: 0; right: 0; top: calc(44% + 24vh); text-align: center; color: rgba(255,255,255,0.85); font-size: 13px; padding: 0 24px; pointer-events: none; }
.scan-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px calc(18px + env(safe-area-inset-bottom)); background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0)); }
.scan-btn { border: 1px solid rgba(255,255,255,0.45); background: rgba(0,0,0,0.35); color: #fff; border-radius: 9px; font-size: 14px; font-weight: 600; padding: 10px 18px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.line-rule { flex: 1; height: 1px; background: var(--line); }
.toast-action { margin-left: 12px; background: none; border: none; color: var(--teal-deep); font-weight: 700; font-size: 13px; cursor: pointer; padding: 2px 4px; }
/* A day with nothing logged: a hairline track, never a filled bar */
.nstrip-empty { height: 3px !important; background: var(--line-strong) !important; opacity: .55; }

/* Connection state, shown persistently in the top bar rather than as a toast */
.sync-pill { display: inline-flex; align-items: center; min-height: 18px; }
.sync-pill > span { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.sync-off { background: var(--tan-soft); color: var(--ink-faint); }
.sync-warn { background: var(--brick-soft); color: var(--brick); }
.sync-syncing { background: var(--teal-soft); color: var(--teal); }
/* Lets a grid2 card go full-width when its expanded content needs the room */
.grid2 > .span2 { grid-column: 1 / -1; }

/* Meal timeline: foods grouped by the hour they were logged */
.meal-group { margin-bottom: 16px; }
.meal-hour { font-size: 12px; font-weight: 600; color: var(--ink-faint); background: var(--tan-soft); border-radius: 999px; padding: 3px 10px; }
.meal-add { border: 1px dashed var(--line-strong); background: transparent; color: var(--ink-faint); border-radius: 999px; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; position: relative; -webkit-tap-highlight-color: transparent; }
.meal-add::after { content: ''; position: absolute; inset: -9px; }
.meal-add svg { width: 13px; height: 13px; }
.meal-add:hover { color: var(--teal); border-color: var(--teal); }
.meal-item { display: flex; align-items: center; gap: 8px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
@media (min-width: 480px) { .overlay { align-items: center; } .sheet { border-radius: 18px; max-height: 80vh; } }

/* food picker tabs reuse .pill-toggle */
.food-row { display: flex; align-items: center; justify-content: space-between; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; }
.food-row + .food-row { margin-top: 6px; }
.macro-tile { background: var(--tan-soft); border-radius: 8px; padding: 7px 0; text-align: center; }
.macro-tile .v { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; }
.macro-tile .l { font-size: 10.5px; color: var(--ink-faint); }

/* empty state */
.empty { text-align: center; color: var(--ink-faint); font-size: 13.5px; padding: 24px 16px; }

/* toast */
#toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px); background: #1C2321; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 80; opacity: 0; transition: all 220ms ease; pointer-events: none; }

/* shortcuts sheet */
.shortcut-grid { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
.shortcut-btn { display: flex; flex-direction: column; align-items: center; gap: 7px; background: none; border: none; cursor: pointer; flex: 1; -webkit-tap-highlight-color: transparent; }
.shortcut-circle { width: 52px; height: 52px; border-radius: 50%; background: var(--tan-soft); display: flex; align-items: center; justify-content: center; color: var(--ink); }
.shortcut-btn span { font-size: 11.5px; color: var(--ink-faint); }
.shortcut-row { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--line); background: none; border-left: none; border-right: none; border-top: none; width: 100%; text-align: left; cursor: pointer; color: var(--ink); }
.shortcut-row:last-child { border-bottom: none; }
.shortcut-row.disabled { opacity: 0.4; cursor: default; }
.shortcut-row .icon-wrap { width: 22px; display: flex; justify-content: center; color: var(--ink-faint); }
.shortcut-row .grow { flex: 1; font-size: 14.5px; }
.soon-chip { font-size: 10px; background: var(--tan-soft); color: var(--ink-faint); padding: 2px 7px; border-radius: 999px; }

/* dashboard carousel */
.dash-carousel-wrap { margin-bottom: 14px; }
/* One fixed height for the whole carousel, sized to the tallest panel, with
   every card stretched to fill it. Sizing to the ACTIVE page removed the dead
   gap but made the carousel jump on every swipe; stretching the cards removes
   the gap without any resize. */
.dash-carousel { display: flex; align-items: stretch; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.dash-carousel::-webkit-scrollbar { display: none; }
.dash-page { flex: 0 0 100%; scroll-snap-align: start; min-width: 0; display: flex; }
.dash-page > .card { flex: 1; margin-bottom: 0; }
.dash-page .card { margin-bottom: 0; }
.dash-dots { display: flex; justify-content: center; gap: 10px; margin-top: 10px; padding: 6px 0; }
.dash-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--line-strong); border: none; padding: 0; cursor: pointer; transition: all 180ms ease; position: relative; }
.dash-dot::after { content: ''; position: absolute; inset: -19px -9px; }
.dash-dot.active { background: var(--ink-faint); width: 16px; }

/* big ring (Daily Nutrition page) */
.big-ring-wrap { position: relative; width: 164px; height: 164px; flex-shrink: 0; }
.big-ring-wrap svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.big-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
<script>
(function() {
  try {
    var raw = localStorage.getItem('setpoint:theme');
    var pref = raw ? JSON.parse(raw) : 'dark';
    var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
    signInWithEmailAndPassword, signOut, sendPasswordResetEmail,
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import {
    initializeFirestore, persistentLocalCache, persistentSingleTabManager,
    getFirestore, doc, getDoc, setDoc, collection, getDocs, writeBatch, deleteField,
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDujgRY5OXTcPVojR1Cr1v7DMcSsioSx7k",
    authDomain: "setpoint-f9948.firebaseapp.com",
    projectId: "setpoint-f9948",
    storageBucket: "setpoint-f9948.firebasestorage.app",
    messagingSenderId: "957285099675",
    appId: "1:957285099675:web:7fae7e5cada7bd1f507e3e",
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);

  // Persistent local cache (IndexedDB). Without it Firestore keeps everything
  // in memory only: a write made with no connection is lost the moment the
  // app is closed, even though the UI already showed the food as logged.
  // With it, writes are durably queued on the device and flushed on reconnect.
  //
  // Single-tab manager rather than multi-tab: this is a phone app, and the
  // multi-tab coordinator adds leader-election overhead we don't need.
  let fbDb;
  try {
    fbDb = initializeFirestore(fbApp, {
      localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }),
    });
  } catch (err) {
    // Private browsing, blocked storage, or a second tab winning the lock.
    console.error('persistent cache unavailable, falling back to memory:', err);
    fbDb = getFirestore(fbApp);
    window.__tarePersistenceFailed = true;
  }

  window.FB = {
    createUser: (email, pw) => createUserWithEmailAndPassword(fbAuth, email, pw),
    signIn: (email, pw) => signInWithEmailAndPassword(fbAuth, email, pw),
    signOutUser: () => signOut(fbAuth),
    resetPassword: (email) => sendPasswordResetEmail(fbAuth, email),
    getUserDoc: (uid) => getDoc(doc(fbDb, 'users', uid)),
    // Deliberately NOT awaited by callers when offline: with persistence on,
    // setDoc's promise only settles once the server acknowledges, which may be
    // hours away. The write is durable in IndexedDB as soon as this returns.
    setUserDoc: (uid, data) => setDoc(doc(fbDb, 'users', uid), data, { merge: true }),

    // ---- Log shards: users/{uid}/logs/{YYYY-MM} ----
    // Logs used to live as one `logs` map on the user document. Firestore caps
    // a document at 1 MiB, which at roughly 250 bytes per entry is a couple of
    // years of logging, after which EVERY write fails. Months are separate
    // documents so a write only ever rewrites the month it touched.
    getLogShards: (uid) => getDocs(collection(fbDb, 'users', uid, 'logs')),
    setLogShard: (uid, month, days) =>
      setDoc(doc(fbDb, 'users', uid, 'logs', month), { days }, { merge: false }),
    writeLogShards: (uid, shards) => {
      const batch = writeBatch(fbDb);
      Object.keys(shards).forEach((m) => {
        batch.set(doc(fbDb, 'users', uid, 'logs', m), { days: shards[m] }, { merge: false });
      });
      return batch.commit();
    },
    // Only called AFTER shards are confirmed written.
    clearLegacyLogs: (uid) => setDoc(doc(fbDb, 'users', uid), { logs: deleteField() }, { merge: true }),
  };

  onAuthStateChanged(fbAuth, (user) => {
    if (window.onAuthReady) window.onAuthReady(user);
  });
</script>
<script>
'use strict';

// ---------------------------------------------------------------------
// Local device storage — theme preference ONLY. Everything else (profile,
// targets, logs, saved foods) now lives in Firestore, tied to the signed-in
// account, so it syncs across devices and isn't lost if this browser's
// storage is cleared.
// ---------------------------------------------------------------------
// Storage namespace keeps the old name deliberately: it isn't user-visible,
// and onAuthReady migrates pre-Firebase local data out of these keys.
// Renaming it would orphan any data still sitting there.
const NS = 'setpoint:';
function readKey(k) {
  try {
    const v = localStorage.getItem(NS + k);
    return v ? JSON.parse(v) : null;
  } catch (e) { console.error('read failed', k, e); return null; }
}
function writeKey(k, v) {
  try { localStorage.setItem(NS + k, JSON.stringify(v)); return true; }
  catch (e) { console.error('write failed', k, e); toast('Could not save — storage may be full.'); return false; }
}

let toastTimer = null;
function toast(msg, action) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  if (action && action.label && action.onClick) {
    const btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.textContent = action.label;
    btn.onclick = () => { el.classList.remove('show'); clearTimeout(toastTimer); action.onClick(); };
    el.appendChild(btn);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), action ? 6000 : 2400);
}

// ---------------------------------------------------------------------
// Date / math helpers
// ---------------------------------------------------------------------
function todayKey(d) {
  d = d || new Date();
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');

// ---------------------------------------------------------------------
// Serving units
//
// Nutrition data is per 100g, so every unit resolves to grams. "serving" is
// only offered when the food declares a serving weight; otherwise there is
// nothing to convert against.
// ---------------------------------------------------------------------
const GRAMS_PER_OZ = 28.349523125;
const GRAMS_PER_LB = 453.59237;

function unitToGrams(amount, unit, servingGrams) {
  const n = Number(amount) || 0;
  if (unit === 'oz') return n * GRAMS_PER_OZ;
  if (unit === 'lb') return n * GRAMS_PER_LB;
  if (unit === 'serving') return n * (Number(servingGrams) || 0);
  return n; // grams
}

function unitsFor(food) {
  const base = ['g', 'oz', 'lb'];
  return (food && Number(food.servingGrams) > 0) ? base.concat(['serving']) : base;
}

// Macros for a given amount of a per-100g food.
function macrosFor(food, amount, unit) {
  const g = unitToGrams(amount, unit, food.servingGrams);
  return {
    calories: round((food.caloriesPer100 * g) / 100),
    protein: round((food.proteinPer100 * g) / 100, 1),
    carbs: round((food.carbsPer100 * g) / 100, 1),
    fat: round((food.fatPer100 * g) / 100, 1),
  };
}

function amountLabel(amount, unit, servingGrams) {
  const n = round(Number(amount) || 0, 2);
  if (unit === 'serving') {
    const g = round(unitToGrams(n, unit, servingGrams));
    return `${n} serving${n === 1 ? '' : 's'} · ${g}g`;
  }
  return `${n}${unit}`;
}

function bmrMifflin(p) {

  const base = 10 * kg + 6.25 * cm - 5 * p.age;

}
const ACTIVITY = {
  sedentary: { label: 'Sedentary (desk job, little exercise)', mult: 1.2 },
  light: { label: 'Light activity (1-3 workouts/week)', mult: 1.375 },
  moderate: { label: 'Moderate activity (3-5 workouts/week)', mult: 1.55 },
  active: { label: 'Active (6-7 workouts/week)', mult: 1.725 },
  veryactive: { label: 'Very active (physical job + training)', mult: 1.9 },
};

function computeTrendSeries(points, alpha) {
  alpha = alpha || 0.12;
  let ema = null;
  return points.map((p) => { ema = ema === null ? p.weight : alpha * p.weight + (1 - alpha) * ema; return Object.assign({}, p, { trend: round(ema, 1) }); });
}
function linRegSlope(points) {
  const n = points.length;
  if (n < 2) return 0;
  let sx = 0, sy = 0, sxy = 0, sxx = 0;
  points.forEach(({ x, y }) => { sx += x; sy += y; sxy += x * y; sxx += x * x; });
  const denom = n * sxx - sx * sx;
  return denom === 0 ? 0 : (n * sxy - sx * sy) / denom;
}

  const foods = (dayLog && dayLog.foods) || [];
  return foods.reduce((a, f) => ({
    calories: a.calories + (f.calories || 0), protein: a.protein + (f.protein || 0),
    carbs: a.carbs + (f.carbs || 0), fat: a.fat + (f.fat || 0),
  }), { calories: 0, protein: 0, carbs: 0, fat: 0 });
}

// Latest smoothed trend weight, or null if there aren't enough weigh-ins.
// profile.weightLbs is only ever written at onboarding, so using it directly
// means the formula keeps computing from your STARTING weight forever — BMR
// and the protein target both drift wrong as you gain or lose.
function currentWeightLbs() {
  const keys = Object.keys(S.logs || {}).sort();
  const pts = keys.filter((k) => S.logs[k] && S.logs[k].weightLbs != null)
    .map((k) => ({ date: k, weight: S.logs[k].weightLbs }));
  if (!pts.length) return null;
  const trend = computeTrendSeries(pts);
  return trend[trend.length - 1].trend;
}

function estimateFromFormula(profile) {
  const liveWeight = currentWeightLbs();
  if (liveWeight) profile = Object.assign({}, profile, { weightLbs: liveWeight });
  const bmr = bmrMifflin(profile);
  const tdee = bmr * ((ACTIVITY[profile.activityLevel] || ACTIVITY.moderate).mult);
  const desiredDailyBalance = (profile.goalRateLbsPerWeek * 3500) / 7;
  const targetCalories = Math.max(tdee + desiredDailyBalance, 1200);
  const proteinG = profile.proteinPerLb * profile.weightLbs;
  const fatG = (targetCalories * profile.fatPercent) / 9;
  const carbsG = Math.max(0, (targetCalories - proteinG * 4 - fatG * 9) / 4);
  return { ok: true, source: 'formula', calories: round(targetCalories), protein: round(proteinG), fat: round(fatG), carbs: round(carbsG), estimatedTDEE: round(tdee), date: todayKey() };
}

function estimateFromData(logs, profile, windowSize, minDays) {
  windowSize = windowSize || 14; minDays = minDays || 7;
  const dateKeys = Object.keys(logs).sort();
  const withWeight = dateKeys.filter((k) => logs[k] && logs[k].weightLbs != null).map((k) => ({ date: k, weight: logs[k].weightLbs }));
  if (withWeight.length < 2) return { ok: false, reason: 'noweight', daysLogged: 0 };
  const trendSeries = computeTrendSeries(withWeight);
  const trendByDate = Object.fromEntries(trendSeries.map((p) => [p.date, p.trend]));

  const windowEnd = dateKeys[dateKeys.length - 1];
  const windowStart = addDays(windowEnd, -(windowSize - 1));
  const windowDays = dateKeys.filter((k) => k >= windowStart && k <= windowEnd && logs[k] && logs[k].weightLbs != null && logs[k].foods && logs[k].foods.length > 0);
  if (windowDays.length < minDays) return { ok: false, reason: 'need', daysLogged: windowDays.length, minDays };

  const regressionPoints = windowDays.map((k) => ({ x: daysBetween(windowDays[0], k), y: trendByDate[k] }));
  const slopePerDay = linRegSlope(regressionPoints);
  const weeklyRateActual = slopePerDay * 7;
  const avgIntake = windowDays.reduce((s, k) => s + dayTotals(logs[k]).calories, 0) / windowDays.length;
  const span = daysBetween(windowDays[0], windowDays[windowDays.length - 1]) || 1;
  const totalWeightChange = slopePerDay * span;
  const estimatedTDEE = avgIntake - (totalWeightChange * 3500) / span;
  const currentTrendWeight = trendByDate[dateKeys[dateKeys.length - 1]] ?? profile.weightLbs;
  const desiredDailyBalance = (profile.goalRateLbsPerWeek * 3500) / 7;
  const targetCalories = Math.max(estimatedTDEE + desiredDailyBalance, 1200);
  const proteinG = profile.proteinPerLb * currentTrendWeight;
  const fatG = (targetCalories * profile.fatPercent) / 9;
  const carbsG = Math.max(0, (targetCalories - proteinG * 4 - fatG * 9) / 4);

  return {
    ok: true, source: 'data', calories: round(targetCalories), protein: round(proteinG), fat: round(fatG), carbs: round(carbsG),
    estimatedTDEE: round(estimatedTDEE), weeklyRateActual: round(weeklyRateActual, 2), daysUsed: windowDays.length,
    currentTrendWeight: round(currentTrendWeight, 1), avgIntake: round(avgIntake), date: todayKey(),
  };
}

// ---------------------------------------------------------------------
// Tiny inline SVG chart builders (no chart library — kept dependency-free)
// CSS variables aren't reliably resolved inside raw SVG attributes across
// browsers, so these use plain hex values matching the CSS custom properties.
// ---------------------------------------------------------------------
const COLOR_LIGHT = { ink: '#1C2321', line: '#E4E0D6', lineStrong: '#D4CFC2', teal: '#2D5D5E', tan: '#B8AF9E', brick: '#B75139', green: '#4C7A51', amber: '#C99A2E', carbs: '#2F8F5B', calories: '#3E6FD9' };
const COLOR_DARK = { ink: '#F1F0EA', line: '#2B2F2E', lineStrong: '#383D3B', teal: '#5FA8A6', tan: '#93897A', brick: '#E08469', green: '#7FB584', amber: '#E8B94A', carbs: '#63C48D', calories: '#6C93E8' };
let currentTheme = 'dark';
function colors() { return currentTheme === 'dark' ? COLOR_DARK : COLOR_LIGHT; }
const COLOR = new Proxy({}, { get(_, key) { return colors()[key]; } });
function svgSparkline(values, opts) {
  opts = opts || {};
  const w = opts.w || 120, h = opts.h || 36, color = opts.color || COLOR.teal;
  if (!values.length) return `<svg width="${w}" height="${h}"></svg>`;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const step = values.length > 1 ? w / (values.length - 1) : 0;
  const pts = values.map((v, i) => `${round(i * step, 1)},${round(h - ((v - min) / range) * (h - 6) - 3, 1)}`);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function svgTrendChart(rawPoints, trendPoints, opts) {
  opts = opts || {};
  const w = opts.w || 320, h = opts.h || 160, pad = 8;
  if (trendPoints.length < 1) return `<svg width="${w}" height="${h}"></svg>`;
  const all = rawPoints.concat(trendPoints);
  const min = Math.min(...all) - 1.5, max = Math.max(...all) + 1.5;
  const range = (max - min) || 1;
  const n = trendPoints.length;
  const step = n > 1 ? (w - pad * 2) / (n - 1) : 0;
  const x = (i) => round(pad + i * step, 1);
  const y = (v) => round(h - pad - ((v - min) / range) * (h - pad * 2), 1);
  const trendLine = trendPoints.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const dots = rawPoints.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.4" fill="${COLOR.tan}"/>`).join('');
  const gridY = [0, 0.5, 1].map((f) => round(pad + f * (h - pad * 2), 1));
  const grid = gridY.map((gy) => `<line x1="0" y1="${gy}" x2="${w}" y2="${gy}" stroke="${COLOR.line}" stroke-width="1"/>`).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${grid}
    ${dots}
    <polyline points="${trendLine}" fill="none" stroke="${COLOR.teal}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function svgBarChart(values, opts) {
  opts = opts || {};
  const w = opts.w || 320, h = opts.h || 100, pad = 4;
  if (!values.length) return `<svg width="${w}" height="${h}"></svg>`;
  const maxAbs = Math.max(1, ...values.map((v) => Math.abs(v)));

  const bw = (w - pad * 2) / values.length;
  const bars = values.map((v, i) => {
    const barH = (Math.abs(v) / maxAbs) * (h / 2 - 8);
    const bx = round(pad + i * bw + bw * 0.2, 1);
    const bwActual = round(bw * 0.6, 1);
    const by = v >= 0 ? round(zeroY - barH, 1) : zeroY;
    const color = v > 0 ? COLOR.amber : COLOR.teal;
    return `<rect x="${bx}" y="${by}" width="${bwActual}" height="${round(barH, 1)}" rx="2" fill="${color}"/>`;
  }).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="0" y1="${zeroY}" x2="${w}" y2="${zeroY}" stroke="${COLOR.lineStrong}" stroke-width="1"/>

  </svg>`;

function svgRing(pct, opts) {

function svgBarWithReference(values, refValue, opts) {
  opts = opts || {};

  if (!values.length) return `<svg width="${w}" height="${h}"></svg>`;
  const maxVal = Math.max(refValue, ...values, 1) * 1.15;

  const bars = values.map((v, i) => {
    const barH = Math.max(v > 0 ? 2 : 0, (v / maxVal) * (h - 10));

    const bwActual = round(bw * 0.7, 1);

    return `<rect x="${bx}" y="${by}" width="${bwActual}" height="${round(barH, 1)}" rx="1.5" fill="${COLOR.calories}"/>`;

  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">

// ---------------------------------------------------------------------
// Global state
// ---------------------------------------------------------------------
const S = {
  authLoading: true,
  authUser: null,
  authMode: 'signin',
  authError: null,
  authBusy: false,
  authConnectError: false,
  profile: null,
  targets: null,
  logs: {},
  savedFoods: [],
  activeTab: 'dashboard',
  currentDate: todayKey(),
  dashMode: 'remaining',
  dashPage: 0,
  weighInDate: null,
  energyMode: 'targets',
  expanded: {},
  picker: null,
  shortcuts: null,
  barcode: null,
};
let currentUid = null;

// ---------------------------------------------------------------------
// Log storage: one Firestore document per month
//
// Logs previously lived as a single `logs` map on the user document, so every
// food added rewrote the entire history. Firestore caps a document at 1 MiB —
// roughly 4,000 entries — after which every write fails. Months are separate
// documents, so a write only rewrites the month it touched.
//
// knownShardMonths tracks months that exist server-side, including any whose
// last entry was just deleted: those still need an (empty) write, and they
// wouldn't appear in a scan of S.logs.
// ---------------------------------------------------------------------
function monthOf(dateKey) { return String(dateKey).slice(0, 7); }
let knownShardMonths = new Set();

function shardFor(month) {
  const days = {};
  Object.keys(S.logs).forEach((dk) => { if (monthOf(dk) === month) days[dk] = S.logs[dk]; });
  return days;
}

// months omitted = rewrite everything (import, restore, reset).
function persistLogs(months) {
  if (!currentUid) return;
  const live = new Set(Object.keys(S.logs).map(monthOf));
  const target = months ? new Set(months) : new Set([...live, ...knownShardMonths]);
  const shards = {};
  target.forEach((m) => {
    if (!/^\d{4}-\d{2}$/.test(m)) return;
    shards[m] = shardFor(m);
    knownShardMonths.add(m);
  });
  if (!Object.keys(shards).length) return;

  pendingWrites++;
  updateSyncIndicator();
  Promise.resolve(window.FB.writeLogShards(currentUid, shards))
    .then(() => { pendingWrites = Math.max(0, pendingWrites - 1); updateSyncIndicator(); })
    .catch((e) => {
      pendingWrites = Math.max(0, pendingWrites - 1);
      updateSyncIndicator();
      console.error('log save failed', e);
      toast('Could not save — your change is stored on this device only.');
    });
}
function persistSavedFoods() { saveField('savedFoods', S.savedFoods); }
function persistProfile() { saveField('profile', S.profile); }
function persistTargets() { saveField('targets', S.targets); }
// Number of writes queued locally but not yet acknowledged by the server.
let pendingWrites = 0;

// With persistent caching on, setUserDoc resolves only when the SERVER
// acknowledges. Offline that can be hours, so this deliberately does NOT
// await it before returning — the write is already durable in IndexedDB, and
// blocking here would freeze the UI. We track the promise purely to drive the
// "syncing / offline" indicator, and only surface a real error.
function saveField(key, value) {
  if (!currentUid) return;
  pendingWrites++;
  updateSyncIndicator();
  Promise.resolve(window.FB.setUserDoc(currentUid, { [key]: value }))
    .then(() => {
      pendingWrites = Math.max(0, pendingWrites - 1);
      updateSyncIndicator();
    })
    .catch((e) => {
      pendingWrites = Math.max(0, pendingWrites - 1);
      updateSyncIndicator();
      // A rejection here is a genuine failure (permissions, quota, malformed
      // data) — not merely being offline, which queues instead of rejecting.
      console.error('save failed', key, e);
      toast('Could not save — your change is stored on this device only.');
    });
}

function getDayLog(dateKey) { return S.logs[dateKey] || { weightLbs: null, foods: [] }; }
function setDayLog(dateKey, next) {
  S.logs = Object.assign({}, S.logs, { [dateKey]: next });
  persistLogs([monthOf(dateKey)]); // only the affected month is rewritten
}

async function loadLogShards(uid) {
  const logs = {};
  try {
    const snap = await window.FB.getLogShards(uid);
    snap.forEach((d) => {
      knownShardMonths.add(d.id);
      Object.assign(logs, (d.data() || {}).days || {});
    });
  } catch (e) {
    console.error('could not read log shards', e);
  }
  return logs;
}

// One-time move of the legacy `logs` map into month documents.
//
// Ordering is the whole point: shards are written and ACKNOWLEDGED before the
// old field is cleared. If this is interrupted — killed app, dead connection —
// the worst case is data existing in both places, which the loader merges
// harmlessly. It never deletes first.
//
// Runs only while online. Offline, the shard write would sit in the queue
// unacknowledged and the clear must not proceed on faith.
async function migrateLogsToShards(uid) {
  if (!navigator.onLine) return;
  const months = new Set(Object.keys(S.logs).map(monthOf));
  const shards = {};
  months.forEach((m) => { if (/^\d{4}-\d{2}$/.test(m)) shards[m] = shardFor(m); });
  if (!Object.keys(shards).length) {
    try { await window.FB.clearLegacyLogs(uid); } catch (e) { /* retried next boot */ }
    return;
  }
  try {
    await window.FB.writeLogShards(uid, shards);   // must be acknowledged first
    Object.keys(shards).forEach((m) => knownShardMonths.add(m));
    await window.FB.clearLegacyLogs(uid);          // only now is it safe
    console.info(`migrated ${Object.keys(S.logs).length} days into ${Object.keys(shards).length} month shards`);
  } catch (e) {
    // Legacy data is untouched, so the next sign-in simply tries again.
    console.error('log migration deferred:', e);
  }
}

// ---------------------------------------------------------------------
// Auth-gated boot: wait for Firebase to report sign-in state, then load
// that account's data from Firestore before rendering the app.
// ---------------------------------------------------------------------
window.onAuthReady = async function (user) {
  S.authLoading = false;
  S.authUser = user;
  if (!user) {
    currentUid = null; S.profile = null; S.targets = null; S.logs = {}; S.savedFoods = [];
    render(); return;
  }
  currentUid = user.uid;
  knownShardMonths = new Set();
  try {
    const snap = await window.FB.getUserDoc(user.uid);
    if (snap.exists()) {
      const data = snap.data();
      S.profile = data.profile || null;
      S.targets = data.targets || null;
      S.savedFoods = data.savedFoods || [];

      // Month shards are the source of truth. A legacy `logs` map means this
      // account hasn't migrated yet.
      const sharded = await loadLogShards(user.uid);
      const legacy = data.logs || null;
      if (legacy && Object.keys(legacy).length) {
        // Shards win on conflict — they're necessarily newer than the field
        // they replaced.
        S.logs = Object.assign({}, legacy, sharded);
        migrateLogsToShards(user.uid);   // background; never blocks the UI
      } else {
        S.logs = sharded;
      }
    } else {
      // Brand new account — check for pre-existing local data from before
      // Firebase was added, and offer it a home instead of losing it.
      const localProfile = readKey('profile');
      if (localProfile) {
        S.profile = localProfile;
        S.targets = readKey('targets');
        S.logs = readKey('logs') || {};
        S.savedFoods = readKey('savedFoods') || [];
        await window.FB.setUserDoc(user.uid, { profile: S.profile, targets: S.targets, savedFoods: S.savedFoods });
        persistLogs(); // writes month shards rather than the legacy logs field
        toast('Imported your existing data into this account');
      }
    }
  } catch (e) {
    console.error('load failed', e);
    toast('Could not load your data — check your connection.');
  }
  render();
};

function render() {
  const app = document.getElementById('app');
  if (S.authLoading) { app.innerHTML = renderAuthLoading(); return; }
  if (!S.authUser) { app.innerHTML = renderAuthScreen(); return; }
  if (!S.profile || !S.targets) { app.innerHTML = renderOnboarding(); return; }
  // Replacing innerHTML collapses the page and resets scroll to the top, so
  // deleting the eighth food of the day threw you back to the header. Restore
  // the offset synchronously after the new content is in place.
  const prevScroll = window.scrollY;
  app.innerHTML = `
    ${renderTopBar()}
    <div id="tab-content">${renderActiveTab()}</div>
    ${renderNav()}
    ${S.picker ? renderPicker() : ''}
    ${S.shortcuts ? renderShortcuts() : ''}
    ${S.barcode ? renderBarcodeSheet() : ''}
  `;
  if (prevScroll > 0) {
    const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    window.scrollTo({ top: Math.min(prevScroll, max), behavior: 'instant' });
  }

// Food search: USDA FoodData Central.
//
// Open Food Facts is NOT usable for search from a browser. Its legacy
// cgi/search.pl and api/v2/search endpoints return 503 to any request with an
// Origin header, and the newer search.openfoodfacts.org returns 200 but sends
// no Access-Control-Allow-Origin, so the browser blocks it. USDA sends
// `access-control-allow-origin: *` and has far better US and whole-food data.
// Barcode lookup still uses OFF's api/v2/product/{code}, which does send CORS
// headers and works fine.
//
// DEMO_KEY works but is rate-limited to ~30 requests/hour per IP. Get a free
// key (instant, no cost) at https://fdc.nal.usda.gov/api-key-signup.html and
// paste it here. This key is visible in the public repo; that is acceptable
// for a free, rate-limited, read-only data key.
const USDA_API_KEY = 'EDdkGrde3PUh9QN5I88VgtBcIgO8Jw3GgtX1pnBm';

// USDA returns Energy twice (KCAL and kJ), so match on unit, not just name.
function usdaNutrient(food, name, unit) {
  const list = food.foodNutrients || [];
  const hit = list.find((n) => n.nutrientName === name && (!unit || String(n.unitName).toUpperCase() === unit));
  return hit && typeof hit.value === 'number' ? hit.value : null;
}

function mapUsdaFood(f) {
  const protein = Math.max(0, usdaNutrient(f, 'Protein', 'G') || 0);
  const fat = Math.max(0, usdaNutrient(f, 'Total lipid (fat)', 'G') || 0);
  const carbs = Math.max(0, usdaNutrient(f, 'Carbohydrate, by difference', 'G') || 0);
  // Some Foundation entries carry macros but no Energy row. Fall back to
  // Atwater factors (4/4/9) rather than dropping an otherwise good result.
  let calories = usdaNutrient(f, 'Energy', 'KCAL');
  if (calories == null) calories = protein * 4 + carbs * 4 + fat * 9;
  const brand = f.brandName || f.brandOwner || '';
  return {
    id: String(f.fdcId), name: f.description || '',
    brand: brand ? String(brand).trim() : '',
    dataType: f.dataType || '',
    caloriesPer100: calories, proteinPer100: protein,
    carbsPer100: carbs, fatPer100: fat,
    // Branded items usually declare a label serving; curated ones don't.
    servingGrams: usdaServingGrams(f),
    servingLabel: f.householdServingFullText || '',
  };
}

// USDA gives servingSize + servingSizeUnit on Branded foods. Only mass units
// are usable here: "1 cup" or "3 pieces" can't be converted to grams without
// a density we don't have.
function usdaServingGrams(f) {
  const size = Number(f.servingSize);
  if (!size || !isFinite(size) || size <= 0) return null;
  const unit = String(f.servingSizeUnit || '').toLowerCase();
  if (unit === 'g' || unit === 'gram' || unit === 'grams') return size;
  if (unit === 'oz') return size * GRAMS_PER_OZ;
  if (unit === 'lb') return size * GRAMS_PER_LB;
  // ml is treated as grams only for the purposes of a rough serving; skip it
  // rather than invent a density.
  return null;
}

// USDA's Branded tier is crowdsourced from label scans and contains entries
// with impossible values (e.g. an oatmeal listed at 1580 kcal/100g). Nothing
// edible exceeds ~900 kcal/100g, which is pure fat.
function plausibleFood(f) {
  return f.name && f.caloriesPer100 > 0 && f.caloriesPer100 <= 900;
}

// Ranking: whole foods first, then prepared/packaged, then branded.
//
// Data tier alone isn't enough. USDA's curated tiers also contain restaurant
// and snack items, so a tier sort puts "Cookies, oatmeal" above actual oats.
// Score on the food's character as well as its source.
// Coarse rank only. Foundation and SR Legacy share a value: both are curated
// whole-food data and the difference is vintage, not food quality. Ranking
// them apart here let "Flour, bread, white" (Foundation) beat "Bread, white
// wheat" (SR Legacy) on dataset age alone. Foundation still wins ties, but as
// a late tiebreaker in the sort, after relevance.
const USDA_TIER = { 'Foundation': 0, 'SR Legacy': 0, 'Survey (FNDDS)': 1, 'Branded': 2 };
const USDA_TIER_FINE = { 'Foundation': 0, 'SR Legacy': 1, 'Survey (FNDDS)': 2, 'Branded': 3 };

// Prefer the plain form of a food. Between "Bananas, raw" and "Bananas,
// dehydrated, or banana powder", you almost always want the former.
const PROCESSED_QUALIFIERS = /\b(dehydrated|powder|dried|canned|imitation|breaded|nuggets|patties|frozen|toasted|leaves|sprouted|infant|baby)\b/;
function formScore(f) {
  const desc = String(f.name).toLowerCase();
  let s = /,\s*raw\b/.test(desc) ? 0 : 1;
  if (PROCESSED_QUALIFIERS.test(desc)) s += 3;
  return s;
}

// USDA descriptions are "Category, qualifier, qualifier". These leading
// categories are prepared, restaurant, or confectionery foods.
const PREPARED_PREFIXES = [
  'restaurant,', 'fast foods,', 'fast food,', 'snacks,', 'cookies,', 'candies,',
  'cake,', 'pie,', 'pastries,', 'crackers,', 'beverages,', 'alcoholic beverage',
  'babyfood,', 'formulated bar', 'toppings,', 'sauces,', 'gravy,', 'soup,',
];

// Restaurant dishes name their components ("chicken tenderloin platter"), so
// they can match a query word-for-word while being the wrong kind of food.
const DISH_WORDS = /\b(platter|sandwich|burrito|taco|pizza|nuggets|entree|meal|fried|breaded|casserole|salad with|sub|wrap)\b/;
function isPrepared(f) {
  const desc = String(f.name).toLowerCase();
  return PREPARED_PREFIXES.some((p) => desc.startsWith(p)) || DISH_WORDS.test(desc);
}

function usdaRank(f) {
  const tier = USDA_TIER[f.dataType];
  let score = (tier === undefined ? 4 : tier) * 10;
  if (isPrepared(f)) score += 25;
  return score;
}

// Within a rank, prefer entries where the search term is the food's head noun
// rather than a modifier. USDA writes "Category, qualifier, qualifier", so a
// comma right after the term means the term IS the food: "Rice, white,
// long-grain" is rice, while "Rice crackers" is a cracker. Ties then fall back
// to how much of the query the description actually covers.
// English compounds put the head noun last ("ground BEEF", "whole MILK",
// "olive OIL"); USDA puts it first ("Beef, ground", "Milk, whole", "Oil,
// olive"). So test both ends of the query against the description's head
// segment and take whichever matches better.
// How many of the query's words the description doesn't mention at all.
// Plural-aware: searching "tenderloins" must still match "tenderloin".
function missingWords(f, query) {
  const desc = String(f.name).toLowerCase();
  const words = String(query).toLowerCase().trim().split(/\s+/).filter(Boolean);
  return words.filter((w) => !desc.includes(w) && !desc.includes(w.replace(/s$/, ''))).length;
}

function queryAffinity(f, query) {
  const desc = String(f.name).toLowerCase();
  const words = String(query).toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!words.length) return 9;
  const segs = desc.split(/,\s*/);
  const head = segs[0];
  const same = (seg, w) => seg === w || seg === w + 's' || seg === w.replace(/s$/, '');
  const missing = missingWords(f, query);

  const scoreFor = (w) => {
    if (same(head, w)) return 0;
    // USDA files many foods under a category first ("Fish, salmon, ...",
    // "Nuts, almonds, ..."), so the real name is often the second segment.
    if (segs.length > 1 && same(segs[1], w)) return 1;
    if (desc.startsWith(w)) return 2;
    if (head.includes(w)) return 4;
    return 6;
  };
  // Last word first: it's the head noun in most compound food names.
  const base = Math.min(scoreFor(words[words.length - 1]), scoreFor(words[0]));
  // Missing words are weighted heavily. USDA's search treats terms as
  // independent, so "chicken tenderloins" returns pork and ostrich tenderloin;
  // an entry that ignores half the query should not outrank one that matches.
  return base + missing * 4;
}

async function usdaQuery(query, dataType, pageSize) {
  const params = new URLSearchParams({
    query, pageSize: String(pageSize), dataType, api_key: USDA_API_KEY,
  });
  const res = await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?${params}`);
  if (res.status === 429) throw new Error('rate-limited');
  if (!res.ok) throw new Error(`search failed: ${res.status}`);
  const data = await res.json();
  return data.foods || [];
}

async function searchFoods(query) {
  // Two separate requests rather than one combined query. For terms like
  // "ground beef" or "whole milk", USDA's relevance ranking returns nothing
  // but Branded entries, so a single call yields no curated candidates to
  // promote no matter how deep the pool. Asking for the curated datasets
  // explicitly guarantees whole foods are always in the running.
  const [curated, branded] = await Promise.all([
    usdaQuery(query, 'Foundation,SR Legacy', 40),
    usdaQuery(query, 'Branded', 25),
  ]);
  // De-dupe by fdcId, curated winning any collision.
  const seen = new Set();
  const take = (list) => list.map(mapUsdaFood).filter((f) => {
    if (seen.has(f.id)) return false;
    seen.add(f.id);
    return plausibleFood(f);
  });
  let mapped = take(curated.concat(branded));

  // USDA matches query words independently, so "chicken tenderloins" comes
  // back as pork, beef, and ostrich tenderloin with barely any chicken. When
  // the results largely ignore the leading noun, ask again for just that noun
  // so there is something on-topic to rank.
  const words = String(query).toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (words.length > 1) {
    const noun = words[0].replace(/s$/, '');
    const onTopic = mapped.filter((f) => f.name.toLowerCase().includes(noun));
    if (onTopic.length < 5) {
      try {
        mapped = mapped.concat(take(await usdaQuery(words[0], 'Foundation,SR Legacy', 25)));
      } catch (err) { /* fallback is best-effort; keep what we have */ }
    }
  }

  // Stable sort: rank, then query affinity, then USDA's own relevance order.
  return mapped
    .map((f, i) => ({
      f, i, r: usdaRank(f), a: queryAffinity(f, query),
      s: formScore(f), t: USDA_TIER_FINE[f.dataType] ?? 4,
      // Primary key: is this the food you asked for? Missing query words count
      // against it, and so does being a prepared dish — otherwise "chicken
      // tenderloin platter, fried" wins on an exact word match over plain
      // chicken. A curated "Ostrich, tenderloin" still loses to either.
      m: missingWords(f, query) + (isPrepared(f) ? 1 : 0),
    }))
    .sort((x, y) => (x.m - y.m) || (x.r - y.r)
      || ((x.a * 2 + x.s) - (y.a * 2 + y.s)) || (x.t - y.t) || (x.i - y.i))
    .map((x) => x.f)
    .slice(0, 12);
}

  const out = [];
  for (let i = 6; i >= 0; i--) out.push(addDays(endKey, -i));
  return out;
}
function lastNDateKeys(n, endKey) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(addDays(endKey, -i));

}

// ---------------------------------------------------------------------
// Dashboard carousel mechanics (native scroll-snap; no library)
// ---------------------------------------------------------------------
// Pin the carousel to the tallest panel's content height, once. Cards then
// stretch to fill it, so shorter panels show a taller card rather than a gap,
// and swiping never changes the height.
function syncDashHeight() {
  const el = document.getElementById('dash-carousel');
  if (!el) return;
  const cards = Array.from(el.querySelectorAll('.dash-page > .card'));
  if (!cards.length) return;
  // Release the imposed height first and measure offsetHeight. Measuring
  // scrollHeight against an already-set height excludes the card's 1px
  // borders, so the value shrank by 2px on every call.
  const prev = el.style.height;
  el.style.height = 'auto';
  void el.offsetHeight; // force reflow
  const tallest = Math.max(...cards.map((c) => c.offsetHeight));
  el.style.height = tallest > 0 ? `${Math.ceil(tallest)}px` : prev;
}
window.addEventListener('resize', syncDashHeight);

function scrollToDashPage(i) {
  S.dashPage = i;
  const el = document.getElementById('dash-carousel');
  if (el) el.scrollTo({ left: i * el.clientWidth, behavior: 'smooth' });
  document.querySelectorAll('.dash-dot').forEach((d, idx) => d.classList.toggle('active', idx === i));
  syncDashHeight();
}
window.scrollToDashPage = scrollToDashPage;
let dashObserver = null;
function setupDashCarousel() {
  const el = document.getElementById('dash-carousel');
  if (!el) return;
  el.scrollLeft = S.dashPage * el.clientWidth;
  syncDashHeight();
  if (dashObserver) dashObserver.disconnect();
  dashObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
        const idx = Number(entry.target.getAttribute('data-page'));
        S.dashPage = idx;
        document.querySelectorAll('.dash-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
        syncDashHeight();
      }
    });
  }, { root: el, threshold: 0.5 });
  document.querySelectorAll('.dash-page').forEach((p) => dashObserver.observe(p));
}

        </div>
      </button>
    </div>`;
  }).join('');

  const macroLine = `
    <div class="row between t12 mono faint mt2">
      <span>${round(totals.calories)}/${t.calories}</span>
      <span>P ${round(totals.protein)}/${t.protein}</span>
      <span>F ${round(totals.fat)}/${t.fat}</span>
      <span>C ${round(totals.carbs)}/${t.carbs}</span>
    </div>`;

  const foodItems = renderMealTimeline(cd, dayLog);

  return `
  <div class="row between mb3">
    <button class="ghost-btn" onclick="jumpToDate(addDays('${weekStart}', -7))">${iconChevronL}</button>
    <span class="mono w600 t14">${formatDateLabel(cd)}</span>
    <button class="ghost-btn" onclick="jumpToDate(addDays('${weekStart}', 7))">${iconChevronR}</button>
  </div>
  <div class="card">
    <div class="day-strip">${strip}</div>
    ${macroLine}
  </div>

  <div class="row between mb2 mt2">
    <span class="w600 t14">Food log</span>
    <button class="btn btn-primary btn-sm row g1" onclick="openPicker('${cd}')">${iconPlus} Add food</button>
  </div>
  ${foodItems}
  `;
}
// ---------------------------------------------------------------------
// Meal timeline
//
// Foods group into the hour they were logged, rather than into fixed
// "breakfast/lunch/dinner" buckets. The hours you actually eat at define
// your meals, and each hour carries its own totals and an add button.
// ---------------------------------------------------------------------
function hourLabel(h) {
  const period = h < 12 ? 'AM' : 'PM';
  const display = h % 12 === 0 ? 12 : h % 12;
  return `${display} ${period}`;
}

// A timestamp inside the given day at the given hour, for adding to a slot.
function slotTimestamp(dateKey, hour) {
  const [y, m, d] = dateKey.split('-').map(Number);
  return new Date(y, m - 1, d, hour, 0, 0, 0).getTime();
}

function renderMealTimeline(cd, dayLog) {
  const foods = (dayLog.foods || []).slice().sort((a, b) => entryTime(a) - entryTime(b));
  if (!foods.length) {
    return `<div class="card empty">Nothing logged ${formatDateLabel(cd).toLowerCase()} yet. Add your first food above.</div>`;
  }
  // Group by the hour each entry was logged. -1 is the "no usable timestamp"
  // bucket, so imported entries never masquerade as a real mealtime.
  const byHour = new Map();
  foods.forEach((f) => {
    const t = entryTime(f);
    const h = t > 0 ? new Date(t).getHours() : -1;
    if (!byHour.has(h)) byHour.set(h, []);
    byHour.get(h).push(f);
  });

  return Array.from(byHour.keys()).sort((a, b) => a - b).map((h) => {
    const items = byHour.get(h);
    const tot = items.reduce((s, f) => ({
      calories: s.calories + (f.calories || 0), protein: s.protein + (f.protein || 0),
      fat: s.fat + (f.fat || 0), carbs: s.carbs + (f.carbs || 0),
    }), { calories: 0, protein: 0, fat: 0, carbs: 0 });

    const rows = items.map((f) => {
      const ts = entryTime(f);
      const t = new Date(ts);
      const mm = ts > 0 ? String(t.getMinutes()).padStart(2, '0') : '--';
      const hh = ts > 0 ? String(t.getHours()).padStart(2, '0') : '--';
      return `<div class="meal-item tappable" onclick="editEntry('${cd}','${jsId(f.id)}')">
        <div class="flex1">
          <div class="t14 w500">${esc(f.name)}</div>
          <div class="t11 faint mono">${hh}:${mm} · ${esc(f.label || '')} · ${round(f.calories)} kcal · P${round(f.protein)} F${round(f.fat)} C${round(f.carbs)}</div>
        </div>
        <button class="icon-btn" onclick="event.stopPropagation();removeFood('${cd}','${jsId(f.id)}')">${iconTrash}</button>
      </div>`;
    }).join('');

    return `<div class="meal-group">
      <div class="row between mb2">
        <div class="row g2">
          <span class="meal-hour mono">${h < 0 ? 'Untimed' : hourLabel(h)}</span>
          <button class="meal-add" onclick="openPicker('${cd}', ${slotTimestamp(cd, h)})" title="Add to this hour">${iconPlus}</button>
        </div>
        <span class="t11 mono faint">${round(tot.calories)} kcal · P${round(tot.protein)} F${round(tot.fat)} C${round(tot.carbs)}</span>
      </div>
      ${rows}
    </div>`;
  }).join('');
}

    if (!isFinite(n) || n <= 0) { toast('Enter a valid weight'); return; }

}

function removeFood(dateKey, id, opts) {
  const dl = getDayLog(dateKey);
  // Compare on the sanitised form: the inline handler passes jsId(f.id), so a
  // legacy id containing a character jsId strips would never match its raw
  // value and the delete would silently do nothing.
  const match = (f) => jsId(f.id) !== id && f.id !== id;
  const removed = (dl.foods || []).find((f) => !match(f));
  setDayLog(dateKey, Object.assign({}, dl, { foods: (dl.foods || []).filter(match) }));
  render();
  // Deletion was instant and unrecoverable, next to a row you'd naturally tap
  // to edit. Offer it back rather than making the user re-enter it.
  if (removed && !(opts && opts.silent)) {
    toast('Entry deleted', { label: 'Undo', onClick: () => {
      const cur = getDayLog(dateKey);
      setDayLog(dateKey, Object.assign({}, cur, { foods: (cur.foods || []).concat([removed]) }));
      render(); toast('Restored');
    } });
  }
}

function addFoodEntry(dateKey, entry) {

function saveFoodToLibrary(food) {
  const exists = S.savedFoods.some((f) => f.id === food.id);
  S.savedFoods = exists
    ? S.savedFoods.map((f) => (f.id === food.id ? Object.assign({}, f, food) : f))
    : [food].concat(S.savedFoods);

// ---------------------------------------------------------------------
// Log entries
//
// Entries carry the food's per-100g values plus the amount and unit that
// produced them. Without that, an entry can't be re-logged from Recents or
// have its serving changed after the fact. Older entries predate these
// fields; everything that reads them falls back gracefully.
// ---------------------------------------------------------------------
// Timestamp for a new entry. Backfilling a past day previously stamped the
// current clock time, so every food added to an old day piled into whatever
// hour it happened to be now. Past days get a neutral midday instead.
function defaultEntryAt(dateKey, atMs) {
  if (atMs) return atMs;
  if (dateKey === todayKey()) return Date.now();
  return slotTimestamp(dateKey, 12);
}

function buildEntry(food, amount, unit, atMs) {
  const macros = macrosFor(food, amount, unit);
  return Object.assign({
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    at: atMs || Date.now(),
    name: food.name,
    brand: food.brand || '',
    foodId: food.id || '',
    amount: Number(amount) || 0,
    unit,
    servingGrams: food.servingGrams || null,
    per100: {
      calories: food.caloriesPer100, protein: food.proteinPer100,
      carbs: food.carbsPer100, fat: food.fatPer100,
    },
    label: amountLabel(amount, unit, food.servingGrams),
  }, macros);
}

// An entry becomes a food again for re-logging.
function entryToFood(e) {
  const p = e.per100;
  if (!p) return null; // legacy entry, not re-loggable
  return {
    id: e.foodId || e.name, name: e.name, brand: e.brand || '',
    caloriesPer100: p.calories, proteinPer100: p.protein,
    carbsPer100: p.carbs, fatPer100: p.fat,
    servingGrams: e.servingGrams || null,
  };
}

// Must be STABLE. Returning Date.now() as the fallback made an entry with no
// recoverable timestamp drift between hour groups as the day passed, reorder
// Recents on every open, and export the wrong meal time. 0 sorts it first and
// never changes; renderMealTimeline buckets it under an "Untimed" heading.
function entryTime(e) {
  const t = Number(e.at) || Number(String(e.id).split('-')[0]);
  return isFinite(t) && t > 0 ? t : 0;
}

// Most recently logged foods across all days, de-duplicated, newest first.
function recentFoods(limit) {
  const seen = new Set();
  const out = [];
  const entries = [];
  Object.keys(S.logs).forEach((dk) => {
    ((S.logs[dk] || {}).foods || []).forEach((e) => entries.push(e));
  });
  entries.sort((a, b) => entryTime(b) - entryTime(a));
  for (const e of entries) {
    const food = entryToFood(e);
    if (!food) continue;
    const key = (e.foodId || e.name).toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    out.push({ food, lastAmount: e.amount || 100, lastUnit: e.unit || 'g' });
    if (out.length >= (limit || 40)) break;
  }
  return out;
}

// ---- Favorites -------------------------------------------------------
function favKey(food) { return `fav-${food.id || food.name}`; }
function isFavorite(food) {
  return !!food && S.savedFoods.some((f) => f.id === favKey(food) && f.favorite);
}
function toggleFavorite() {
  const p = S.picker;
  const food = p.selectedOff || p.selectedRecent;
  if (!food) return;
  const key = favKey(food);
  if (isFavorite(food)) {
    S.savedFoods = S.savedFoods.filter((f) => f.id !== key);
    persistSavedFoods();
    toast('Removed from favorites');
  } else {
    saveFoodToLibrary({
      id: key, favorite: true, foodId: String(food.id || food.name),
      name: food.name, brand: food.brand || '',
      caloriesPer100: food.caloriesPer100, proteinPer100: food.proteinPer100,
      carbsPer100: food.carbsPer100, fatPer100: food.fatPer100,
      servingGrams: food.servingGrams || null,
      calories: round(food.caloriesPer100), protein: round(food.proteinPer100, 1),
      carbs: round(food.carbsPer100, 1), fat: round(food.fatPer100, 1), servingLabel: '100g',
    });
    toast('Added to favorites');
  }
  render();
}
window.toggleFavorite = toggleFavorite;

function favoriteFoods() {
  return S.savedFoods.filter((f) => f.favorite && f.caloriesPer100 != null);
}

// "My Foods" is the hand-built library. Favorites live in the same array but
// are surfaced in their own section, so exclude them here or every favorite

function selectRecent(i) {

function selectFavorite(i) {
  const f = favoriteFoods()[i];

  // duplicate record — and entries logged from here carried the prefixed id,
  // so Recents listed the same food twice.
  S.picker.selectedRecent = {
    id: f.foodId || String(f.id).replace(/^fav-/, ''),

    carbsPer100: f.carbsPer100, fatPer100: f.fatPer100,

  if (Number(food.servingGrams) > 0) { S.picker.amount = 1; S.picker.unit = 'serving'; }

// ---- Editing an existing entry ---------------------------------------
// "I ate 150g not 100g" previously meant delete, re-search, re-enter. The
// entry already carries everything needed to reconstitute the food, so the
// same amount controls can just reopen against it.
function editEntry(dateKey, entryId) {
  const dl = getDayLog(dateKey);
  const entry = (dl.foods || []).find((f) => jsId(f.id) === entryId);
  if (!entry) return;
  const food = entryToFood(entry);
  if (!food) {
    // Pre-dates the per-100g entry shape, so there's no basis to rescale it.
    toast('This entry is too old to edit — delete and re-add it');
    return;
  }
  S.picker = {
    forDate: dateKey, at: entryTime(entry) || null, tab: 'recent', query: '', results: [], status: 'idle',
    selectedOff: null, selectedRecent: food, selectedSaved: null, multiplier: 1,
    amount: entry.amount != null ? entry.amount : 100,
    unit: unitsFor(food).includes(entry.unit) ? entry.unit : 'g',
    editing: { dateKey, id: entry.id },
  };
  render();
  setTimeout(() => onAmountChange('recent'), 0);
}
window.editEntry = editEntry;

function deleteEditingEntry() {
  const ed = S.picker && S.picker.editing;
  if (!ed) return;
  closePicker();
  removeFood(ed.dateKey, jsId(ed.id));
}
window.deleteEditingEntry = deleteEditingEntry;

function commitEntryEdit() {
  const p = S.picker, ed = p.editing;
  const dl = getDayLog(ed.dateKey);
  const prev = (dl.foods || []).find((f) => f.id === ed.id);
  if (!prev) { closePicker(); return; }
  // Keep the original id and timestamp so the entry stays in its meal group.
  const next = Object.assign(buildEntry(p.selectedRecent, p.amount, p.unit, entryTime(prev)), { id: prev.id });
  setDayLog(ed.dateKey, Object.assign({}, dl, {
    foods: (dl.foods || []).map((f) => (f.id === ed.id ? next : f)),
  }));
  closePicker(); toast('Entry updated');
}

// ---------------------------------------------------------------------
// Shared amount + unit control
//
// Used by the search, barcode, and recents add screens. `ctx` selects which
// piece of state the control reads and writes, so one renderer and one pair
// of handlers serve all of them.
// ---------------------------------------------------------------------
function ctxState(ctx) { return ctx === 'bc' ? S.barcode : S.picker; }
function ctxFood(ctx) {
  if (ctx === 'bc') return S.barcode.product;
  if (ctx === 'recent') return S.picker.selectedRecent;
  return S.picker.selectedOff;
}

function amountControls(ctx) {
  const st = ctxState(ctx), food = ctxFood(ctx);
  const units = unitsFor(food);
  const unit = units.includes(st.unit) ? st.unit : 'g';
  st.unit = unit; // commit, so confirm*() can't log a different unit than shown
  const grams = round(unitToGrams(st.amount, unit, food.servingGrams));
  return `
    <label class="field mb2"><span>Amount</span>
      <input class="input" type="number" inputmode="decimal" step="any" id="${ctx}-amount" value="${st.amount}" oninput="onAmountChange('${ctx}')">
    </label>
    <div class="pill-toggle mb2">
      ${units.map((u) => `<button class="${u === unit ? 'active' : ''}" onclick="setAmountUnit('${ctx}','${u}')">${u}</button>`).join('')}
    </div>
    <div class="t11 fainter mono mb3" id="${ctx}-grams">${grams}g total</div>
    ${macroTiles(`${ctx}-prev`)}`;
}

function onAmountChange(ctx) {
  // Element check first: these run from setTimeout(0) and the sheet may have
  // closed in between, in which case ctxFood() would throw.
  const el = document.getElementById(`${ctx}-amount`);
  if (!el) return;
  const st = ctxState(ctx), food = ctxFood(ctx);
  if (!st || !food) return;
  st.amount = Number(el.value) || 0;
  const gEl = document.getElementById(`${ctx}-grams`);
  if (gEl) gEl.textContent = `${round(unitToGrams(st.amount, st.unit, food.servingGrams))}g total`;
  fillMacroTiles(`${ctx}-prev`, macrosFor(food, st.amount, st.unit));
}
window.onAmountChange = onAmountChange;

// Patches the pills in place instead of re-rendering. A full render() replaces
// #app's innerHTML, which destroys the focused amount input — so on a phone
// the keyboard closed every time you switched g → oz, which is the tap you

// ---------------------------------------------------------------------
// Camera barcode scanner
//
// Safari has no BarcodeDetector API, so iOS needs a decoder library. ZXing
// is imported lazily from a CDN the first time the scanner opens, so it
// costs nothing on load. Product barcodes are EAN/UPC, i.e. 1D, so the
// one-dimensional reader is used: it's faster and misreads less than the
// multi-format one.
//
// The overlay is appended to <body>, NOT into #app. render() replaces #app's
// innerHTML wholesale, which would tear out a live <video> mid-stream.
// ---------------------------------------------------------------------
let scanner = null;

function scannerAvailable() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext;
}

async function openScanner() {
  if (scanner) return;
  if (!scannerAvailable()) {
    toast(window.isSecureContext ? 'No camera available on this device' : 'Camera needs an https connection');
    return;
  }
  const el = document.createElement('div');
  el.className = 'scan-overlay';
  el.innerHTML = `
    <video class="scan-video" playsinline muted autoplay></video>
    <div class="scan-reticle"></div>
    <div class="scan-hint" id="scan-hint">Starting camera…</div>
    <div class="scan-bar">
      <button class="scan-btn" id="scan-cancel">Cancel</button>
      <span class="t12" style="color:rgba(255,255,255,0.7);">Hold steady over the barcode</span>
    </div>`;
  document.body.appendChild(el);
  scanner = { el, controls: null };
  el.querySelector('#scan-cancel').addEventListener('click', closeScanner);

  try {
    const { BrowserMultiFormatOneDReader } = await import('https://esm.sh/@zxing/browser@0.1.5');
    if (!scanner) return; // cancelled while the library was downloading
    const reader = new BrowserMultiFormatOneDReader();
    const hint = el.querySelector('#scan-hint');
    const controls = await reader.decodeFromConstraints(
      { video: { facingMode: { ideal: 'environment' } } },
      el.querySelector('video'),
      (result) => {
        // Fires continuously, including with no result; only act on a hit.
        if (!result || !scanner) return;
        const code = result.getText();
        closeScanner();
        onBarcodeScanned(code);
      },
    );
    if (!scanner) { controls.stop(); return; } // cancelled while camera started
    scanner.controls = controls;
    if (hint) hint.textContent = 'Point at the barcode';
  } catch (err) {
    console.error('scanner failed to start:', err);
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    const missing = err && (err.name === 'NotFoundError' || err.name === 'OverconstrainedError');
    closeScanner();
    toast(denied ? 'Camera permission denied' : missing ? 'No camera found' : 'Could not start the camera');
  }
}
window.openScanner = openScanner;

function closeScanner() {
  if (!scanner) return;
  const s = scanner;
  scanner = null; // clear first so in-flight callbacks bail out
  try { if (s.controls) s.controls.stop(); } catch (err) { /* already stopped */ }
  // Belt and braces: if startup failed after the stream was acquired, controls
  // was never assigned and nothing above would release the camera.
  try {
    const v = s.el && s.el.querySelector('video');
    if (v && v.srcObject) { v.srcObject.getTracks().forEach((t) => t.stop()); v.srcObject = null; }
  } catch (err) { /* nothing to release */ }
  if (s.el && s.el.parentNode) s.el.parentNode.removeChild(s.el);
}
window.closeScanner = closeScanner;

function onBarcodeScanned(code) {
  if (!S.barcode) S.barcode = { forDate: todayKey(), code: '', status: 'idle', product: null, amount: 100, unit: 'g' };
  S.barcode.code = code;
  render();
  lookupBarcode(null, code);
}
async function lookupBarcode(e, codeOverride) {
  if (e) e.preventDefault();
  const input = document.getElementById('barcode-input');
  const code = String(codeOverride != null ? codeOverride : (input ? input.value : '')).trim();
  if (!code || !S.barcode) return;
  S.barcode.code = code; S.barcode.status = 'loading'; S.barcode.product = null; render();
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${encodeURIComponent(code)}.json`);
    const data = await res.json();
    if (!S.barcode) return; // dismissed while in flight
    if (data.status === 1 && data.product && data.product.nutriments && data.product.nutriments['energy-kcal_100g'] != null) {
      const p = data.product;
      // serving_quantity is grams when serving_quantity_unit says so; OFF is
      // inconsistent, so only trust it when it looks like a mass.
      const sq = Number(p.serving_quantity);
      const squ = String(p.serving_quantity_unit || 'g').toLowerCase();
      const servingGrams = (sq > 0 && (squ === 'g' || squ === 'gram' || squ === 'grams')) ? sq : null;
      S.barcode.product = {
        id: code, name: p.product_name || `Item ${code}`, brand: p.brands ? p.brands.split(',')[0].trim() : '',
        caloriesPer100: p.nutriments['energy-kcal_100g'] || 0, proteinPer100: p.nutriments['proteins_100g'] || 0,
        carbsPer100: p.nutriments['carbohydrates_100g'] || 0, fatPer100: p.nutriments['fat_100g'] || 0,
        servingGrams,
      };
      S.barcode.status = 'found';
      if (servingGrams) { S.barcode.amount = 1; S.barcode.unit = 'serving'; }
      else { S.barcode.amount = 100; S.barcode.unit = 'g'; }
    } else { S.barcode.status = 'notfound'; }
  } catch (err) {
    console.error('barcode lookup failed:', err);
    if (S.barcode) S.barcode.status = 'error';
  }
  if (!S.barcode) return; // sheet dismissed while the lookup was in flight
  render();
  if (S.barcode.status === 'found') setTimeout(() => onAmountChange('bc'), 0);
}
window.lookupBarcode = lookupBarcode;

// ---- Manual targets --------------------------------------------------
// Everything previously derived from the formula or the regression, with no
// way to simply state your numbers.
//
// Macros are entered in grams and can disagree with the calorie figure, so
// the implied total is shown rather than silently "corrected" — the entered
// calories stay authoritative.
function manualSplitSummary(cal, p, f, c) {
  const fromMacros = Math.round(p * 4 + f * 9 + c * 4);
  const diff = Math.round(fromMacros - cal);
  if (!isFinite(fromMacros)) return '';
  // Real-world targets are rounded, so a small gap is normal, not an error:
  // 180P/60F/165C is 1920 kcal against a 1950 target.
  if (Math.abs(diff) <= 60) return `Macros add up to ${fromMacros} kcal — consistent with your ${cal} kcal target.`;
  return `Macros add up to ${fromMacros} kcal, ${Math.abs(diff)} ${diff > 0 ? 'above' : 'below'} the ${cal} kcal target. Both are saved as entered.`;
}
