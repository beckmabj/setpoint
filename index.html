<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root {

  --tan-soft: #F0EBE1;
  --brick: #B75139;
  --brick-soft: #F5E4DE;
  --green: #4C7A51;
  --green-soft: #E6EDE3;
  --amber: #C99A2E;
  --amber-soft: #F5ECD6;
  --carbs: #2F8F5B;

  --calories-soft: #E4EBFA;

}
:root[data-theme="dark"] {
  --btn-dark-bg: #F1F0EA;
  --btn-dark-fg: #15181A;
  --paper: #15181A;
  --paper-raised: #1E2225;
  --ink: #F1F0EA;
  --ink-faint: #9A9D96;
  --ink-fainter: #676B65;
  --line: #2B2F2E;
  --line-strong: #383D3B;
  --teal: #5FA8A6;
  --teal-deep: #9AD1CF;
  --teal-soft: #1E3536;
  --tan: #93897A;
  --tan-soft: #26241F;
  --brick: #E08469;
  --brick-soft: #3B241D;
  --green: #7FB584;
  --green-soft: #1F2C1F;
  --amber: #E8B94A;
  --amber-soft: #372A10;
  --carbs: #63C48D;
  --carbs-soft: #16301F;
  --calories: #6C93E8;
  --calories-soft: #1E2638;
  --accent-solid: #2D5D5E;
}
html { background: var(--paper); }
body, .card, .sheet, .nav-bar, #toast { transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease; }

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--paper); color: var(--ink);
  font-family: 'IBM Plex Sans', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }

#app { max-width: 480px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); position: relative; min-height: 100dvh; }
.mono { font-family: 'IBM Plex Mono', monospace; }

/* layout helpers */
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.between { justify-content: space-between; }
.center { justify-content: center; align-items: center; }
.wrap { flex-wrap: wrap; }
.g1 { gap: 4px; } .g2 { gap: 8px; } .g3 { gap: 12px; } .g4 { gap: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.flex1 { flex: 1; }
.mt1{margin-top:4px;} .mt2{margin-top:8px;} .mt3{margin-top:12px;} .mt4{margin-top:16px;}
.mb1{margin-bottom:4px;} .mb2{margin-bottom:8px;} .mb3{margin-bottom:12px;} .mb4{margin-bottom:16px;}

/* Type scale. Everything ran 10-14px against the dashboard's 13-42px, so
   moving between tabs felt like two different apps. These are the same five
   steps the dashboard uses, and the t* names are kept so the ~200 call sites
   don't all have to change. */
.faint { color: var(--ink-faint); }
.fainter { color: var(--ink-fainter); }
.t10{font-size:11px;} .t11{font-size:12px;} .t12{font-size:13px;} .t13{font-size:14px;}
.t14{font-size:15.5px;} .t15{font-size:17px;} .t16{font-size:19px;}
.w500{font-weight:500;} .w600{font-weight:600;} .w700{font-weight:700;}

/* surfaces */
.card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
.card.tappable { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 12px; }
.pill-toggle { display: flex; background: var(--tan-soft); border-radius: 10px; padding: 3px; }
.pill-toggle button { flex: 1; border: none; background: transparent; padding: 8px 0; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; color: var(--ink-faint); }
.pill-toggle button.active { background: var(--paper-raised); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

/* buttons */
.btn { border: none; border-radius: 11px; font-size: 15px; font-weight: 600; padding: 12px 18px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn-primary { background: var(--accent-solid); color: #fff; }
.btn-dark { background: var(--btn-dark-bg); color: var(--btn-dark-fg); }
.btn-outline { background: transparent; border: 1px solid var(--line); color: var(--ink-faint); }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
/* Visual box stays small so rows keep their density; the ::after overlay
   provides the 44pt touch target without affecting layout. */
.icon-btn { background: none; border: none; color: var(--ink-fainter); cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; position: relative; -webkit-tap-highlight-color: transparent; }
.icon-btn::after { content: ''; position: absolute; inset: -10px; }
.ghost-btn { background: var(--tan-soft); border: none; border-radius: 8px; padding: 7px; color: var(--ink); cursor: pointer; display: flex; }

/* inputs */
label.field { display: flex; flex-direction: column; gap: 4px; }
label.field span { color: var(--ink-faint); font-size: 13px; }
.input, select.input {
  font-family: 'IBM Plex Mono', monospace; background: var(--paper); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 13px; font-size: 16px; color: var(--ink); width: 100%;
}
select.input { font-family: 'IBM Plex Sans', sans-serif; }
.input.sans { font-family: 'IBM Plex Sans', sans-serif; }

/* progress bars */
.bar-track { border-radius: 999px; height: 8px; width: 100%; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; transition: width 300ms ease; }

/* top app bar */
.app-title { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }

/* bottom nav */
.nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--paper-raised); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 30; }
.nav-inner { max-width: 480px; margin: 0 auto; display: flex; align-items: center; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 10px; background: none; border: none; color: var(--ink-fainter); cursor: pointer; }
.nav-item.active { color: var(--teal); }
.nav-item span { font-size: 11.5px; font-weight: 500; }
.nav-item.active span { font-weight: 600; }
.nav-fab { width: 46px; height: 46px; border-radius: 50%; background: var(--accent-solid); color: #fff; border: none; display: flex; align-items: center; justify-content: center; margin-top: -20px; box-shadow: 0 4px 12px rgba(45,93,94,0.35); cursor: pointer; }

/* weekly day strip */
.day-strip { display: flex; justify-content: space-between; gap: 4px; }
.day-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
.day-label { font-size: 10.5px; color: var(--ink-fainter); }
.day-ring-wrap { position: relative; width: 34px; height: 34px; }
.day-ring-wrap svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.day-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
.day-cell.selected .day-num { font-weight: 700; }
.day-cell button.day-btn { background: none; border: none; padding: 0; cursor: pointer; }

/* nutrition strip (dashboard) */

/* streak grid */
.streak-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.streak-dot { aspect-ratio: 1; border-radius: 4px; background: var(--tan-soft); }
.streak-dot.on { background: var(--teal); }

/* modal / sheet */
.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: var(--kb-inset, 0px); background: rgba(28,35,33,0.42); z-index: 50; display: flex; align-items: flex-end; justify-content: center; transition: bottom 140ms ease; }
/* max-height is measured against the space actually left once the keyboard
   is up, minus the status bar. A flat 86dvh let the sheet's own header slide
   up underneath the notch when the keypad appeared. */
.sheet { width: 100%; max-width: 480px; background: var(--paper); border-radius: 22px 22px 0 0; max-height: calc(100dvh - var(--kb-inset, 0px) - env(safe-area-inset-top) - 14px); overflow-y: auto; overscroll-behavior: contain; padding: 16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); box-shadow: 0 -8px 30px rgba(0,0,0,0.15); -webkit-overflow-scrolling: touch; }

/* Camera scanner. Lives outside #app so render() can't destroy the <video>;
   deliberately fixed dark in both themes, since it sits over a camera feed. */
.scan-overlay { position: fixed; inset: 0; z-index: 90; background: #000; overflow: hidden; }
.scan-video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scan-reticle { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); width: 78%; max-width: 330px; aspect-ratio: 5 / 3; border: 2px solid rgba(255,255,255,0.92); border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.5); pointer-events: none; }
.scan-hint { position: absolute; left: 0; right: 0; top: calc(44% + 24vh); text-align: center; color: rgba(255,255,255,0.85); font-size: 13px; padding: 0 24px; pointer-events: none; }
.scan-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px calc(18px + env(safe-area-inset-bottom)); background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0)); }
.scan-btn { border: 1px solid rgba(255,255,255,0.45); background: rgba(0,0,0,0.35); color: #fff; border-radius: 9px; font-size: 14px; font-weight: 600; padding: 10px 18px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.line-rule { flex: 1; height: 1px; background: var(--line); }
.row-emoji { font-size: 22px; line-height: 1; flex: none; margin-right: 11px; }

/* The primary action stays pinned to the bottom of the sheet. Once the food
   detail panel was added the sheet grew tall enough that, with the keyboard
   up, "Add to log" sat below the fold — so logging took two moves: dismiss
   the keyboard, then find the button. Sticky keeps it one. */
.sheet-actions { position: sticky; bottom: 0; margin: 16px -16px 0; padding: 12px 16px calc(4px + env(safe-area-inset-bottom));
  background: linear-gradient(to bottom, transparent, var(--paper) 22%); }

/* Dashboard. The reference's whole character is scale — big headings, a large
   gauge, generous air — so the type here runs well above the app's usual sizes. */
.dash-date { font-size: 13px; font-weight: 600; letter-spacing: .09em; color: var(--ink-faint); margin-bottom: 2px; }
.dash-title { font-size: 42px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; margin: 0 0 22px; }
.sect-h { font-size: 21px; font-weight: 700; letter-spacing: -.015em; margin: 26px 0 14px; }

.gauge-wrap { position: relative; display: flex; align-items: center; justify-content: center; margin: 4px 0 6px; padding: 0 4px; }
.gauge-svg { display: block; }
.gauge-centre { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); text-align: center; }
.gauge-centre-v { font-size: 36px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.gauge-centre-l { font-size: 14px; color: var(--ink-faint); margin-top: 3px; }
.gauge-side { position: absolute; top: 47%; transform: translateY(-50%); text-align: center; width: 74px; }
.gauge-left { left: 0; } .gauge-right { right: 0; }
.gauge-side-v { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.gauge-side-l { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; }

.devstrip { display: flex; gap: 6px; align-items: stretch; }
.devday { flex: 1; min-width: 0; background: transparent; border: none; padding: 4px 2px 0; border-radius: 9px;
  cursor: pointer; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
.devday.is-today { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.devhalf { height: 40px; display: flex; }
.devhalf-up { align-items: flex-end; }
.devaxis { height: 1px; background: var(--line-strong); }
.devaxis.is-empty { background: var(--line); }
.devbar { width: 100%; }
.devbar-up { background: var(--brick); border-radius: 4px 4px 0 0; }
.devbar-down { background: var(--carbs); border-radius: 0 0 4px 4px; }
.devkey { display: inline-block; width: 7px; height: 7px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.devlabel { text-align: center; font-size: 11px; color: var(--ink-fainter); padding: 6px 0 4px; }
.devday.is-today .devlabel { color: var(--ink); font-weight: 700; }

.macro-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 10px; }
.macro-col { text-align: center; }
.macro-col-l { font-size: 14px; color: var(--ink-faint); margin-bottom: 7px; }
.macro-col-rule { height: 4px; border-radius: 3px; }
.macro-col-v { font-size: 15px; font-weight: 600; margin-top: 8px; }

/* Large enough to hit without looking, unlike the small pill toggles elsewhere */
.mode-toggle { display: flex; background: var(--tan-soft); border-radius: 999px; padding: 4px; margin: 22px auto 0; max-width: 300px; }
.mode-toggle button { flex: 1; border: none; background: transparent; color: var(--ink-faint); font: inherit;
  font-size: 15px; font-weight: 600; padding: 11px 0; border-radius: 999px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mode-toggle button.on { background: var(--ink); color: var(--paper); }

/* Dashboard stat tiles. Each sizes to its own content — no equal-height
   constraint, so dead space can't reappear when a metric is added. */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 13px; padding: 11px 12px 12px; }
.tile-v { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.tile-suf { font-size: 13px; font-weight: 600; }
.trk { height: 4px; border-radius: 3px; background: var(--tan-soft); overflow: hidden; }
.fil { height: 100%; border-radius: 3px; transition: width 220ms ease; }

/* Food detail */
.fd { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.fd-split { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.fd-chip { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.fd-label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-fainter); margin: 12px 0 8px; }
.fd-rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.fd-ring { text-align: center; }
.fd-ring-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.fd-ring-pct { position: absolute; font-size: 10px; font-weight: 700; color: var(--ink-faint); }
.fd-ring-label { font-size: 10px; color: var(--ink-fainter); margin-top: 3px; }

/* Always-available search on the Log tab, docked above the nav */
.log-searchbar-spacer { height: 58px; }
.log-searchbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom)); width: min(480px, 100% - 32px); display: flex; align-items: center; gap: 8px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 25; }
.log-search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 8px 0; font: inherit; color: var(--ink-fainter); font-size: 15px; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
.log-search svg { flex: none; }
.log-scan { color: var(--ink-faint); }
/* Where a search result came from. OFF is crowdsourced, so its rows are
   labelled rather than silently mixed in with curated USDA data. */
.src-tag { flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 6px; border-radius: 5px; margin-left: 8px; }
.src-tag.is-usda { background: var(--green-soft); color: var(--green); }
.src-tag.is-brand { background: var(--tan-soft); color: var(--ink-faint); }
.src-tag.is-off { background: var(--calories-soft); color: var(--calories); }
.dupe-group { border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin-bottom: 10px; }
.dupe-row { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; border: none; text-align: left; padding: 8px 8px; border-radius: 8px; cursor: pointer; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
.dupe-row + .dupe-row { border-top: 1px solid var(--line); }
.dupe-keep { color: var(--teal); flex: none; }

/* Day macro bars */
.daybars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
.daybar-val { color: var(--ink-faint); margin-bottom: 4px; white-space: nowrap; }
.daybar-val.is-over { color: var(--brick); }
.daybar-track { height: 4px; border-radius: 3px; background: var(--tan-soft); overflow: hidden; }
.daybar-fill { height: 100%; border-radius: 3px; transition: width 220ms ease; }

/* Food log timeline: a continuous run of hour slots with a time rail */
/* The search field stays put while results scroll under it. The sheet is the
   scroll container, so sticky resolves against it; the negative side margins and
   matching padding let the opaque backing span the sheet's own padding, or rows
   would show through at the edges as they pass beneath. */
.picker-dock { position: sticky; top: 0; z-index: 3; background: var(--paper); margin: 0 calc(-16px - env(safe-area-inset-right)) 12px calc(-16px - env(safe-area-inset-left)); padding: 2px calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left)); }
/* Adding food is the most-used flow and had the least room: the sheet was sized
   by its content, so it opened as a small panel and resized as tabs changed or
   results loaded. A fixed height stops that. max-height still caps it, so the
   keyboard inset and the safe areas keep winning, and the >=480px rule still
   applies its 80vh. Only the picker opts in; the barcode sheet is unchanged. */
.sheet--tall { height: 85dvh; }
.tl { position: relative; }
.tl-hour { position: relative; padding-left: 46px; margin-bottom: 4px; }
.tl-hour::before { content: ''; position: absolute; left: 21px; top: 0; bottom: -4px; width: 1px; background: var(--line); }
.tl-hour:last-child::before { bottom: 50%; }
.tl-hour-head { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px -46px; }
/* Fixed width, not min-width. The chip is the first item in a flex row, so a
   wider label pushed the + that follows it and the column zigzagged: "5 AM"
   measured 58px against 63px for "10 AM", "11 AM" and "12 PM". 66px clears the
   widest with slack; flex: 0 0 auto stops the row shrinking it back. */
.tl-hour-chip { font-size: 13px; font-weight: 700; color: var(--ink-faint); background: var(--tan-soft); border-radius: 999px; padding: 5px 12px; width: 66px; flex: 0 0 auto; text-align: center; }
/* "Untimed" is wider than an hour label and heads a block with no +, so it has
   no column to line up with and is left to size itself. */
.tl-hour-chip--auto { width: auto; }
.tl-hour.is-empty .tl-hour-chip { background: transparent; color: var(--ink-fainter); }
.tl-hour.is-empty .tl-hour-head { margin-top: 2px; margin-bottom: 2px; }
.tl-hour.is-now .tl-hour-chip { background: var(--teal-soft); color: var(--teal-deep); font-weight: 700; }
.tl-hour-tot { margin-left: auto; font-size: 11.5px; color: var(--ink-faint); }
.tl-add { width: 22px; height: 22px; border-radius: 999px; border: 1px dashed var(--line-strong); background: transparent; color: var(--ink-fainter); display: inline-flex; align-items: center; justify-content: center; padding: 0; position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tl-add svg { width: 12px; height: 12px; }
.tl-add::after { content: ''; position: absolute; inset: -11px; }
.tl-add:hover { color: var(--teal); border-color: var(--teal); }
.tl-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.tl-time { width: 34px; margin-left: -46px; font-size: 11px; color: var(--ink-fainter); padding-top: 15px; text-align: right; flex: none; }
.tl-card { flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px; min-height: 60px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; text-align: left; cursor: pointer; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
.tl-emoji { font-size: 22px; line-height: 1; flex: none; }
.tl-body { flex: 1; min-width: 0; display: block; }

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
    signInWithEmailAndPassword, signOut, sendPasswordResetEmail,
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import {
    initializeFirestore, persistentLocalCache, persistentSingleTabManager,
    getFirestore, doc, getDoc, setDoc, collection, getDocs, writeBatch, deleteField,
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDujgRY5OXTcPVojR1Cr1v7DMcSsioSx7k",
    authDomain: "setpoint-f9948.firebaseapp.com",
    projectId: "setpoint-f9948",
    storageBucket: "setpoint-f9948.firebasestorage.app",
    messagingSenderId: "957285099675",
    appId: "1:957285099675:web:7fae7e5cada7bd1f507e3e",
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);

  // Persistent local cache (IndexedDB). Without it Firestore keeps everything
  // in memory only: a write made with no connection is lost the moment the
  // app is closed, even though the UI already showed the food as logged.
  // With it, writes are durably queued on the device and flushed on reconnect.
  //
  // Single-tab manager rather than multi-tab: this is a phone app, and the
  // multi-tab coordinator adds leader-election overhead we don't need.
  let fbDb;
  try {
    fbDb = initializeFirestore(fbApp, {
      localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }),
    });
  } catch (err) {
    // Private browsing, blocked storage, or a second tab winning the lock.
    console.error('persistent cache unavailable, falling back to memory:', err);
    fbDb = getFirestore(fbApp);
    window.__tarePersistenceFailed = true;
  }

  window.FB = {
    createUser: (email, pw) => createUserWithEmailAndPassword(fbAuth, email, pw),
    signIn: (email, pw) => signInWithEmailAndPassword(fbAuth, email, pw),
    signOutUser: () => signOut(fbAuth),
    resetPassword: (email) => sendPasswordResetEmail(fbAuth, email),
    getUserDoc: (uid) => getDoc(doc(fbDb, 'users', uid)),
    // Deliberately NOT awaited by callers when offline: with persistence on,
    // setDoc's promise only settles once the server acknowledges, which may be
    // hours away. The write is durable in IndexedDB as soon as this returns.
    setUserDoc: (uid, data) => setDoc(doc(fbDb, 'users', uid), data, { merge: true }),

    // ---- Log shards: users/{uid}/logs/{YYYY-MM} ----
    // Logs used to live as one `logs` map on the user document. Firestore caps
    // a document at 1 MiB, which at roughly 250 bytes per entry is a couple of
    // years of logging, after which EVERY write fails. Months are separate
    // documents so a write only ever rewrites the month it touched.
    getLogShards: (uid) => getDocs(collection(fbDb, 'users', uid, 'logs')),
    setLogShard: (uid, month, days) =>
      setDoc(doc(fbDb, 'users', uid, 'logs', month), { days }, { merge: false }),
    writeLogShards: (uid, shards) => {
      const batch = writeBatch(fbDb);
      Object.keys(shards).forEach((m) => {
        batch.set(doc(fbDb, 'users', uid, 'logs', m), { days: shards[m] }, { merge: false });
      });
      return batch.commit();
    },
    // Only called AFTER shards are confirmed written.
    clearLegacyLogs: (uid) => setDoc(doc(fbDb, 'users', uid), { logs: deleteField() }, { merge: true }),
  };

  onAuthStateChanged(fbAuth, (user) => {
    if (window.onAuthReady) window.onAuthReady(user);
  });

<script>
'use strict';

// Build number = commit count. Stamped automatically by tools/stamp-build.sh
// (installed as a pre-commit hook), so it can never drift from what shipped.
const BUILD = 50;

// ---------------------------------------------------------------------
// Local device storage — theme preference ONLY. Everything else (profile,
// targets, logs, saved foods) now lives in Firestore, tied to the signed-in
// account, so it syncs across devices and isn't lost if this browser's
// storage is cleared.
// ---------------------------------------------------------------------
// Storage namespace keeps the old name deliberately: it isn't user-visible,
// and onAuthReady migrates pre-Firebase local data out of these keys.
// Renaming it would orphan any data still sitting there.
const NS = 'setpoint:';
function readKey(k) {
  try {
    const v = localStorage.getItem(NS + k);
    return v ? JSON.parse(v) : null;
  } catch (e) { console.error('read failed', k, e); return null; }
}
function writeKey(k, v) {
  try { localStorage.setItem(NS + k, JSON.stringify(v)); return true; }
  catch (e) { console.error('write failed', k, e); toast('Could not save — storage may be full.'); return false; }
}

let toastTimer = null;
function toast(msg, action) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  if (action && action.label && action.onClick) {
    const btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.textContent = action.label;
    btn.onclick = () => { el.classList.remove('show'); clearTimeout(toastTimer); action.onClick(); };
    el.appendChild(btn);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), action ? 6000 : 2400);
}

// ---------------------------------------------------------------------
// Date / math helpers
// ---------------------------------------------------------------------
function todayKey(d) {
  d = d || new Date();
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function addDays(dateKey, delta) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + delta);
  return todayKey(dt);
}
function daysBetween(a, b) {
  const [ay, am, ad] = a.split('-').map(Number), [by, bm, bd] = b.split('-').map(Number);
  return Math.round((new Date(by, bm - 1, bd) - new Date(ay, am - 1, ad)) / 86400000);
}
function weekdayIdx(dateKey) {
  const [y, m, d] = dateKey.split('-').map(Number);
  return (new Date(y, m - 1, d).getDay() + 6) % 7; // 0 = Monday
}
function startOfWeek(dateKey) { return addDays(dateKey, -weekdayIdx(dateKey)); }
function formatLongDate(dateKey) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
  const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY',
    'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
  return `${days[dt.getDay()]}, ${months[dt.getMonth()]} ${dt.getDate()}`;
}

function formatDateLabel(dateKey) {
  const t = todayKey();
  if (dateKey === t) return 'Today';
  if (dateKey === addDays(t, -1)) return 'Yesterday';
  if (dateKey === addDays(t, 1)) return 'Tomorrow';
  const [y, m, d] = dateKey.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function formatShort(dateKey) {
  const [y, m, d] = dateKey.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function dayOfMonth(dateKey) { return Number(dateKey.split('-')[2]); }
function round(n, p) { p = p || 0; const f = Math.pow(10, p); return Math.round((n + Number.EPSILON) * f) / f; }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// For values interpolated into an inline on*="fn('...')" handler. esc() is the
// WRONG tool there: the HTML parser decodes entities before the JS is parsed,
// so an escaped quote turns back into a real quote and still breaks out of the
// string. Ids are opaque tokens, so reduce them to a safe alphabet instead.
function jsId(v) { return String(v == null ? '' : v).replace(/[^A-Za-z0-9_:.-]/g, ''); }

// ---------------------------------------------------------------------
// Serving units
//
// Nutrition data is per 100g, so every unit resolves to grams. "serving" is
// only offered when the food declares a serving weight; otherwise there is
// nothing to convert against.
// ---------------------------------------------------------------------
const GRAMS_PER_OZ = 28.349523125;
const GRAMS_PER_LB = 453.59237;

function unitToGrams(amount, unit, servingGrams) {
  const n = Number(amount) || 0;
  if (unit === 'oz') return n * GRAMS_PER_OZ;
  if (unit === 'lb') return n * GRAMS_PER_LB;
  if (unit === 'serving') return n * (Number(servingGrams) || 0);
  return n; // grams
}

function unitsFor(food) {
  const base = ['g', 'oz', 'lb'];
  return (food && Number(food.servingGrams) > 0) ? base.concat(['serving']) : base;
}

// Macros for a given amount of a per-100g food.
function macrosFor(food, amount, unit) {
  const g = unitToGrams(amount, unit, food.servingGrams);
  return {
    calories: round((food.caloriesPer100 * g) / 100),
    protein: round((food.proteinPer100 * g) / 100, 1),
    carbs: round((food.carbsPer100 * g) / 100, 1),
    fat: round((food.fatPer100 * g) / 100, 1),
    fiber: round(((food.fiberPer100 || 0) * g) / 100, 1),
  };
}

// No user-set fibre goal: the standard recommendation is 14g per 1000 kcal,
// so it follows the calorie target rather than being another thing to tune.
function fiberTarget() {
  const cal = (S.targets && S.targets.calories) || 0;
  return round((cal / 1000) * 14, 1);
}

function amountLabel(amount, unit, servingGrams) {
  const n = round(Number(amount) || 0, 2);
  if (unit === 'serving') {
    const g = round(unitToGrams(n, unit, servingGrams));
    return `${n} serving${n === 1 ? '' : 's'} · ${g}g`;
  }
  return `${n}${unit}`;
}

function bmrMifflin(p) {
  const kg = p.weightLbs / 2.20462, cm = p.heightIn * 2.54;
  const base = 10 * kg + 6.25 * cm - 5 * p.age;
  return p.sex === 'male' ? base + 5 : base - 161;
}
const ACTIVITY = {
  sedentary: { label: 'Sedentary (desk job, little exercise)', mult: 1.2 },
  light: { label: 'Light activity (1-3 workouts/week)', mult: 1.375 },
  moderate: { label: 'Moderate activity (3-5 workouts/week)', mult: 1.55 },
  active: { label: 'Active (6-7 workouts/week)', mult: 1.725 },
  veryactive: { label: 'Very active (physical job + training)', mult: 1.9 },
};

function computeTrendSeries(points, alpha) {
  alpha = alpha || 0.12;
  let ema = null;
  return points.map((p) => { ema = ema === null ? p.weight : alpha * p.weight + (1 - alpha) * ema; return Object.assign({}, p, { trend: round(ema, 1) }); });
}
function linRegSlope(points) {
  const n = points.length;
  if (n < 2) return 0;
  let sx = 0, sy = 0, sxy = 0, sxx = 0;
  points.forEach(({ x, y }) => { sx += x; sy += y; sxy += x * y; sxx += x * x; });
  const denom = n * sxx - sx * sx;
  return denom === 0 ? 0 : (n * sxy - sx * sy) / denom;
}
function dayTotals(dayLog) {
  const foods = (dayLog && dayLog.foods) || [];
  return foods.reduce((a, f) => ({
    calories: a.calories + (f.calories || 0), protein: a.protein + (f.protein || 0),
    carbs: a.carbs + (f.carbs || 0), fat: a.fat + (f.fat || 0),
    fiber: a.fiber + (f.fiber || 0),
  }), { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 });
}

// Latest smoothed trend weight, or null if there aren't enough weigh-ins.
// profile.weightLbs is only ever written at onboarding, so using it directly
// means the formula keeps computing from your STARTING weight forever — BMR
// and the protein target both drift wrong as you gain or lose.
function currentWeightLbs() {
  const keys = Object.keys(S.logs || {}).sort();
  const pts = keys.filter((k) => S.logs[k] && S.logs[k].weightLbs != null)
    .map((k) => ({ date: k, weight: S.logs[k].weightLbs }));
  if (!pts.length) return null;
  const trend = computeTrendSeries(pts);
  return trend[trend.length - 1].trend;
}

function estimateFromFormula(profile) {
  const liveWeight = currentWeightLbs();
  if (liveWeight) profile = Object.assign({}, profile, { weightLbs: liveWeight });
  const bmr = bmrMifflin(profile);
  const tdee = bmr * ((ACTIVITY[profile.activityLevel] || ACTIVITY.moderate).mult);
  const desiredDailyBalance = (profile.goalRateLbsPerWeek * 3500) / 7;
  const targetCalories = Math.max(tdee + desiredDailyBalance, 1200);
  const proteinG = profile.proteinPerLb * profile.weightLbs;
  const fatG = (targetCalories * profile.fatPercent) / 9;
  const carbsG = Math.max(0, (targetCalories - proteinG * 4 - fatG * 9) / 4);
  return { ok: true, source: 'formula', calories: round(targetCalories), protein: round(proteinG), fat: round(fatG), carbs: round(carbsG), estimatedTDEE: round(tdee), date: todayKey() };
}

function estimateFromData(logs, profile, windowSize, minDays) {
  windowSize = windowSize || 14; minDays = minDays || 7;
  const dateKeys = Object.keys(logs).sort();
  const withWeight = dateKeys.filter((k) => logs[k] && logs[k].weightLbs != null).map((k) => ({ date: k, weight: logs[k].weightLbs }));
  if (withWeight.length < 2) return { ok: false, reason: 'noweight', daysLogged: 0 };
  const trendSeries = computeTrendSeries(withWeight);
  const trendByDate = Object.fromEntries(trendSeries.map((p) => [p.date, p.trend]));

  // Anchor the window to TODAY, not to the last day that happens to have an
  // entry. Anchoring to the last logged day meant that after a month away the
  // estimate was still computed over that old month and reported confidently
  // as "last 14 days"; now the minimum-days guard correctly fails instead.
  const windowEnd = todayKey();
  const windowStart = addDays(windowEnd, -(windowSize - 1));
  const inWindow = (k) => k >= windowStart && k <= windowEnd;
  const hasFood = (k) => logs[k] && logs[k].foods && logs[k].foods.length > 0;
  const hasWeight = (k) => logs[k] && logs[k].weightLbs != null;

  // Trust needs days where BOTH were recorded; that is what the guard counts.
  const pairedDays = dateKeys.filter((k) => inWindow(k) && hasFood(k) && hasWeight(k));
  if (pairedDays.length < minDays) return { ok: false, reason: 'need', daysLogged: pairedDays.length, minDays };

  // Slope over every weigh-in in the window, regressed on RAW weights.
  //
  // This previously regressed the EMA trend, which double-smooths: the EMA
  // (alpha 0.12, ~8-day time constant) lags the real decline, so its slope is
  // materially shallower than the truth. On a controlled series falling
  // exactly 0.1 lb/day at exactly 2000 kcal — true maintenance 2350 — that
  // lag reported -0.38 lb/wk instead of -0.7 and a TDEE of 2192, understating
  // maintenance by ~158 kcal/day and so understating the target every time.
  // Least-squares regression is itself a smoother; feeding it pre-smoothed
  // input buys nothing and costs accuracy. The EMA is still what the weight
  // chart and trend-weight readout use.
  const weighDays = dateKeys.filter((k) => inWindow(k) && hasWeight(k));
  const slopePerDay = linRegSlope(weighDays.map((k) => ({ x: daysBetween(weighDays[0], k), y: logs[k].weightLbs })));
  const weeklyRateActual = slopePerDay * 7;

  // Intake over every day in the window with food. Averaging only over days
  // that ALSO had a weigh-in biased the estimate whenever eating and
  // weighing habits differed — the food on unweighed days still drove the
  // weight change being measured.
  const foodDays = dateKeys.filter((k) => inWindow(k) && hasFood(k));
  const avgIntake = foodDays.reduce((sum, k) => sum + dayTotals(logs[k]).calories, 0) / foodDays.length;

  // A pound of fat is ~3500 kcal, so a slope of x lb/day is x*3500 kcal/day
  // of surplus or deficit relative to maintenance.
  const estimatedTDEE = avgIntake - slopePerDay * 3500;
  const currentTrendWeight = trendSeries[trendSeries.length - 1].trend;
  const desiredDailyBalance = (profile.goalRateLbsPerWeek * 3500) / 7;
  const targetCalories = Math.max(estimatedTDEE + desiredDailyBalance, 1200);
  const proteinG = profile.proteinPerLb * currentTrendWeight;
  const fatG = (targetCalories * profile.fatPercent) / 9;
  const carbsG = Math.max(0, (targetCalories - proteinG * 4 - fatG * 9) / 4);

  return {
    ok: true, source: 'data', calories: round(targetCalories), protein: round(proteinG), fat: round(fatG), carbs: round(carbsG),
    estimatedTDEE: round(estimatedTDEE), weeklyRateActual: round(weeklyRateActual, 2), daysUsed: pairedDays.length,
    intakeDays: foodDays.length, windowSize,
    currentTrendWeight: round(currentTrendWeight, 1), avgIntake: round(avgIntake), date: todayKey(),
  };
}

// ---------------------------------------------------------------------
// Tiny inline SVG chart builders (no chart library — kept dependency-free)
// CSS variables aren't reliably resolved inside raw SVG attributes across
// browsers, so these use plain hex values matching the CSS custom properties.
// ---------------------------------------------------------------------
const COLOR_LIGHT = { ink: '#1C2321', line: '#E4E0D6', lineStrong: '#D4CFC2', teal: '#2D5D5E', tan: '#B8AF9E', brick: '#B75139', green: '#4C7A51', amber: '#C99A2E', carbs: '#2F8F5B', calories: '#3E6FD9' };
const COLOR_DARK = { ink: '#F1F0EA', line: '#2B2F2E', lineStrong: '#383D3B', teal: '#5FA8A6', tan: '#93897A', brick: '#E08469', green: '#7FB584', amber: '#E8B94A', carbs: '#63C48D', calories: '#6C93E8' };

function colors() { return currentTheme === 'dark' ? COLOR_DARK : COLOR_LIGHT; }
const COLOR = new Proxy({}, { get(_, key) { return colors()[key]; } });

  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const step = values.length > 1 ? w / (values.length - 1) : 0;
  const pts = values.map((v, i) => `${round(i * step, 1)},${round(h - ((v - min) / range) * (h - 6) - 3, 1)}`);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function svgTrendChart(rawPoints, trendPoints, opts) {
  opts = opts || {};
  const w = opts.w || 320, h = opts.h || 160, pad = 8;
  if (trendPoints.length < 1) return `<svg width="${w}" height="${h}"></svg>`;
  const all = rawPoints.concat(trendPoints);
  const min = Math.min(...all) - 1.5, max = Math.max(...all) + 1.5;
  const range = (max - min) || 1;
  const n = trendPoints.length;
  const step = n > 1 ? (w - pad * 2) / (n - 1) : 0;
  const x = (i) => round(pad + i * step, 1);

  const grid = gridY.map((gy) => `<line x1="0" y1="${gy}" x2="${w}" y2="${gy}" stroke="${COLOR.line}" stroke-width="1"/>`).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${grid}

function svgBarChart(values, opts) {
  opts = opts || {};
  const w = opts.w || 320, h = opts.h || 100, pad = 4;
  if (!values.length) return `<svg width="${w}" height="${h}"></svg>`;
  const maxAbs = Math.max(1, ...values.map((v) => Math.abs(v)));
  const zeroY = h / 2;
  const bw = (w - pad * 2) / values.length;
  const bars = values.map((v, i) => {
    const barH = (Math.abs(v) / maxAbs) * (h / 2 - 8);
    const bx = round(pad + i * bw + bw * 0.2, 1);
    const bwActual = round(bw * 0.6, 1);
    const by = v >= 0 ? round(zeroY - barH, 1) : zeroY;
    const color = v > 0 ? COLOR.amber : COLOR.teal;
    return `<rect x="${bx}" y="${by}" width="${bwActual}" height="${round(barH, 1)}" rx="2" fill="${color}"/>`;
  }).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="0" y1="${zeroY}" x2="${w}" y2="${zeroY}" stroke="${COLOR.lineStrong}" stroke-width="1"/>
    ${bars}
  </svg>`;
}

// An open-bottom arc rather than a closed ring: the gap gives the two side
// readings somewhere to sit, and the ends read as a scale rather than a pie.
function svgArcGauge(pct, opts) {
  opts = opts || {};
  const size = opts.size || 220, stroke = opts.stroke || 13;
  const color = opts.color || COLOR.calories;
  const r = (size - stroke) / 2, c = size / 2;
  const gap = 100;                    // degrees of opening at the bottom
  const sweep = 360 - gap;
  const start = 90 + gap / 2;         // clockwise from bottom-left
  const rad = (d) => (d * Math.PI) / 180;
  const pt = (d) => `${round(c + r * Math.cos(rad(d)), 2)},${round(c + r * Math.sin(rad(d)), 2)}`;
  const track = `M${pt(start)} A${r} ${r} 0 1 1 ${pt(start + sweep)}`;
  const len = (sweep / 360) * 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="gauge-svg">
    <path d="${track}" fill="none" stroke="${COLOR.lineStrong}" stroke-width="${stroke}" stroke-linecap="round" opacity="0.5"/>
    <path d="${track}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${round(len, 1)}" stroke-dashoffset="${round(len * (1 - clamp(pct, 0, 1)), 1)}"/>
  </svg>`;
}

function svgRing(pct, opts) {
  opts = opts || {};
  const size = opts.size || 34, stroke = opts.stroke || 3.5, color = opts.color || COLOR.teal;
  const r = (size - stroke) / 2, c = size / 2, circ = 2 * Math.PI * r;
  const filled = clamp(pct, 0, 1) * circ;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${COLOR.line}" stroke-width="${stroke}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${round(filled, 1)} ${round(circ, 1)}" stroke-linecap="round"/>
  </svg>`;
}

function svgBarWithReference(values, refValue, opts) {
  opts = opts || {};
  const w = opts.w || 320, h = opts.h || 108, pad = 4;
  if (!values.length) return `<svg width="${w}" height="${h}"></svg>`;
  const maxVal = Math.max(refValue, ...values, 1) * 1.15;
  const bw = (w - pad * 2) / values.length;
  const bars = values.map((v, i) => {
    const barH = Math.max(v > 0 ? 2 : 0, (v / maxVal) * (h - 10));
    const bx = round(pad + i * bw + bw * 0.15, 1);
    const bwActual = round(bw * 0.7, 1);
    const by = round(h - barH, 1);
    return `<rect x="${bx}" y="${by}" width="${bwActual}" height="${round(barH, 1)}" rx="1.5" fill="${COLOR.calories}"/>`;
  }).join('');
  const refY = round(h - (refValue / maxVal) * (h - 10), 1);
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${bars}
    <line x1="0" y1="${refY}" x2="${w}" y2="${refY}" stroke="${COLOR.amber}" stroke-width="1.5" stroke-dasharray="3,3"/>
  </svg>`;
}

// ---------------------------------------------------------------------
// Log storage: one Firestore document per month
//
// Logs previously lived as a single `logs` map on the user document, so every
// food added rewrote the entire history. Firestore caps a document at 1 MiB —
// roughly 4,000 entries — after which every write fails. Months are separate
// documents, so a write only rewrites the month it touched.
//
// knownShardMonths tracks months that exist server-side, including any whose
// last entry was just deleted: those still need an (empty) write, and they
// wouldn't appear in a scan of S.logs.
// ---------------------------------------------------------------------
function monthOf(dateKey) { return String(dateKey).slice(0, 7); }

function shardFor(month) {
  const days = {};
  Object.keys(S.logs).forEach((dk) => { if (monthOf(dk) === month) days[dk] = S.logs[dk]; });
  return days;
}

// months omitted = rewrite everything (import, restore, reset).
function persistLogs(months) {
  if (!currentUid) return;
  const live = new Set(Object.keys(S.logs).map(monthOf));
  const target = months ? new Set(months) : new Set([...live, ...knownShardMonths]);
  const shards = {};
  target.forEach((m) => {
    if (!/^\d{4}-\d{2}$/.test(m)) return;
    shards[m] = shardFor(m);
    knownShardMonths.add(m);
  });
  if (!Object.keys(shards).length) return;

  pendingWrites++;
  updateSyncIndicator();
  Promise.resolve(window.FB.writeLogShards(currentUid, shards))
    .then(() => { pendingWrites = Math.max(0, pendingWrites - 1); updateSyncIndicator(); })
    .catch((e) => {
      pendingWrites = Math.max(0, pendingWrites - 1);
      updateSyncIndicator();
      console.error('log save failed', e);
      toast('Could not save — your change is stored on this device only.');
    });
}
function persistSavedFoods() { saveField('savedFoods', S.savedFoods); }
function persistRecipes() { saveField('recipes', S.recipes); }
function persistProfile() { saveField('profile', S.profile); }
function persistTargets() { saveField('targets', S.targets); }
// Number of writes queued locally but not yet acknowledged by the server.
let pendingWrites = 0;

// With persistent caching on, setUserDoc resolves only when the SERVER
// acknowledges. Offline that can be hours, so this deliberately does NOT
// await it before returning — the write is already durable in IndexedDB, and
// blocking here would freeze the UI. We track the promise purely to drive the
// "syncing / offline" indicator, and only surface a real error.
function saveField(key, value) {
  if (!currentUid) return;
  pendingWrites++;
  updateSyncIndicator();
  Promise.resolve(window.FB.setUserDoc(currentUid, { [key]: value }))
    .then(() => {
      pendingWrites = Math.max(0, pendingWrites - 1);
      updateSyncIndicator();
    })
    .catch((e) => {
      pendingWrites = Math.max(0, pendingWrites - 1);
      updateSyncIndicator();
      // A rejection here is a genuine failure (permissions, quota, malformed
      // data) — not merely being offline, which queues instead of rejecting.
      console.error('save failed', key, e);
      toast('Could not save — your change is stored on this device only.');
    });
}

function getDayLog(dateKey) { return S.logs[dateKey] || { weightLbs: null, foods: [] }; }
function setDayLog(dateKey, next) {

}

async function loadLogShards(uid) {
  const logs = {};
  try {
    const snap = await window.FB.getLogShards(uid);
    snap.forEach((d) => {
      knownShardMonths.add(d.id);
      Object.assign(logs, (d.data() || {}).days || {});
    });
  } catch (e) {
    console.error('could not read log shards', e);
  }
  return logs;
}

// One-time move of the legacy `logs` map into month documents.
//
// Ordering is the whole point: shards are written and ACKNOWLEDGED before the
// old field is cleared. If this is interrupted — killed app, dead connection —
// the worst case is data existing in both places, which the loader merges
// harmlessly. It never deletes first.
//
// Runs only while online. Offline, the shard write would sit in the queue
// unacknowledged and the clear must not proceed on faith.
async function migrateLogsToShards(uid) {
  if (!navigator.onLine) return;
  const months = new Set(Object.keys(S.logs).map(monthOf));
  const shards = {};
  months.forEach((m) => { if (/^\d{4}-\d{2}$/.test(m)) shards[m] = shardFor(m); });
  if (!Object.keys(shards).length) {
    try { await window.FB.clearLegacyLogs(uid); } catch (e) { /* retried next boot */ }
    return;
  }
  try {
    await window.FB.writeLogShards(uid, shards);   // must be acknowledged first
    Object.keys(shards).forEach((m) => knownShardMonths.add(m));
    await window.FB.clearLegacyLogs(uid);          // only now is it safe
    console.info(`migrated ${Object.keys(S.logs).length} days into ${Object.keys(shards).length} month shards`);
  } catch (e) {
    // Legacy data is untouched, so the next sign-in simply tries again.
    console.error('log migration deferred:', e);
  }

// ---------------------------------------------------------------------
// Auth-gated boot: wait for Firebase to report sign-in state, then load
// that account's data from Firestore before rendering the app.
// ---------------------------------------------------------------------
// One definition of "no account loaded". Hydration used to assign each field
// only on the paths that found data, so switching accounts with no signed-out
// event in between — or a load that threw — left the previous account's profile,
// logs and saved foods in memory, rendered them under the new account, and
// persisted them into it on the next write. Clearing once, up front, makes that
// impossible to reintroduce one field at a time.
// The empty value of every account-owned field, in one place. clearAccountState
// applies it locally; resetAllData writes the same shape to the server, so a
// field added here cannot be cleared on the device while surviving in Firestore.

  return { profile: null, targets: null, logs: {}, savedFoods: [], recipes: [] };

  Object.assign(S, emptyAccountFields());

window.onAuthReady = async function (user) {

    clearAccountState();
    render(); return;

  currentUid = user.uid;
  // Cleared before the first await, so nothing renders in between: a normal
  // sign-in never shows the app blank and then refilling.
  clearAccountState();
  try {
    const snap = await window.FB.getUserDoc(user.uid);
    if (snap.exists()) {
      const data = snap.data();
      S.profile = data.profile || null;
      S.targets = data.targets || null;
      S.savedFoods = data.savedFoods || [];
      // Accounts created before recipes existed simply have no field here.
      S.recipes = cleanRecipes(data.recipes);

      // Month shards are the source of truth. A legacy `logs` map means this
      // account hasn't migrated yet.
      const sharded = await loadLogShards(user.uid);
      const legacy = data.logs || null;
      if (legacy && Object.keys(legacy).length) {
        // Shards win on conflict — they're necessarily newer than the field
        // they replaced.
        S.logs = Object.assign({}, legacy, sharded);
        migrateLogsToShards(user.uid);   // background; never blocks the UI
      } else {
        S.logs = sharded;
      }
    } else {
      // State is already empty from clearAccountState() above — including
      // recipes, which have no pre-Firebase local key to recover from.

      // Brand new account — check for pre-existing local data from before
      // Firebase was added, and offer it a home instead of losing it.
      const localProfile = readKey('profile');
      if (localProfile) {
        S.profile = localProfile;

// Food search: USDA FoodData Central.
//
// Open Food Facts is NOT usable for search from a browser. Its legacy
// cgi/search.pl and api/v2/search endpoints return 503 to any request with an
// Origin header, and the newer search.openfoodfacts.org returns 200 but sends
// no Access-Control-Allow-Origin, so the browser blocks it. USDA sends
// `access-control-allow-origin: *` and has far better US and whole-food data.
// Barcode lookup still uses OFF's api/v2/product/{code}, which does send CORS
// headers and works fine.
//
// DEMO_KEY works but is rate-limited to ~30 requests/hour per IP. Get a free
// key (instant, no cost) at https://fdc.nal.usda.gov/api-key-signup.html and
// paste it here. This key is visible in the public repo; that is acceptable
// for a free, rate-limited, read-only data key.
const USDA_API_KEY = 'EDdkGrde3PUh9QN5I88VgtBcIgO8Jw3GgtX1pnBm';

// USDA returns Energy twice (KCAL and kJ), so match on unit, not just name.
function usdaNutrient(food, name, unit) {
  const list = food.foodNutrients || [];
  const hit = list.find((n) => n.nutrientName === name && (!unit || String(n.unitName).toUpperCase() === unit));
  return hit && typeof hit.value === 'number' ? hit.value : null;
}

function mapUsdaFood(f) {
  const protein = Math.max(0, usdaNutrient(f, 'Protein', 'G') || 0);
  const fat = Math.max(0, usdaNutrient(f, 'Total lipid (fat)', 'G') || 0);
  const carbs = Math.max(0, usdaNutrient(f, 'Carbohydrate, by difference', 'G') || 0);
  const fiber = Math.max(0, usdaNutrient(f, 'Fiber, total dietary', 'G') || 0);
  // Some Foundation entries carry macros but no Energy row. Fall back to
  // Atwater factors (4/4/9) rather than dropping an otherwise good result.
  let calories = usdaNutrient(f, 'Energy', 'KCAL');
  if (calories == null) calories = protein * 4 + carbs * 4 + fat * 9;
  const brand = f.brandName || f.brandOwner || '';
  return {
    id: String(f.fdcId), name: f.description || '',
    brand: brand ? String(brand).trim() : '',
    dataType: f.dataType || '',
    caloriesPer100: calories, proteinPer100: protein,
    carbsPer100: carbs, fatPer100: fat, fiberPer100: fiber,
    // Branded items usually declare a label serving; curated ones don't.
    servingGrams: usdaServingGrams(f),
    servingLabel: f.householdServingFullText || '',
  };
}

// USDA gives servingSize + servingSizeUnit on Branded foods. Only mass units
// are usable here: "1 cup" or "3 pieces" can't be converted to grams without
// a density we don't have.
function usdaServingGrams(f) {
  const size = Number(f.servingSize);
  if (!size || !isFinite(size) || size <= 0) return null;
  const unit = String(f.servingSizeUnit || '').toLowerCase();
  if (unit === 'g' || unit === 'gram' || unit === 'grams') return size;
  if (unit === 'oz') return size * GRAMS_PER_OZ;
  if (unit === 'lb') return size * GRAMS_PER_LB;
  // ml is treated as grams only for the purposes of a rough serving; skip it
  // rather than invent a density.
  return null;
}

// USDA's Branded tier is crowdsourced from label scans and contains entries
// with impossible values (e.g. an oatmeal listed at 1580 kcal/100g). Nothing
// edible exceeds ~900 kcal/100g, which is pure fat.
function plausibleFood(f) {
  return f.name && f.caloriesPer100 > 0 && f.caloriesPer100 <= 900;
}

// Ranking: whole foods first, then prepared/packaged, then branded.
//
// Data tier alone isn't enough. USDA's curated tiers also contain restaurant
// and snack items, so a tier sort puts "Cookies, oatmeal" above actual oats.
// Score on the food's character as well as its source.
// Coarse rank only. Foundation and SR Legacy share a value: both are curated
// whole-food data and the difference is vintage, not food quality. Ranking
// them apart here let "Flour, bread, white" (Foundation) beat "Bread, white
// wheat" (SR Legacy) on dataset age alone. Foundation still wins ties, but as
// a late tiebreaker in the sort, after relevance.
const USDA_TIER = { 'Foundation': 0, 'SR Legacy': 0, 'Survey (FNDDS)': 1, 'Branded': 2 };
const USDA_TIER_FINE = { 'Foundation': 0, 'SR Legacy': 1, 'Survey (FNDDS)': 2, 'Branded': 3 };

// Prefer the plain form of a food. Between "Bananas, raw" and "Bananas,
// dehydrated, or banana powder", you almost always want the former.
const PROCESSED_QUALIFIERS = /\b(dehydrated|powder|dried|canned|imitation|breaded|nuggets|patties|frozen|toasted|leaves|sprouted|infant|baby)\b/;
function formScore(f) {
  const desc = String(f.name).toLowerCase();
  let s = /,\s*raw\b/.test(desc) ? 0 : 1;
  if (PROCESSED_QUALIFIERS.test(desc)) s += 3;
  return s;
}

// USDA descriptions are "Category, qualifier, qualifier". These leading
// categories are prepared, restaurant, or confectionery foods.
const PREPARED_PREFIXES = [
  'restaurant,', 'fast foods,', 'fast food,', 'snacks,', 'cookies,', 'candies,',
  'cake,', 'pie,', 'pastries,', 'crackers,', 'beverages,', 'alcoholic beverage',
  'babyfood,', 'formulated bar', 'toppings,', 'sauces,', 'gravy,', 'soup,',
];

// Restaurant dishes name their components ("chicken tenderloin platter"), so
// they can match a query word-for-word while being the wrong kind of food.
const DISH_WORDS = /\b(platter|sandwich|burrito|taco|pizza|nuggets|entree|meal|fried|breaded|casserole|salad with|sub|wrap)\b/;
function isPrepared(f) {
  const desc = String(f.name).toLowerCase();
  return PREPARED_PREFIXES.some((p) => desc.startsWith(p)) || DISH_WORDS.test(desc);
}

function usdaRank(f) {
  const tier = USDA_TIER[f.dataType];
  let score = (tier === undefined ? 4 : tier) * 10;
  if (isPrepared(f)) score += 25;
  return score;
}

// Within a rank, prefer entries where the search term is the food's head noun
// rather than a modifier. USDA writes "Category, qualifier, qualifier", so a
// comma right after the term means the term IS the food: "Rice, white,
// long-grain" is rice, while "Rice crackers" is a cracker. Ties then fall back
// to how much of the query the description actually covers.
// English compounds put the head noun last ("ground BEEF", "whole MILK",
// "olive OIL"); USDA puts it first ("Beef, ground", "Milk, whole", "Oil,
// olive"). So test both ends of the query against the description's head
// segment and take whichever matches better.
// How many of the query's words the description doesn't mention at all.
// Plural-aware: searching "tenderloins" must still match "tenderloin".
// Matching text is name + brand. Branded products put the brand in its own
// field — Just Bare's item is named "Lightly Breaded Chicken Breast Bites" —
// so scoring the name alone made a search for the brand look like a total
// mismatch and buried the right product.
function matchText(f) {
  return `${String(f.name || '')} ${String(f.brand || '')}`.toLowerCase();
}

function missingWords(f, query) {
  const desc = matchText(f);
  const words = String(query).toLowerCase().trim().split(/\s+/).filter(Boolean);
  return words.filter((w) => !desc.includes(w) && !desc.includes(w.replace(/s$/, ''))).length;
}

function queryAffinity(f, query) {
  const desc = String(f.name).toLowerCase();
  const words = String(query).toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!words.length) return 9;
  const brand = String(f.brand || '').toLowerCase();
  // A query that names the brand should reward the brand's products.
  const brandHit = brand && words.some((w) => brand.indexOf(w) >= 0)
    && words.filter((w) => brand.indexOf(w) >= 0).length >= Math.min(2, words.length);
  const segs = desc.split(/,\s*/);
  const head = segs[0];
  const same = (seg, w) => seg === w || seg === w + 's' || seg === w.replace(/s$/, '');
  const missing = missingWords(f, query);

  const scoreFor = (w) => {
    if (same(head, w)) return 0;
    // USDA files many foods under a category first ("Fish, salmon, ...",
    // "Nuts, almonds, ..."), so the real name is often the second segment.
    if (segs.length > 1 && same(segs[1], w)) return 1;
    if (desc.startsWith(w)) return 2;
    if (head.includes(w)) return 4;
    return 6;
  };
  // Last word first: it's the head noun in most compound food names.
  let base = Math.min(scoreFor(words[words.length - 1]), scoreFor(words[0]));
  if (brandHit) base = Math.min(base, 1);
  // Missing words are weighted heavily. USDA's search treats terms as
  // independent, so "chicken tenderloins" returns pork and ostrich tenderloin;
  // an entry that ignores half the query should not outrank one that matches.
  return base + missing * 4;
}

async function usdaQuery(query, dataType, pageSize) {
  const params = new URLSearchParams({
    query, pageSize: String(pageSize), dataType, api_key: USDA_API_KEY,
  });
  const res = await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?${params}`);
  if (res.status === 429) throw new Error('rate-limited');
  if (!res.ok) throw new Error(`search failed: ${res.status}`);
  const data = await res.json();
  return data.foods || [];
}

// ---------------------------------------------------------------------
// Open Food Facts — branded and store products
//
// USDA is the better source for whole foods; OFF is the better source for
// the packaged, store-brand half of a real shopping basket. Searching
// "chicken bites" or "members mark chicken" returns a thousand real products
// from OFF and generic poultry from USDA, so both run and the results merge.
//
// Reaching OFF from a browser needs care, and it is easy to misread. The
// endpoint DOES send `access-control-allow-origin: *` — but it rate-limits
// aggressively, returning a CORS-less 503 for bursts of requests. Sampling
// during one of those windows looks exactly like a hard CORS block. Measured
// over repeated runs it succeeds roughly 80% of the time per attempt, so a
// few spaced retries make it reliable, and failure is always swallowed:
// a bad response costs branded rows, never an error.
// ---------------------------------------------------------------------
const OFF_HOST = 'https://world.openfoodfacts.org';

// OFF's full-text search narrows hard with each extra word: "just bare"
// returns 94 real products, "just bare chicken" returns none. Brand-style
// queries are usually the first word or two, so fall back to a shorter phrase
// rather than showing nothing.
async function offQuery(query, pageSize) {
  const words = String(query).trim().split(/\s+/).filter(Boolean);
  const attempts = [query];
  if (words.length > 2) attempts.push(words.slice(0, 2).join(' '));
  if (words.length > 1) attempts.push(words[0]);
  for (const term of attempts) {
    const found = await offFetch(term, pageSize);
    if (found.length) return found;
  }
  return [];
}

async function offFetch(query, pageSize) {
  const url = `${OFF_HOST}/cgi/search.pl?search_terms=${encodeURIComponent(query)}`
    + `&search_simple=1&action=process&json=1&page_size=${pageSize}`;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 7000);
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(timer);
      if (res.ok) return (await res.json()).products || [];
      // 503 here is rate limiting, not refusal — back off briefly and retry.
      if (res.status !== 503) return [];
    } catch (err) { /* timeout or network — retry */ }
    await new Promise((r) => setTimeout(r, 350 * (attempt + 1)));
  }
  return [];
}

function mapOffFood(p) {
  const n = p.nutriments || {};
  const kcal = Number(n['energy-kcal_100g']);
  const sq = Number(p.serving_quantity);
  const squ = String(p.serving_quantity_unit || 'g').toLowerCase();
  return {
    id: `off:${p.code || p._id || p.product_name}`,
    name: p.product_name || '',
    brand: p.brands ? String(p.brands).split(',')[0].trim() : '',
    dataType: 'Branded',
    source: 'off',
    caloriesPer100: isFinite(kcal) ? kcal : 0,
    proteinPer100: Number(n.proteins_100g) || 0,
    carbsPer100: Number(n.carbohydrates_100g) || 0,
    fatPer100: Number(n.fat_100g) || 0,
    fiberPer100: Math.max(0, Number(n.fiber_100g) || 0),
    servingGrams: (sq > 0 && (squ === 'g' || squ === 'gram' || squ === 'grams')) ? sq : null,
  };
}

async function searchFoods(query) {
  // Two separate requests rather than one combined query. For terms like
  // "ground beef" or "whole milk", USDA's relevance ranking returns nothing
  // but Branded entries, so a single call yields no curated candidates to
  // promote no matter how deep the pool. Asking for the curated datasets
  // explicitly guarantees whole foods are always in the running.
  const [curatedR, brandedR, offR] = await Promise.allSettled([
    usdaQuery(query, 'Foundation,SR Legacy', 40),
    usdaQuery(query, 'Branded', 25),
    offQuery(query, 25),
  ]);
  // USDA curated is the primary source; OFF and USDA-branded are additive and
  // never fatal.
  if (curatedR.status === 'rejected') throw curatedR.reason;
  const curated = curatedR.value;
  const branded = brandedR.status === 'fulfilled' ? brandedR.value : [];
  const offRaw = offR.status === 'fulfilled' ? offR.value : [];
  // De-dupe by fdcId, curated winning any collision.
  const seen = new Set();
  const take = (list) => list.map(mapUsdaFood).filter((f) => {
    if (seen.has(f.id)) return false;
    seen.add(f.id);
    return plausibleFood(f);
  });
  let mapped = take(curated.concat(branded));

  // Fold OFF in, skipping products USDA already returned under the same name.
  const haveNames = new Set(mapped.map((f) => normFoodName(f.name)));
  offRaw.map(mapOffFood).forEach((f) => {
    const key = normFoodName(f.name);
    if (!f.name || !key || haveNames.has(key) || seen.has(f.id)) return;
    if (!plausibleFood(f)) return;
    haveNames.add(key); seen.add(f.id);
    mapped.push(f);
  });

  // USDA matches query words independently, so "chicken tenderloins" comes
  // back as pork, beef, and ostrich tenderloin with barely any chicken. When
  // the results largely ignore the leading noun, ask again for just that noun
  // so there is something on-topic to rank.
  const words = String(query).toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (words.length > 1) {
    const noun = words[0].replace(/s$/, '');
    const onTopic = mapped.filter((f) => f.name.toLowerCase().includes(noun));
    if (onTopic.length < 5) {
      try {
        mapped = mapped.concat(take(await usdaQuery(words[0], 'Foundation,SR Legacy', 25)));
      } catch (err) { /* fallback is best-effort; keep what we have */ }
    }
  }

  // Stable sort: rank, then query affinity, then USDA's own relevance order.
  return mapped
    .map((f, i) => ({
      f, i, r: usdaRank(f), a: queryAffinity(f, query),
      s: formScore(f), t: USDA_TIER_FINE[f.dataType] ?? 4,
      // Primary key: is this the food you asked for? Missing query words count
      // against it, and so does being a prepared dish — otherwise "chicken
      // tenderloin platter, fried" wins on an exact word match over plain
      // chicken. A curated "Ostrich, tenderloin" still loses to either.
      m: missingWords(f, query) + (isPrepared(f) ? 1 : 0),
    }))
    .sort((x, y) => (x.m - y.m) || (x.r - y.r)
      || ((x.a * 2 + x.s) - (y.a * 2 + y.s)) || (x.t - y.t) || (x.i - y.i))
    .map((x) => x.f)
    .slice(0, 20);
}

        ${S.authError ? `<div class="t12 mt2" style="color:var(--brick);">${esc(S.authError)}</div>` : ''}

function toggleAuthMode() {
  S.authMode = S.authMode === 'signup' ? 'signin' : 'signup';

}
window.toggleAuthMode = toggleAuthMode;

async function submitAuth() {
  const email = (document.getElementById('auth-email').value || '').trim();
  const password = document.getElementById('auth-password').value || '';
  if (!email || !password) { S.authError = 'Enter both an email and a password.'; render(); return; }
  S.authBusy = true; S.authError = null; render();
  try {
    if (S.authMode === 'signup') await window.FB.createUser(email, password);
    else await window.FB.signIn(email, password);
    // onAuthReady fires automatically from the auth-state listener once this resolves.
  } catch (e) {
    S.authBusy = false;
    S.authError = friendlyAuthError(e);
    render();
  }
}
window.submitAuth = submitAuth;

async function requestPasswordReset() {
  const email = (document.getElementById('auth-email').value || '').trim();
  if (!email) { S.authError = 'Enter your email above first, then tap "Forgot password?" again.'; render(); return; }
  try {
    await window.FB.resetPassword(email);
    toast('Password reset email sent');
  } catch (e) {
    S.authError = friendlyAuthError(e); render();
  }
}
window.requestPasswordReset = requestPasswordReset;

function signOutUser() {
  if (!confirm('Sign out of Tare?')) return;

}
